# Drop-in for the distro crowdsec-firewall-bouncer unit. Install to
# /etc/systemd/system/crowdsec-firewall-bouncer.service.d/restart.conf
# The LAPI runs in the crowdsec container on the Tailscale IP, so on boot the
# bouncer can start before it is reachable and exit for good (2026-09-29 to
# 2026-10-08 it stayed down). Order it after docker/tailscale and keep retrying.
[Unit]
After=docker.service tailscaled.service
Wants=tailscaled.service

[Service]
Restart=on-failure
RestartSec=30

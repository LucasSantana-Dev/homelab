global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: /metrics

  # Docker containers via cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    metrics_path: /metrics

  # Loki - Log aggregation metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    scrape_interval: 15s
    metrics_path: /metrics

  # Homelab services health check
  - job_name: 'homelab-services'
    static_configs:
      - targets:
          - 'homepage:3000'
          - 'homeassistant:8123'
          - 'portainer:9000'
          - 'pihole:8054'
          - 'grafana:3000'
          - 'uptime-kuma:3001'
          - 'whats-up-docker:3003'
          # Services without Prometheus metrics endpoints:
          # - 'filebrowser:80'
          # - 'vaultwarden:80' (minimal metrics)
          # - 'jellyfin:8096'
          # - 'n8n:5678'
    scrape_interval: 30s
    metrics_path: /metrics
    scheme: http

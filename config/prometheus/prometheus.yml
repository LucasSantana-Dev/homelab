global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - "alerts.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: /metrics

  # Docker containers via cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    metrics_path: /metrics

  # Loki - Log aggregation metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    scrape_interval: 15s
    metrics_path: /metrics

  # Alertmanager - Alert management metrics
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 15s
    metrics_path: /metrics

  # Lucky bot — /metrics exposed by prom-client (PR #873).
  # Requires the bot container to also be on the `lucky-monitoring`
  # external network so Prom can resolve `lucky-bot` by service DNS.
  - job_name: 'lucky-bot'
    static_configs:
      - targets: ['lucky-bot:9091']
        labels:
          service: 'lucky-bot'
          environment: 'production'
    scrape_interval: 15s
    metrics_path: /metrics

  # Lucky backend — /metrics exposed by prom-client (PR #875).
  # Backend listens on :3000 (not :5000) — wrong port left up=0 + empty
  # Lucky Application Metrics dashboard panels (2026-06-18 audit).
  - job_name: 'lucky-backend'
    static_configs:
      - targets: ['lucky-backend:3000']
        labels:
          service: 'lucky-backend'
          environment: 'production'
    scrape_interval: 15s
    metrics_path: /metrics

  # Blackbox Exporter - HTTP endpoint monitoring
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://homelab.example.com
          - https://stremio.homelab.example.com
          - https://homeassistant.homelab.example.com
          - https://grafana.homelab.example.com
          - https://portainer.homelab.example.com
          - https://jellyfin.homelab.example.com
          - https://n8n.homelab.example.com
          - https://cloud.homelab.example.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Grafana self-monitoring — exposes /metrics on :3000. Unblocks the Grafana
  # health panels in the monitoring dashboards (ADR-0023 audit found no scrape).
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
    scrape_interval: 15s
    metrics_path: /metrics

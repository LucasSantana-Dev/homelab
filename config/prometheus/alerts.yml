groups:
  - name: homelab_alerts
    interval: 30s
    rules:
      # Dead-man-switch heartbeat (ADR-0026). ALWAYS firing — vector(1) is constant.
      # Alertmanager routes it to the healthchecks ping URL ~every minute; if these
      # pings stop (Prometheus down, Alertmanager down, or routing broken) the
      # healthchecks check goes down and emails — independent of Discord (#296).
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alerting pipeline heartbeat (always firing). Its absence at the healthchecks dead-man-switch means the pipeline is broken."

      # Container Down Alerts
      - alert: CadvisorDown
        expr: up{job="cadvisor"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "cAdvisor container is down"
          description: "cAdvisor container has been down for more than 5 minutes."

      # High Memory Usage Alerts
      - alert: HighMemoryUsage
        expr: |
          (
            max by (name, image, instance, job) (
              container_memory_working_set_bytes{name!="", image!=""}
            )
            /
            max by (name, image, instance, job) (
              container_spec_memory_limit_bytes{name!="", image!=""}
            )
          ) > 0.9
          and on(name, image, instance, job)
          (
            max by (name, image, instance, job) (
              container_spec_memory_limit_bytes{name!="", image!=""}
            ) > 0
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} memory usage > 90%"
          description: "Container {{ $labels.name }} is using more than 90% of its memory limit."
          runbook: "`docker stats {{ $labels.name }}` — raise its mem_limit in compose or recreate it; a steady climb = leak."

      - alert: CriticalMemoryUsage
        expr: |
          (
            max by (name, image, instance, job) (
              container_memory_working_set_bytes{name!="", image!=""}
            )
            /
            max by (name, image, instance, job) (
              container_spec_memory_limit_bytes{name!="", image!=""}
            )
          ) > 0.95
          and on(name, image, instance, job)
          (
            max by (name, image, instance, job) (
              container_spec_memory_limit_bytes{name!="", image!=""}
            ) > 0
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} memory usage > 95%"
          description: "Container {{ $labels.name }} is using more than 95% of its memory limit."
          runbook: "`docker stats {{ $labels.name }}` — raise its mem_limit in compose or recreate it now; OOM-kill is imminent."

      # High CPU Usage Alerts
      - alert: HighCPUUsage
        # sum by (name) aggregates a container's cgroup series; name!="" drops the
        # root/system cgroups (which fired this alert with a blank container name).
        expr: sum by (name) (rate(container_cpu_usage_seconds_total{name!=""}[5m])) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} CPU usage > 80%"
          description: "Container {{ $labels.name }} is using more than 80% CPU for more than 5 minutes."
          runbook: "`docker stats {{ $labels.name }}` — find the hot container; check for a runaway loop or stuck job; restart if pegged."

      - alert: CriticalCPUUsage
        expr: sum by (name) (rate(container_cpu_usage_seconds_total{name!=""}[5m])) > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} CPU usage > 90%"
          description: "Container {{ $labels.name }} is using more than 90% CPU for more than 2 minutes."
          runbook: "`docker stats {{ $labels.name }}` — sustained pegged CPU; check logs for a hot loop; restart the container if needed."

      # Disk Space Alerts
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is below 20% on {{ $labels.instance }} ({{ $labels.mountpoint }})."
          runbook: "`docker system df` then `make docker-clean`; check /opt/kopia-repo growth + old logs under /var/log."

      - alert: CriticalDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}"
          description: "Disk space is below 10% on {{ $labels.instance }} ({{ $labels.mountpoint }})."
          runbook: "`docker system df` → `docker image prune -af` + `docker builder prune -f`; the repo can fill fast from unused images."

      # Disk inodes — space can be fine while inodes exhaust (many small files:
      # logs, kopia chunks). node-exporter exports the counts; nothing alerted.
      - alert: LowDiskInodes
        expr: (node_filesystem_files_free / node_filesystem_files) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk inodes on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Free inodes below 10% — writes will fail even with free space."
          runbook: "Find the offender: `sudo du --inodes -x -d3 / | sort -rn | head`; usually many small files under /var/log or a container."

      # ponytail: skipped a TLS-cert-expiry alert — probe_ssl_earliest_cert_expiry
      # returns no data (blackbox targets are internal HTTP; public TLS terminates
      # at Cloudflare). Add if/when blackbox probes an HTTPS endpoint we own.

      # Per-container OOM kills — cAdvisor exports the counter; only its own OOM
      # was alerted. Catches the silent memory-pressure failure mode on the N100.
      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} was OOM-killed"
          description: "{{ $labels.name }} hit its memory limit and was OOM-killed in the last 15m."
          runbook: "`docker stats --no-stream` for the current picture; raise the service's `deploy.resources.limits.memory` or reduce what runs (see plan observability-resource-hardening)."

      # Service Response Time Alerts
      - alert: HighResponseTime
        expr: probe_duration_seconds > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time for {{ $labels.instance }}"
          description: "Response time for {{ $labels.instance }} is above 5 seconds."

      - alert: ServiceDown
        expr: probe_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "Service {{ $labels.instance }} is not responding to health checks."
          runbook: "Blackbox probe failed — `docker ps` the target; check its healthcheck + caddy route. NB: probes hit internal service names, not public URLs."

      # Docker Container Restart Alerts
      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds[5m]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restarting frequently"
          description: "Container {{ $labels.name }} has restarted in the last 5 minutes."

      # Network Connectivity Alerts
      - alert: NetworkConnectivityIssues
        expr: rate(container_network_receive_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Network errors on {{ $labels.name }}"
          description: "Container {{ $labels.name }} is experiencing network receive errors."

      # Prometheus Self-Monitoring
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus monitoring system is not responding."

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus config reload failed"
          description: "Prometheus configuration reload has failed."

      # Node Exporter Alerts
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter is down"
          description: "Node Exporter on {{ $labels.instance }} is not responding."

      # High Load Average
      - alert: HighLoadAverage
        expr: node_load1 > 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High load average on {{ $labels.instance }}"
          description: "Load average on {{ $labels.instance }} is above 4."
          runbook: "High load + low CPU% = I/O wait — check swap + `iostat`; usually disk pressure or a heavy container, not raw CPU."

      # Memory Pressure
      - alert: HighMemoryPressure
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory pressure on {{ $labels.instance }}"
          description: "Memory usage on {{ $labels.instance }} is above 90%."

      # cAdvisor Restart/OOM Loop
      - alert: CadvisorRestartLoop
        expr: increase(container_oom_events_total{name=~".*cadvisor.*"}[5m]) >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "cAdvisor OOM/restart loop detected"
          description: "cAdvisor has triggered at least 3 OOM events in the last 5 minutes."

      # Host swap pressure
      - alert: HighSwapUsage
        expr: node_memory_SwapTotal_bytes > 0 and (1 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes)) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High swap usage on {{ $labels.instance }}"
          description: "Swap usage is above 80% on {{ $labels.instance }}."

      # Docker daemon health from system metrics (requires node_exporter systemd collector)
      - alert: DockerServiceDown
        expr: max by (instance) (node_systemd_unit_state{name="docker.service", state="active"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Docker service is down on {{ $labels.instance }}"
          description: "node_systemd_unit_state reports docker.service is not active for at least 2 minutes."

      # Kopia Backup Service Alerts
      - alert: KopiaBackupDown
        expr: absent(container_last_seen{name="kopia"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kopia backup container is not running"
          description: "Kopia container has not been seen by cAdvisor for more than 5 minutes. Container may be down, crashed, or unreachable."

      - alert: KopiaBackupRestartLoop
        expr: changes(container_start_time_seconds{name="kopia"}[15m]) > 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kopia backup container is crash-looping"
          description: "Kopia container has restarted {{ $value | humanize }} times in the last 15 minutes. Investigate logs for the root cause."

      - alert: KopiaSnapshotStale
        expr: (time() - kopia_last_snapshot_timestamp_seconds) > 172800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kopia last snapshot older than 48 hours"
          description: "Last successful snapshot is {{ $value | humanizeDuration }} old. Kopia may be healthy but not actually creating new snapshots."

      - alert: KopiaSnapshotListFailed
        expr: kopia_snapshot_list_ok == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kopia snapshot list query failed"
          description: "Failed to query kopia snapshot list. Container may be down, repo unreachable, or authentication failed."

  # Lucky-specific alerts. Bot + backend scrape targets are added by
  # PR — once `lucky-monitoring` external network is joined.
  - name: lucky_alerts
    interval: 30s
    rules:
      - alert: LuckyBotDown
        expr: up{job="lucky-bot"} == 0
        for: 2m
        labels:
          severity: critical
          service: lucky-bot
        annotations:
          summary: "Lucky bot /metrics scrape failing"
          description: "Prometheus has not been able to scrape lucky-bot:9091/metrics for 2 minutes. Bot process may be down, METRICS_DISABLED may be set, or docker network membership changed."
          runbook: "docs/runbooks/lucky-observability.md#luckybotdown"

      - alert: LuckyBackendDown
        expr: up{job="lucky-backend"} == 0
        for: 2m
        labels:
          severity: critical
          service: lucky-backend
        annotations:
          summary: "Lucky backend /metrics scrape failing"
          description: "Prometheus has not been able to scrape lucky-backend:5000/metrics for 2 minutes."
          runbook: "docs/runbooks/lucky-observability.md#luckybackenddown"

      # Guild churn — bot loses >5% of active guilds over a 10-min window.
      - alert: LuckyGuildCountDropping
        expr: |
          (
            lucky_bot_guilds_total{state="active"}
            - lucky_bot_guilds_total{state="active"} offset 10m
          ) / lucky_bot_guilds_total{state="active"} offset 10m < -0.05
        for: 10m
        labels:
          severity: warning
          service: lucky-bot
        annotations:
          summary: "Lucky active-guild count dropped >5% in 10m"
          description: "Active guilds {{ $value | printf \"%.2f\" }}× — investigate mass kick / deploy / mis-reporting."
          runbook: "docs/runbooks/lucky-observability.md#luckyguildcountdropping"

      # Backend 5xx rate >0.1/s on any route.
      - alert: LuckyBackendHighErrorRate
        expr: |
          sum by (route) (
            rate(lucky_backend_http_server_errors_total[5m])
          ) > 0.1
        for: 5m
        labels:
          severity: warning
          service: lucky-backend
        annotations:
          summary: "Lucky backend 5xx >0.1/s on {{ $labels.route }}"
          description: "Route {{ $labels.route }} producing >0.1 server errors per second (5m avg). Cross-check Sentry."
          runbook: "docs/runbooks/lucky-observability.md#luckybackendhigherrorrate"

      # Backend p95 latency >1s sustained 10m.
      - alert: LuckyBackendHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, route) (
              rate(lucky_backend_http_request_duration_seconds_bucket[5m])
            )
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: lucky-backend
        annotations:
          summary: "Lucky backend p95 >1s on {{ $labels.route }}"
          description: "Route p95 = {{ $value | printf \"%.2f\" }}s. Likely slow downstream (Discord, Spotify, Last.fm) or missing DB index."
          runbook: "docs/runbooks/lucky-observability.md#luckybackendhighlatency"

      # Event loop blocked (default prom-client metric).
      - alert: LuckyBotEventLoopBlocked
        expr: |
          nodejs_eventloop_lag_p99_seconds{service="lucky-bot"} > 0.2
        for: 5m
        labels:
          severity: warning
          service: lucky-bot
        annotations:
          summary: "Lucky bot event loop p99 lag >200ms"
          description: "p99 lag {{ $value | printf \"%.3f\" }}s for 5m. Sync hot path or GC pressure."
          runbook: "docs/runbooks/lucky-observability.md#luckyboteventloopblocked"

      # Heap approaching limit.
      - alert: LuckyBotHeapHigh
        expr: |
          (
            max by (name) (container_memory_working_set_bytes{name="lucky-bot"})
            /
            max by (name) (container_spec_memory_limit_bytes{name="lucky-bot"} > 0)
          ) > 0.9
        for: 10m
        labels:
          severity: warning
          service: lucky-bot
        annotations:
          summary: "Lucky bot memory >90% of container limit"
          description: "Working set {{ $value | humanizePercentage }} of the 1G mem_limit for 10m — risk of OOMKilled. (Was V8 used/heap_total — broken by design, V8 idles at 92-96%; see Lucky ADR 2026-07-02 resource-hygiene.)"
          runbook: "docs/runbooks/lucky-observability.md#luckybotheaphigh"

  # Deploy drift + deploy-health observability (ADR-0023).
  - name: homelab_deploy_alerts
    interval: 1m
    rules:
      # Production has been running behind the latest release for too long.
      - alert: HomelabVersionDrift
        expr: homelab_version_up_to_date == 0 and homelab_running_version_known == 1 and homelab_latest_version_known == 1
        for: 7d
        labels:
          severity: warning
        annotations:
          summary: "Homelab deployed version is behind the latest release"
          description: "homelab_version_up_to_date=0 for >7d — production is behind the latest release tag. SSH the host and run `make deploy`."
          runbook: "docs/adr/0023-deploy-drift-observability.md"

      # The most recent make-deploy did not bring the manager up healthy.
      - alert: HomelabDeployUnhealthy
        expr: homelab_last_deploy_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Last homelab deploy did not report healthy"
          description: "homelab_last_deploy_success=0 — the most recent `make deploy` finished without homelab-manager reporting ok."
          runbook: "docs/adr/0023-deploy-drift-observability.md"

      # Meta-healthcheck: the drift exporter itself stopped writing. Without this,
      # a dead exporter silently reproduces the original blind spot one level up.
      - alert: HomelabVersionExporterStale
        expr: time() - homelab_version_exporter_last_run_timestamp_seconds > 25200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Homelab version-drift exporter is stale"
          description: "No version-drift export in >7h — the exporter (systemd timer) may be dead; drift detection is blind."
          runbook: "docs/adr/0023-deploy-drift-observability.md"

  # Lucky growth-gate metrics + alerts (ADR-0038, k8s-deferral decision).
  # Recording rules for growth-readiness monitoring; alerts trigger for escalation review.
  - name: lucky_growth_gate
    interval: 30s
    rules:
      # Recording rule: Host RAM utilization ratio (0–1).
      # Dividing available by total to get utilization; subtract from 1 for user-friendly "utilization %".
      - record: host:mem_util:ratio
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)

      # Recording rule: Lucky's total container memory (all lucky-* containers).
      # Sums memory usage across bot, backend, postgres, and any other lucky-* services.
      - record: lucky:mem_bytes:sum
        expr: sum(container_memory_usage_bytes{name=~"lucky-.*"})

      # Recording rule: Lucky Postgres container memory alone.
      # Baseline measure for "what we'd free if Postgres moved to a second node or cloud DB".
      - record: lucky:postgres_mem_bytes
        expr: max(container_memory_usage_bytes{name="lucky-postgres"})

      # Alert: Host memory pressure early-warning (escalation trigger for k8s decision review).
      # Sustained >85% memory for 30m signals growth approaching capacity without emergency.
      - alert: HostMemPressureEarlyWarning
        expr: avg_over_time(host:mem_util:ratio[6h]) > 0.85
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Host memory sustained >85% over 6h window"
          description: "avg_over_time(host:mem_util:ratio[6h]) = {{ $value | humanizePercentage }}. Sustained high utilization is the escalation signal from ADR-0038 (k8s deferral decision review)."
          runbook: "docs/adr/0038-reaffirm-compose-over-kubernetes-2026.md"

      # Alert: Lucky growth-gate review trigger (decision gate).
      # ADR-0038's gate is ">70% sustained 30 consecutive days" — NOT expressible
      # here: TSDB retention is 72h (see monitoring.yml), so any window >3d reads
      # partial data. This is a within-retention 48h PROXY: when it fires, manually
      # check the true 30d trajectory (longer-term store / Grafana) before acting.
      - alert: LuckyGrowthGateReview
        expr: avg_over_time(host:mem_util:ratio[48h]) > 0.70
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Lucky growth gate PROXY: 48h avg memory >70% — manually check 30d trend"
          description: "48h average memory utilization = {{ $value | humanizePercentage }} (threshold 70%). Within-retention proxy (TSDB=72h) for the ADR-0038 gate of >70% sustained 30d. On fire, verify the real 30d trend before re-evaluating k8s vs second-node / cloud-DB scale-out. See ADR-0038 Phase 3."
          runbook: "docs/adr/0038-reaffirm-compose-over-kubernetes-2026.md"

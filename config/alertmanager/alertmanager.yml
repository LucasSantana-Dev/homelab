global:
  resolve_timeout: 5m

route:
  receiver: 'discord-notifications'
  group_by: ['alertname', 'severity']
  group_wait: 60s
  group_interval: 30m
  repeat_interval: 12h
  routes:
    # Dead-man-switch (ADR-0026): the always-firing Watchdog alert pings healthchecks
    # ~every minute. If pings STOP (Prometheus/Alertmanager/routing broken) healthchecks
    # alarms via email — independent of the Discord path that silently died (#296).
    - matchers:
        - alertname="Watchdog"
      receiver: 'deadmanswitch'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers:
        - severity="critical"
      receiver: 'discord-notifications'
      group_wait: 15s
      group_interval: 10m
      repeat_interval: 2h
    - matchers:
        - severity="warning"
      receiver: 'discord-notifications'
      group_wait: 60s
      group_interval: 30m
      repeat_interval: 12h

receivers:
  # Pings the healthchecks dead-man-switch check (ADR-0026). url_file keeps the
  # check UUID out of the repo (gitignored, like discord_webhook_url).
  - name: 'deadmanswitch'
    webhook_configs:
      - url_file: '/etc/alertmanager/deadman_ping_url'
        send_resolved: false
  - name: 'discord-notifications'
    discord_configs:
      - webhook_url_file: '/etc/alertmanager/discord_webhook_url'
        send_resolved: true
        title: >-
          {{ if eq .Status "resolved" }}🟢{{ else if eq .CommonLabels.severity "critical" }}🔴{{ else }}🟠{{ end }} [{{ toUpper .Status }}] {{ .CommonLabels.alertname }} ({{ toUpper .CommonLabels.severity }})
        message: >-
          {{ len .Alerts }} alert(s) in this group.
          {{- if .CommonLabels.job }} Job: `{{ .CommonLabels.job }}`{{ end }}
          {{- if .CommonLabels.instance }} | Instance: `{{ .CommonLabels.instance }}`{{ end }}

          {{- range $idx, $alert := .Alerts }}
          {{- if lt $idx 6 }}
          • **{{ or $alert.Labels.name $alert.Labels.instance "unknown" }}**{{ if $alert.Labels.mountpoint }} ({{ $alert.Labels.mountpoint }}){{ end }} — {{ or $alert.Annotations.summary $alert.Annotations.description "No summary" }}
          {{- if $alert.Annotations.runbook }}
            ↳ Fix: {{ $alert.Annotations.runbook }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if gt (len .Alerts) 6 }}
          • Additional alerts omitted for brevity.
          {{- end }}

          📊 Dashboard: https://grafana.luk-homeserver.com.br/d/homelab-monitoring-working
          📜 Logs (Loki Explore): https://grafana.luk-homeserver.com.br/explore
          Source: {{ .ExternalURL }}

inhibit_rules:
  - source_match:
      severity: 'critical'
      alertname: 'CriticalMemoryUsage'
    target_match:
      severity: 'warning'
      alertname: 'HighMemoryUsage'
    equal: ['name', 'instance']
  - source_match:
      severity: 'critical'
      alertname: 'CriticalCPUUsage'
    target_match:
      severity: 'warning'
      alertname: 'HighCPUUsage'
    equal: ['name', 'instance']
  - source_match:
      severity: 'critical'
      alertname: 'CriticalDiskSpace'
    target_match:
      severity: 'warning'
      alertname: 'LowDiskSpace'
    equal: ['instance', 'mountpoint']

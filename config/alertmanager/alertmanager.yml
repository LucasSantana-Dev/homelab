global:
  resolve_timeout: 5m

route:
  receiver: 'discord-notifications'
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'discord-notifications'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'discord-notifications'
      repeat_interval: 4h

receivers:
  - name: 'discord-notifications'
    # Discord webhook configuration (configure ALERTMANAGER_DISCORD_WEBHOOK in .env)
    # webhook_configs:
    #   - url: 'https://discord.com/api/webhooks/REDACTED/REDACTED'
    #     send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

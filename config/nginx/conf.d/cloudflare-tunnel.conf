# Cloudflare Tunnel Reverse Proxy Configuration
# Routes requests to appropriate services based on Host header

server {
    listen 80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Route based on Host header
    location / {
        # Main domain - Homepage
        if ($host = "homelab.example.com") {
            proxy_pass http://homepage:3000;
        }
        if ($host = "www.homelab.example.com") {
            proxy_pass http://homepage:3000;
        }

        # Home Assistant
        if ($host = "homeassistant.homelab.example.com") {
            proxy_pass http://homeassistant:8123;
        }

        # Stremio
        if ($host = "stremio.homelab.example.com") {
            proxy_pass http://stremio:11470;
        }

        # Uptime Kuma
        if ($host = "uptime.homelab.example.com") {
            proxy_pass http://uptime-kuma:3001;
        }

        # Default fallback
        return 200 "Homelab Services - Nginx Proxy Running\n\nAvailable Services:\n- Homepage: https://homelab.example.com\n- Home Assistant: https://homeassistant.homelab.example.com\n- Stremio: https://stremio.homelab.example.com\n- Uptime: https://uptime.homelab.example.com";
        add_header Content-Type text/plain;
    }
}

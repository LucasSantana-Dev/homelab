server {
    listen 443 ssl;
    server_name dev.luk-homeserver.com.br;

    ssl_certificate /etc/nginx/ssl/live/luk-homeserver.com.br/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/luk-homeserver.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Robots-Tag "noindex, nofollow";

    root /home/luk-server/dev-dashboard-site;
    index index.html;

    include /etc/nginx/conf.d/includes/authentik-server-sso.conf;

    location / {
        include /etc/nginx/conf.d/includes/authentik-location-auth.conf;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name dev.luk-homeserver.com.br;
    return 301 https://$server_name$request_uri;
}

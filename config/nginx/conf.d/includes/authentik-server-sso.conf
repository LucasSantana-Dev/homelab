# Authentik outpost endpoints and unauthenticated redirect target.
# Include this once inside each protected `server { ... }` block.

location /outpost.goauthentik.io/ {
    proxy_pass http://192.168.1.121:80/outpost.goauthentik.io/;
    proxy_set_header Host authentik.k3s.local;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

error_page 401 = @authentik_signin;
location @authentik_signin {
    internal;
    return 302 https://auth.luk-homeserver.com.br/outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
}

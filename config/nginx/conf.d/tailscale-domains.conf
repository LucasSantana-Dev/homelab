# Tailscale-only domain configuration with SSL
# All domains resolve to local services, accessible only via Tailscale

# Map to convert HTTP URLs to HTTPS in Location headers
map $upstream_http_location $location_https {
    ~^http://stremio\.homelab\.example\.com(.*)$ https://stremio.homelab.example.com$1;
    ~^http://localhost:11470(.*)$ https://stremio.homelab.example.com$1;
    default $upstream_http_location;
}

# HTTP to HTTPS redirect for main domain
server {
    listen 80;
    server_name homelab.example.com www.homelab.example.com;

    # Let's Encrypt ACME challenge (always allow for certificate renewal)
    location /.well-known/acme-challenge/ {
        allow all;  # Override IP restrictions for Let's Encrypt validation
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Security: Service already bound to Tailscale IP at Docker level (see TAILSCALE_IP in .env)

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Main domain - Homepage Dashboard
server {
    listen 443 ssl;
    server_name homelab.example.com www.homelab.example.com;

    # Security: Service already bound to Tailscale IP at Docker level (see TAILSCALE_IP in .env)
    # No additional IP restrictions needed in nginx

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/live/homelab.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/homelab.example.com/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Robots-Tag "noindex, nofollow";

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    include /etc/nginx/conf.d/includes/authentik-server-sso.conf;

    location / {
        include /etc/nginx/conf.d/includes/authentik-location-auth.conf;
        proxy_pass http://homepage:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle static assets with proper MIME types
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/conf.d/includes/authentik-location-auth.conf;
        proxy_pass http://homepage:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}


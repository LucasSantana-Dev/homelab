# HTTP Stremio Media Server - For iOS app compatibility
server {
    listen 80;
    server_name stremio.homelab.example.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # CORS headers for iOS app
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "3600" always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://stremio:11470;
    }
}


# HTTPS Stremio Media Server - Public Access for app.strem.io
server {
    listen 443 ssl;
    server_name stremio.homelab.example.com;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/live/homelab.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/homelab.example.com/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # CORS headers for app.strem.io integration
    add_header Access-Control-Allow-Origin "https://app.strem.io" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "3600" always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Robots-Tag "noindex, nofollow";

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://stremio:11470;

        # Use proxy_redirect to rewrite HTTP URLs to HTTPS
        proxy_redirect http://stremio.homelab.example.com/ https://stremio.homelab.example.com/;
        proxy_redirect http://localhost:11470/ https://stremio.homelab.example.com/;
        proxy_redirect http://0.0.0.0:11470/ https://stremio.homelab.example.com/;
        proxy_redirect http://127.0.0.1:11470/ https://stremio.homelab.example.com/;

        # Force HTTPS URLs in responses - comprehensive patterns
        sub_filter 'http://stremio.homelab.example.com' 'https://stremio.homelab.example.com';
        sub_filter 'http://localhost:11470' 'https://stremio.homelab.example.com';
        sub_filter 'http://0.0.0.0:11470' 'https://stremio.homelab.example.com';
        sub_filter '"http://stremio.homelab.example.com"' '"https://stremio.homelab.example.com"';
        sub_filter '"http://localhost:11470"' '"https://stremio.homelab.example.com"';
        sub_filter 'http%3A%2F%2Fstremio.homelab.example.com' 'https%3A%2F%2Fstremio.homelab.example.com';
        sub_filter 'http%3A%2F%2Flocalhost%3A11470' 'https%3A%2F%2Fstremio.homelab.example.com';
        sub_filter 'http%3A%2F%2F0.0.0.0%3A11470' 'https%3A%2F%2Fstremio.homelab.example.com';
        sub_filter 'http%3A%2F%2F127.0.0.1%3A11470' 'https%3A%2F%2Fstremio.homelab.example.com';
        sub_filter 'http%3A%2F%2Fstremio.homelab.example.com%3A11470' 'https%3A%2F%2Fstremio.homelab.example.com';
        sub_filter 'http%3A%2F%2Fstremio.homelab.example.com%3A11470%2F' 'https%3A%2F%2Fstremio.homelab.example.com%2F';
        sub_filter_once off;
        sub_filter_types *;

        # Modify Location header to use HTTPS
        proxy_hide_header Location;
        add_header Location "https://app.strem.io/shell-v4.4/?streamingServer=https%3A%2F%2Fstremio.homelab.example.com" always;
    }
}


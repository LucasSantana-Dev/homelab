    ssl_certificate /etc/nginx/ssl/live/homelab.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/homelab.example.com/privkey.pem;

    location / {
        proxy_pass http://alertmanager:9093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP Authentik - Redirect to HTTPS
server {
    listen 80;
    server_name auth.homelab.example.com;

    # Let's Encrypt ACME challenge (always allow for certificate renewal)
    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Security: Service already bound to Tailscale IP at Docker level (see TAILSCALE_IP in .env)

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Authentik SSO - Tailscale Only
server {
    listen 443 ssl http2;
    server_name auth.homelab.example.com;

    # Security: Service already bound to Tailscale IP at Docker level (see TAILSCALE_IP in .env)
    # No additional IP restrictions needed in nginx

    ssl_certificate /etc/nginx/ssl/live/homelab.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/homelab.example.com/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://authentik-server:9000;
    }
}


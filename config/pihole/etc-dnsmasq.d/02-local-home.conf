# Local LAN DNS for *.home — served by Pi-hole's dnsmasq
# Specific records MUST come before the wildcard so dnsmasq picks them first
# (dnsmasq applies the most-specific match).
address=/stremio.home/192.168.0.11
address=/ai.home/192.168.0.11
address=/craftvaria.home/192.168.0.11
address=/lucky.home/192.168.0.11
address=/registry.home/192.168.0.11
address=/pihole.home/192.168.0.11
address=/cockpit.home/192.168.0.11
address=/homelab.home/192.168.0.11
# Wildcard catch-all for any *.home — points at the homelab box
address=/home/192.168.0.11

---
# Luk's Homelab — service catalog
# https://gethomepage.dev/configs/services

- Media:
    - Stremio:
        icon: stremio
        href: https://stremio.luk-homeserver.com.br
        description: Streaming server
        container: stremio-server

- Storage:
    - Nextcloud:
        icon: nextcloud
        href: https://cloud.luk-homeserver.com.br
        description: Files, photos, sync
        container: nextcloud
    - Paperless:
        icon: paperless-ngx
        href: https://paperless.luk-homeserver.com.br
        description: Document management
        container: paperless-ngx
        widget:
          type: paperlessngx
          url: http://host.docker.internal:8400
          username: admin
          password: '{{HOMEPAGE_VAR_PAPERLESS_PASSWORD}}'

- Home:
    - Home Assistant:
        icon: home-assistant
        href: https://homeassistant.luk-homeserver.com.br
        description: Home automation
        container: homeassistant

- Apps:
    - n8n:
        icon: n8n
        href: https://n8n.luk-homeserver.com.br
        description: Workflow automation
        container: n8n
    - Lucky:
        icon: discord
        href: https://lucky.luk-homeserver.com.br
        description: Discord bot dashboard
        container: lucky-frontend
    - Craftvaria:
        icon: minecraft
        href: https://craftvaria.luk-homeserver.com.br
        description: Minecraft server admin
        container: craftvaria-admin-frontend

- Management:
    - Homelab Manager:
        icon: si-python
        href: https://manager.luk-homeserver.com.br/health
        description: Service health & status API
        container: homelab-manager
        widget:
          type: customapi
          url: http://homelab-manager:8765/summary
          refreshInterval: 60000
          method: GET
          mappings:
            - field: total
              label: Services
              format: number
            - field: healthy
              label: Healthy
              format: number
            - field: unhealthy
              label: Unhealthy
              format: number
    - What's Up Docker:
        icon: si-docker
        href: https://wud.luk-homeserver.com.br
        description: Container update monitor
        container: whats-up-docker
        widget:
          type: whatsupdocker
          url: http://whats-up-docker:3000
    - Healthchecks:
        icon: healthchecks
        href: https://healthchecks.luk-homeserver.com.br
        description: Cron job monitoring
        container: healthchecks

- Backup:
    - Kopia:
        icon: kopia
        href: https://kopia.luk-homeserver.com.br
        description: Backup & snapshots
        container: kopia
        # Link-only: kopia 0.23 API requires a CSRF token (Kopia-Csrf-Token) that
        # the homepage kopia widget does not send, so the widget always 401s
        # ("Invalid or missing CSRF token") despite correct basic-auth creds.

- Agents:
    - Hermes:
        icon: si-anthropic
        href: https://github.com/LucasSantana-Dev/homelab/actions/workflows/hermes-review.yml
        description: AI agent — PR review, RAG rebuild, memory sync
        container: agent-box
        widget:
          type: customapi
          url: http://homelab-manager:8765/hermes
          refreshInterval: 120000
          method: GET
          mappings:
            - field: jobs.pr_review.last_run
              label: Last Review
              format: text
            - field: jobs.pr_review.total
              label: PR Reviews
              format: number
            - field: jobs.pr_review.status
              label: Status
              format: text
    - Hermes Logs:
        icon: mdi-text-box-search-outline
        href: https://grafana.luk-homeserver.com.br/d/hermes-agent/hermes-agent
        description: Job logs & Grafana metrics
        widget:
          type: customapi
          url: http://homelab-manager:8765/hermes/logs?lines=5
          refreshInterval: 60000
          method: GET
          mappings:
            - field: file
              label: Latest Log
              format: text

- Infrastructure:
    - Pi-hole:
        icon: pi-hole
        href: https://pihole.luk-homeserver.com.br/admin
        description: DNS sinkhole & ad blocking
        container: pihole
    - Gatus:
        icon: si-statuspage
        href: https://status.luk-homeserver.com.br
        description: Service status & uptime
        container: gatus
    - Grafana:
        icon: grafana
        href: https://grafana.luk-homeserver.com.br
        description: Metrics & dashboards
        container: grafana
    - Portainer:
        icon: portainer
        href: https://portainer.luk-homeserver.com.br
        description: Container management
        container: portainer
        widget:
          type: portainer
          url: http://portainer:9000
          env: 1
          key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"

metrics: true
storage:
  type: sqlite
  path: /data/data.db

ui:
  title: Luk's Homelab Status
  header: Luk's Homelab
  description: Live health of self-hosted services

# Alerts ride the Alertmanager receiver that already exists, rather than a
# second Discord webhook: the webhook URL stays in the gitignored
# /etc/alertmanager/discord_webhook_url and Gatus never sees it. Both containers
# are on the `default` network, so the service name resolves.
#
# `custom: {}` was empty before, and no endpoint declared `alerts:`, so Gatus
# watched six services and told nobody when one failed. That is the "zero
# signal" in cojam#268: the monitor existed and was mute.
alerting:
  custom:
    url: "http://alertmanager:9093/api/v2/alerts"
    method: "POST"
    headers:
      Content-Type: "application/json"
    # Alertmanager identifies an alert by its FULL label set, so `state` must not
    # be a label: TRIGGERED and RESOLVED would be two different alerts and the
    # resolve POST would open a second firing one instead of closing the first.
    # The Discord title already renders .Status (alertmanager.yml).
    #
    # `name` is the label the existing Discord template reads
    # (`or $alert.Labels.name $alert.Labels.instance "unknown"`). Any other key
    # delivers the alert with the service shown as "unknown".
    #
    # endsAt is what actually drives resolution here. Gatus is edge-triggered: it
    # posts once when the threshold trips and never re-sends, while Alertmanager
    # expects continuous re-sending and applies resolve_timeout (5m) otherwise.
    # Without this the alert would self-resolve five minutes into an outage that
    # is still going. Far-future on trigger, epoch on resolve.
    body: |
      [{
        "labels": {
          "alertname": "GatusEndpointDown",
          "severity": "critical",
          "name": "[ENDPOINT_NAME]",
          "group": "[ENDPOINT_GROUP]"
        },
        "annotations": {
          "summary": "[ENDPOINT_NAME] health check failed",
          "description": "[ALERT_DESCRIPTION]",
          "url": "[ENDPOINT_URL]"
        },
        "endsAt": "[ALERT_TRIGGERED_OR_RESOLVED]"
      }]
    placeholders:
      ALERT_TRIGGERED_OR_RESOLVED:
        TRIGGERED: "2099-12-31T23:59:59Z"
        RESOLVED: "1970-01-01T00:00:00Z"
    # Applies to every endpoint, so a new one is alerting by default instead of
    # silently unwatched.
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
      description: "health check failed"

endpoints:
  - name: Homepage
    group: dashboard
    url: https://luk-homeserver.com.br
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1500"

  - name: Nextcloud
    group: storage
    url: http://nextcloud:80/status.php
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].installed == true"

  - name: Stremio
    group: media
    url: http://stremio-server:11470/
    interval: 60s
    conditions:
      - "[STATUS] == any(200, 307)"

  - name: Lucky Web
    group: apps
    url: http://host.docker.internal:8090/
    interval: 60s
    conditions:
      - "[STATUS] == any(200, 301, 302)"

  # Pi-hole DNS & Web checks disabled — Pi-hole runs on host network, not reachable from gatus container
  # - name: Pi-hole DNS
  #   group: infrastructure
  #   dns:
  #     query-name: pi.hole
  #     query-type: A
  #   url: 192.168.0.11:53
  #   interval: 60s
  #   conditions:
  #     - "[DNS_RCODE] == NOERROR"
  #
  # - name: Pi-hole Web
  #   group: infrastructure
  #   url: http://host.docker.internal:8054/admin/
  #   interval: 60s
  #   conditions:
  #     - "[STATUS] == any(200, 301, 302, 403)"

  - name: Portainer
    group: infrastructure
    url: http://host.docker.internal:9000/api/system/status
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: Internet (Cloudflare 1.1.1.1)
    group: external
    url: icmp://1.1.1.1
    interval: 30s
    conditions:
      - "[CONNECTED] == true"

  # CoJam, checked from OUTSIDE the tunnel on purpose. The #264 outage was a
  # 502 at Caddy while the containers were healthy, so any in-network probe
  # stayed green for eight hours. Only the public path catches that class.
  - name: CoJam Web
    group: cojam
    url: https://cojam.lucassantana.tech/
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

  # /api/* is the only prefix Caddy routes to the Go server, so this is the
  # public health path; /readyz is not reachable from outside.
  - name: CoJam API
    group: cojam
    url: https://cojam.lucassantana.tech/api/healthz
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"

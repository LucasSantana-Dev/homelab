apiVersion: 1

datasources:
  # Prometheus - Primary metrics source
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      queryTimeout: 60s
      timeInterval: 15s
      manageAlerts: true
      alertmanagerUid: alertmanager
    version: 1

  # Sentry - Error tracking and performance monitoring
  - name: Sentry
    type: grafana-sentry-datasource
    access: proxy
    url: https://sentry.io
    isDefault: false
    editable: true
    jsonData:
      orgSlug: lucas-santana-gm
      # Sentry project slug is "lucky" (the "luk-bot" project does not exist —
      # panels returned "No data" because every query hit a missing project).
      projectSlug: lucky
    secureJsonData:
      # Grafana's reliable env-injection for secure fields is $__env{}, not bare
      # ${VAR} (whose interpolation does not apply to secureJsonData). Requires
      # SENTRY_AUTH_TOKEN to be passed into the grafana container (compose env).
      authToken: $__env{SENTRY_AUTH_TOKEN}
    version: 1

  # Node Exporter - System metrics (using main Prometheus instance)
  - name: Node Exporter
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
    jsonData:
      httpMethod: POST
      queryTimeout: 60s
      timeInterval: 15s
    version: 1

  # Loki - Log aggregation
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      timeout: 60
      manageAlerts: true
    version: 1
  # Lucky Postgres, read-only role grafana_ro (Lucky repo:
  # observability/postgres/grafana-ro.sql). Column-level SELECT on product
  # tables only; reached over the lucky-db-ro network.
  - name: Lucky Postgres
    uid: lucky-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: lucky-postgres:5432
    user: grafana_ro
    isDefault: false
    editable: false
    jsonData:
      database: discordbot
      sslmode: disable
      postgresVersion: 1800
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 14400
      timeInterval: 1m
    secureJsonData:
      password: $__file{/etc/grafana/secrets/lucky_grafana_ro_password}
    version: 1

apiVersion: 1

datasources:
  # Prometheus - Primary metrics source
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      queryTimeout: 60s
      timeInterval: 15s
      manageAlerts: true
      alertmanagerUid: alertmanager
    version: 1

  # Sentry - Error tracking and performance monitoring
  - name: Sentry
    type: grafana-sentry-datasource
    access: proxy
    url: https://sentry.io
    isDefault: false
    editable: true
    jsonData:
      orgSlug: lucas-santana-gm
      projectSlug: luk-bot
    secureJsonData:
      authToken: ${SENTRY_AUTH_TOKEN}
    version: 1

  # Node Exporter - System metrics (using main Prometheus instance)
  - name: Node Exporter
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
    jsonData:
      httpMethod: POST
      queryTimeout: 60s
      timeInterval: 15s
    version: 1

  # Loki - Log aggregation
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      timeout: 60
      manageAlerts: true
    version: 1

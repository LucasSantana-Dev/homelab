apiVersion: 1

providers:
      - name: 'Homelab Dashboards'
        orgId: 1
        folder: 'Homelab'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/homelab

      - name: 'Sentry Dashboards'
        orgId: 1
        folder: 'Sentry'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/sentry

      - name: 'Lucky Project Dashboards'
        orgId: 1
        folder: 'Lucky'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/lukbot
      # Lucky: comece aqui, negócio, erros, sistema. Source of truth is the
      # Lucky repo; edit there and run observability/grafana/build_dashboards.py.
      - name: 'Lucky (repo)'
        orgId: 1
        folder: 'Lucky'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 60
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/lucky-dashboards
      # CoJam dashboards. Source of truth is the CoJam repo
      # (observability/grafana/dashboards); edits in the UI are not saved.
      - name: 'CoJam (repo)'
        orgId: 1
        folder: 'CoJam'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 60
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/cojam-dashboards

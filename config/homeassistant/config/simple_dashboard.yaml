# Simple Working Dashboard with Mushroom Cards
title: Smart Home
views:
  - title: Início
    path: inicio
    icon: mdi:home
    cards:
      - type: custom:mushroom-title-card
        title: Bem-vindo ao Smart Home
        subtitle: Controle Inteligente da sua Casa
        icon: mdi:home-automation
      
      - type: custom:mushroom-template-card
        primary: Clima
        secondary: "{{ states('weather.home') }}"
        icon: mdi:weather-sunny
        icon_color: blue
      
      - type: custom:mushroom-entities-card
        title: Status Rápido
        primary_info: name
        secondary_info: state
        icon_type: icon
        layout: grid
        entities:
          - entity: sun.sun
            name: Sol
            icon: mdi:weather-sunny
          - entity: weather.home
            name: Clima
            icon: mdi:weather-cloudy
  
  - title: Quartos
    path: quartos
    icon: mdi:bed
    cards:
      - type: custom:mushroom-title-card
        title: Quarto Principal
        subtitle: Controle do Ambiente
        icon: mdi:bed
      
      - type: custom:mushroom-entities-card
        title: Iluminação
        primary_info: name
        secondary_info: state
        icon_type: icon
        layout: grid
        entities:
          - entity: light.luz_principal_light
            name: Luz Principal
            icon: mdi:lightbulb
          - entity: light.luz_secundaria_light
            name: Luz Secundária
            icon: mdi:lightbulb
  
  - title: Banheiro
    path: banheiro
    icon: mdi:shower
    cards:
      - type: custom:mushroom-title-card
        title: Banheiro
        subtitle: Controle da Iluminação
        icon: mdi:shower
      
      - type: custom:mushroom-entities-card
        title: Iluminação do Banheiro
        primary_info: name
        secondary_info: state
        icon_type: icon
        layout: grid
        entities:
          - entity: light.luz_banheiro_light
            name: Luz Banheiro
            icon: mdi:lightbulb
  
  - title: Sala
    path: sala
    icon: mdi:sofa
    cards:
      - type: custom:mushroom-title-card
        title: Sala de Estar
        subtitle: Entretenimento e Limpeza
        icon: mdi:sofa
      
      - type: custom:mushroom-entities-card
        title: Aspirador Robô
        primary_info: name
        secondary_info: state
        icon_type: icon
        layout: grid
        entities:
          - entity: vacuum.rogerio_alarm_alarm
            name: Alarme
            icon: mdi:alarm
          - entity: vacuum.rogerio_robot_cleaner
            name: Aspirador
            icon: mdi:robot-vacuum
  
  - title: Energia
    path: energia
    icon: mdi:lightning-bolt
    cards:
      - type: custom:mushroom-title-card
        title: Monitoramento de Energia
        subtitle: Consumo e Custos
        icon: mdi:lightning-bolt
      
      - type: custom:mushroom-template-card
        primary: Consumo de Energia
        secondary: "{{ states('sensor.electricity_consumption') }}"
        icon: mdi:lightning-bolt
        icon_color: orange
      
      - type: custom:mushroom-template-card
        primary: Custo da Energia
        secondary: "{{ states('sensor.custo_da_energia') }}"
        icon: mdi:currency-usd
        icon_color: green
  
  - title: Serviços
    path: servicos
    icon: mdi:server
    cards:
      - type: custom:mushroom-title-card
        title: Serviços do Homelab
        subtitle: Status e Monitoramento
        icon: mdi:server
      
      - type: custom:mushroom-entities-card
        title: Status dos Serviços
        primary_info: name
        secondary_info: state
        icon_type: icon
        layout: grid
        entities:
          - entity: binary_sensor.homeassistant_status
            name: Home Assistant
            icon: mdi:home-assistant
          - entity: binary_sensor.grafana_status
            name: Grafana
            icon: mdi:chart-line
          - entity: binary_sensor.portainer_status
            name: Portainer
            icon: mdi:docker
          - entity: binary_sensor.stremio_status
            name: Stremio
            icon: mdi:play

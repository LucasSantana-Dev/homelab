# Test Dashboard to Verify Mushroom Cards
title: Test Mushroom Cards
views:
  - title: Test
    path: test
    icon: mdi:home
    cards:
      - type: custom:mushroom-title-card
        title: 🎉 Mushroom Cards Funcionando!
        subtitle: Se você vê isso, Mushroom Cards está funcionando perfeitamente!
        icon: mdi:check-circle
      
      - type: custom:mushroom-template-card
        primary: Teste de Template
        secondary: "{{ states('sun.sun') }}"
        icon: mdi:weather-sunny
        icon_color: yellow
      
      - type: custom:mushroom-entities-card
        title: Teste de Entidades
        primary_info: name
        secondary_info: state
        icon_type: icon
        layout: grid
        entities:
          - entity: sun.sun
            name: Sol
            icon: mdi:weather-sunny
          - entity: weather.home
            name: Clima
            icon: mdi:weather-cloudy
      
      - type: custom:button-card
        name: Teste Button Card
        icon: mdi:check
        color: "#4caf50"
        tap_action:
          action: more-info

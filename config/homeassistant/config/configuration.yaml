# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# HTTP configuration for reverse proxy (Cloudflare Tunnel)
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.18.0.0/16  # Docker network range
    - 127.0.0.1
    - ::1

# Recorder configuration
recorder: !include recorder.yaml

# Input helpers - split into separate files
input_boolean: !include input_boolean.yaml
input_number: !include input_number.yaml
input_select: !include input_select.yaml

# Energy monitoring
template: !include energy_templates.yaml
sensor: !include energy_sensors.yaml
utility_meter: !include utility_meters.yaml

# Voice assistants (see voice_assistants.yaml)
# Uncomment and configure after setting up Google Cloud Project and Alexa Skill
# google_assistant: !include voice_assistants.yaml
# alexa: !include voice_assistants.yaml


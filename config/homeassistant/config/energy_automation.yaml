# Energy Automation for Goiânia, Goiás, Brazil

automation:
  - alias: High Energy Consumption Alert
    trigger:
      - platform: numeric_state
        entity_id: sensor.electricity_consumption
        above: 5.0
    action:
      - service: notify.persistent_notification
        data:
          title: Alto Consumo de Energia
          message: Consumo atual: {{ states('sensor.electricity_consumption') }}kW
  
  - alias: Daily Energy Report
    trigger:
      - platform: time
        at: 22:00:00
    action:
      - service: notify.persistent_notification
        data:
          title: Relatório Diário de Energia
          message: >
            Consumo hoje: {{ states('sensor.electricity_daily') }}kWh
            Custo: R$ {{ states('sensor.custo_da_energia') }}

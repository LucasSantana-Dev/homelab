# Example Home Assistant Entities Configuration
# This file contains example entities that you can use with the dashboard
# Replace these with your actual entity names

# Example configuration.yaml additions for testing the dashboard

# Example sensors (add to your configuration.yaml)
sensor:
  - platform: template
    sensors:
      temperature:
        friendly_name: "Temperature"
        unit_of_measurement: "°C"
        value_template: "{{ 22.5 }}"

      humidity:
        friendly_name: "Humidity"
        unit_of_measurement: "%"
        value_template: "{{ 45 }}"

      power_consumption:
        friendly_name: "Power Consumption"
        unit_of_measurement: "W"
        value_template: "{{ 850 }}"

      solar_production:
        friendly_name: "Solar Production"
        unit_of_measurement: "W"
        value_template: "{{ 1200 }}"

      cpu_usage:
        friendly_name: "CPU Usage"
        unit_of_measurement: "%"
        value_template: "{{ 25 }}"

      memory_usage:
        friendly_name: "Memory Usage"
        unit_of_measurement: "%"
        value_template: "{{ 60 }}"

      disk_usage:
        friendly_name: "Disk Usage"
        unit_of_measurement: "%"
        value_template: "{{ 45 }}"

      network_speed:
        friendly_name: "Network Speed"
        unit_of_measurement: "Mbps"
        value_template: "{{ 100 }}"

      home_assistant_version:
        friendly_name: "Home Assistant Version"
        value_template: "{{ '2024.1.0' }}"

      last_boot:
        friendly_name: "Last Boot"
        value_template: "{{ now().strftime('%Y-%m-%d %H:%M') }}"

      uptime:
        friendly_name: "Uptime"
        value_template: "{{ '5 days, 12 hours' }}"

# Example lights (replace with your actual light entities)
light:
  - platform: demo
    name: "Living Room Light"
    entity_id: light.living_room

  - platform: demo
    name: "Bedroom Light"
    entity_id: light.bedroom

# Example switches (replace with your actual switch entities)
switch:
  - platform: demo
    name: "Coffee Maker"
    entity_id: switch.coffee_maker

  - platform: demo
    name: "Bedroom Fan"
    entity_id: fan.bedroom_fan

# Example climate (replace with your actual climate entities)
climate:
  - platform: demo
    name: "Living Room Climate"
    entity_id: climate.living_room

# Example alarm control panel (replace with your actual alarm entity)
alarm_control_panel:
  - platform: demo
    name: "Home Alarm"
    entity_id: alarm_control_panel.home

# Example media player (replace with your actual media player entities)
media_player:
  - platform: demo
    name: "Living Room TV"
    entity_id: media_player.living_room_tv

# Example weather (replace with your actual weather entity)
weather:
  - platform: demo
    name: "Home Weather"
    entity_id: weather.home

# Example scenes (create these for quick actions)
scene:
  - name: "Movie Night"
    entities:
      light.living_room:
        state: on
        brightness: 50
        color_name: red
      media_player.living_room_tv:
        state: on
    icon: mdi:movie

  - name: "Sleep Mode"
    entities:
      light.living_room:
        state: off
      light.bedroom:
        state: on
        brightness: 10
        color_name: warm_white
    icon: mdi:sleep

  - name: "All Off"
    entities:
      light.living_room:
        state: off
      light.bedroom:
        state: off
      switch.coffee_maker:
        state: off
      fan.bedroom_fan:
        state: off
    icon: mdi:power

# Example input_boolean for testing
input_boolean:
  test_mode:
    name: "Test Mode"
    icon: mdi:test-tube

# Example input_number for testing
input_number:
  test_temperature:
    name: "Test Temperature"
    min: 0
    max: 50
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer

# Example input_select for testing
input_select:
  test_mode:
    name: "Test Mode"
    options:
      - "Off"
      - "Auto"
      - "Manual"
    icon: mdi:cog

# Example automation for testing
automation:
  - alias: "Test Automation"
    trigger:
      - platform: state
        entity_id: input_boolean.test_mode
        to: "on"
    action:
      - service: light.turn_on
        target:
          entity_id: light.living_room
        data:
          brightness: 255
          color_name: blue
      - service: notify.persistent_notification
        data:
          message: "Test mode activated!"

# Example script for testing
script:
  test_script:
    alias: "Test Script"
    sequence:
      - service: light.toggle
        target:
          entity_id: light.living_room
      - service: notify.persistent_notification
        data:
          message: "Test script executed!"

# Example group for organizing entities
group:
  living_room:
    name: "Living Room"
    entities:
      - light.living_room
      - climate.living_room
      - media_player.living_room_tv

  bedroom:
    name: "Bedroom"
    entities:
      - light.bedroom
      - fan.bedroom_fan

  kitchen:
    name: "Kitchen"
    entities:
      - switch.coffee_maker
      - sensor.kitchen_temperature

  office:
    name: "Office"
    entities:
      - sensor.office_humidity
      - sensor.cpu_usage
      - sensor.memory_usage

# Example person for presence detection
person:
  - name: "Test User"
    id: test_user
    user_id: test_user_id
    device_trackers:
      - device_tracker.test_phone

# Example device_tracker for presence detection
device_tracker:
  - platform: demo
    name: "Test Phone"
    entity_id: device_tracker.test_phone

# Example notify service for testing
notify:
  - name: "Test Notification"
    platform: demo

# Example persistent_notification for testing
persistent_notification:
  - name: "Test Notification"
    title: "Test"
    message: "This is a test notification"
    notification_id: "test_notification"

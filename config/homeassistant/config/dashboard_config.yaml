# Modern Dashboard Configuration
title: Luk's Smart Homelab
views:
  - title: Home
    path: home
    icon: mdi:home
    cards:
      - type: entities
        title: Status do Sistema
        entities:
          - sensor.electricity_consumption
          - sensor.system_uptime
          - weather.home
      
      - type: gauge
        title: Consumo de Energia
        entity: sensor.electricity_consumption
        min: 0
        max: 10
        severity:
          green: 0
          yellow: 3
          red: 6
  
  - title: Energia
    path: energia
    icon: mdi:lightning-bolt
    cards:
      - type: entities
        title: Estatísticas de Energia
        entities:
          - sensor.electricity_consumption
          - sensor.electricity_daily
          - sensor.electricity_monthly
          - sensor.custo_da_energia
      
      - type: history-graph
        title: Consumo de Energia - 24h
        entities:
          - sensor.electricity_consumption
        hours_to_show: 24
  
  - title: Serviços
    path: servicos
    icon: mdi:server
    cards:
      - type: entities
        title: Status dos Serviços
        entities:
          - binary_sensor.homeassistant_status
          - binary_sensor.grafana_status
          - binary_sensor.portainer_status
          - binary_sensor.stremio_status
  
  - title: Mídia
    path: midia
    icon: mdi:play
    cards:
      - type: entities
        title: Status de Mídia
        entities:
          - sensor.stremio_status
          - sensor.media_server_status
  
  - title: Configurações
    path: configuracoes
    icon: mdi:cog
    cards:
      - type: entities
        title: Ações Rápidas
        entities:
          - switch.system_optimization
          - input_boolean.energy_saving_mode
          - input_boolean.maintenance_mode
      
      - type: entities
        title: Informações do Sistema
        entities:
          - sensor.homeassistant_version
          - sensor.system_uptime
          - sensor.memory_usage
          - sensor.cpu_usage
          - sensor.disk_usage

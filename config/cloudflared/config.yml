# Cloudflare Tunnel ingress policy.
#
# All traffic is forwarded to the host-networked caddy-lan instance,
# which performs per-hostname routing into docker containers or the
# k3s Traefik ClusterIP. `host.docker.internal` resolves to the
# docker host because the cloudflared service in compose declares
# `extra_hosts: ["host.docker.internal:host-gateway"]`.

ingress:
  - hostname: luk-homeserver.com.br
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: luk-homeserver.com.br
  - hostname: www.luk-homeserver.com.br
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: www.luk-homeserver.com.br
  - hostname: home.luk-homeserver.com.br
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: home.luk-homeserver.com.br
  - hostname: homeassistant.luk-homeserver.com.br
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: homeassistant.luk-homeserver.com.br
  - hostname: grafana.luk-homeserver.com.br
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: grafana.luk-homeserver.com.br
  - hostname: prometheus.luk-homeserver.com.br
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: prometheus.luk-homeserver.com.br
  - hostname: cloud.luk-homeserver.com.br
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: cloud.luk-homeserver.com.br
  - hostname: auth.luk-homeserver.com.br
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: auth.luk-homeserver.com.br
  - hostname: blackbox.luk-homeserver.com.br
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: blackbox.luk-homeserver.com.br
  - hostname: stremio.luk-homeserver.com.br
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: stremio.luk-homeserver.com.br

  - hostname: n8n.luk-homeserver.com.br
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: n8n.luk-homeserver.com.br

  - hostname: linkding.luk-homeserver.com.br
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: linkding.luk-homeserver.com.br

  - hostname: miniflux.luk-homeserver.com.br
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: miniflux.luk-homeserver.com.br

  # Final catch-all — cloudflared returns 404 for any hostname not listed above.
  - service: http_status:404

# ============================================================================
# REFERENCE ONLY - THIS FILE DOES NOT ROUTE ANY TRAFFIC.
#
# The cloudflared container runs a REMOTELY MANAGED tunnel: compose/core.yml
# passes TUNNEL_TOKEN and the command is `tunnel --no-autoupdate --metrics ...
# run` with no --config, and this file is not mounted into the container. The
# live ingress comes from Cloudflare (Zero Trust > Networks > Tunnels >
# homelab > Public Hostnames); the logs show it as
# "Updated to new configuration ... version=N".
#
# The record of what is actually public is edge-snapshot.json next to this
# file, written read-only from the Cloudflare API by
# scripts/maintenance/cloudflare-edge-snapshot.py (tunnel ingress + DNS of the
# zones it serves). Refresh it after any dashboard change. This file used to
# carry its own host list; it drifted (24 hosts listed, 27 live), so it now
# only shows the routing shape.
#
# Consequences, learned the slow way:
#   - Adding a hostname here does nothing. Add it in the dashboard, then
#     refresh the snapshot.
#   - Restarting cloudflared re-pulls the same remote version; it does not
#     pick up edits made here.
#   - *.luk-homeserver.com.br also sits behind a Cloudflare Access app
#     ("Home Lab"); a host meant to be public needs its own Access app with a
#     Bypass policy (rclone.luk-homeserver.com.br has one).
# ============================================================================

tunnel: ${CF_TUNNEL_ID}   # not hardcoded: the UUID is not published (audit C1)

# Live rules share this shape: the tunnel only forwards to the host-networked
# caddy-lan on :80, which does the per-hostname routing. Only some rules pin
# httpHostHeader (18 of 27 on 2026-09-26); the snapshot says which.
ingress:
  - hostname: <host>.luk-homeserver.com.br   # or <host>.lucassantana.tech
    service: http://host.docker.internal:80
    originRequest:
      httpHostHeader: <host>.luk-homeserver.com.br
  - service: http_status:404

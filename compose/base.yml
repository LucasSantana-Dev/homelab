# Base Configuration - Networks and Volumes
# This file defines shared infrastructure used by all service modules

networks:
  # CIDRs moved out of 172.20-23 to avoid collision with the sibling
  # compose projects on this host (lucky owns 172.20.0.0/16, craftvaria
  # owns 172.22.0.0/16). Staying inside RFC1918 172.16.0.0/12.
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  database:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  portainer_data:
  grafana_data:
  prometheus_data:
  whats_up_docker_data:
  pihole_data:
  stremio_cache:
  netdataconfig:
  netdatalib:
  netdatacache:
  gatus_data:

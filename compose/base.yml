# Base Configuration - Networks and Volumes
# This file defines shared infrastructure used by all service modules

networks:
  # CIDRs moved out of 172.20-23 to avoid collision with the sibling
  # compose projects on this host (lucky owns 172.20.0.0/16, craftvaria
  # owns 172.22.0.0/16). Staying inside RFC1918 172.16.0.0/12.
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Wave 5: dropped unused `backend` (172.29.0.0/24) and `monitoring`
  # (172.30.0.0/24) network blocks — no service referenced them.
  database:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  # M2: docker-socket-proxy filtering network (internal, no external access)
  # Read-only docker.sock consumers (agent-box, homepage, whats-up-docker)
  # connect here instead of mounting the socket directly. The proxy allowlists
  # safe endpoints (CONTAINERS, IMAGES, INFO, VERSION, PING) and denies writes.
  socketproxy:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.32.0.0/24

volumes:
  portainer_data:
  grafana_data:
  prometheus_data:
  whats_up_docker_data:
  pihole_data:
  stremio_cache:
  gatus_data:

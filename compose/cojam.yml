# CoJam: cross-platform group music-listening app.
# Go server (persistent room state in its own Postgres) behind Caddy.
# The Next.js web frontend is deployed separately (its NEXT_PUBLIC_WS_URL is
# baked at build time), so this stack is the API/WebSocket backend + database.
#
# Secret required in .env (host-only, then `make sops-encrypt`):
#   COJAM_DB_PASSWORD=<generate a strong password>
services:
  cojam-db:
    # Pinned to 17-alpine: avoids the 18-alpine PGDATA data-path pitfall that
    # bit the lucky stack (see docs/runbooks/lucky-db-recovery-runbook.md).
    image: postgres:17-alpine
    container_name: cojam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cojam
      POSTGRES_USER: cojam
      POSTGRES_PASSWORD: ${COJAM_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - ../appdata/cojam/db:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d cojam -U cojam"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cojam-server:
    image: ${IMG_COJAM_SERVER:-ghcr.io/lucassantana-dev/cojam-server:latest}
    labels:
      - wud.watch=true
    container_name: cojam-server
    restart: unless-stopped
    environment:
      # Runtime pool uses the local Postgres; migrations run on boot.
      DATABASE_URL: postgres://cojam:${COJAM_DB_PASSWORD}@cojam-db:5432/cojam
      # Origins allowed to connect (the separately-deployed web frontend). Set
      # COJAM_CORS_ORIGINS in .env to the web origin; empty falls back to
      # localhost dev origins in the server.
      CORS_ORIGINS: ${COJAM_CORS_ORIGINS:-}
      # Anonymous room identity tokens (proof-of-ownership reissue). Secret is
      # host-only in .env; required when the feature is on.
      FEATURE_ROOM_AUTH: "true"
      ROOM_AUTH_SECRET: ${COJAM_ROOM_AUTH_SECRET:?set COJAM_ROOM_AUTH_SECRET in .env}
      # Supabase account tokens (JWKS validation against the project). OFF:
      # the configured project (neuthlwwqucjohvruqde.supabase.co) was deleted
      # (NXDOMAIN) and this was leftover scaffolding, not an active feature —
      # CoJam's primary auth already runs off the local Postgres. Re-enable
      # only alongside a real, live Supabase project.
      FEATURE_SUPABASE_AUTH: "false"
      SUPABASE_URL: ${COJAM_SUPABASE_URL:-}
      # Dark-feature flags (2026-08-03 rollout, #173): default off, enabled per-flag in .env.
      FEATURE_PUBLIC_ROOMS: ${FEATURE_PUBLIC_ROOMS:-false}
      FEATURE_QUEUE_VOTING: ${FEATURE_QUEUE_VOTING:-false}
      FEATURE_ROOM_CHAT: ${FEATURE_ROOM_CHAT:-false}
      TZ: ${TIMEZONE:-UTC}
    ports:
      # Pinned to loopback, deliberately NOT ${BIND_IP}. CoJam is a public app
      # whose only ingress is caddy-lan, which runs on the host network and
      # proxies 127.0.0.1:8094. Following BIND_IP moves the listener off
      # loopback and 502s the public site (#264).
      - "127.0.0.1:8094:8080"
    networks:
      - frontend
      - database
    depends_on:
      cojam-db:
        condition: service_healthy
    healthcheck:
      # /readyz is 200 only when the process is up AND the DB answers a ping.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/readyz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cojam-web:
    image: ${IMG_COJAM_WEB:-ghcr.io/lucassantana-dev/cojam-web:latest}
    labels:
      - wud.watch=true
    container_name: cojam-web
    restart: unless-stopped
    environment:
      # Runtime config (the image is environment-agnostic; served via /env.js).
      # Single-subdomain: the WS lives under /connection on the same host as the
      # web app; Caddy path-routes /connection/* to the Go server. COJAM_DOMAIN
      # lets cojam use its own domain (lucassantana.tech) without moving other
      # services off the shared ${DOMAIN}; it falls back to ${DOMAIN} if unset.
      COJAM_WS_URL: wss://cojam.${COJAM_DOMAIN:-${DOMAIN}}/connection/websocket
      COJAM_SPOTIFY_CLIENT_ID: ${COJAM_SPOTIFY_CLIENT_ID:-}
      COJAM_FEATURE_SPOTIFY: ${COJAM_FEATURE_SPOTIFY:-}
      # Room auth + Supabase accounts, served to the client via /env.js.
      COJAM_FEATURE_ROOM_AUTH: ${COJAM_FEATURE_ROOM_AUTH:-}
      COJAM_FEATURE_PUBLIC_ROOMS: ${COJAM_FEATURE_PUBLIC_ROOMS:-}
      COJAM_FEATURE_QUEUE_VOTING: ${COJAM_FEATURE_QUEUE_VOTING:-}
      COJAM_FEATURE_ROOM_CHAT: ${COJAM_FEATURE_ROOM_CHAT:-}
      # Supabase accounts OFF (see cojam-server FEATURE_SUPABASE_AUTH above) —
      # not required; the /env.js route already omits both fields unless BOTH
      # are set (apps/web/app/env.js/route.ts), so leaving these unset is safe.
      COJAM_SUPABASE_URL: ${COJAM_SUPABASE_URL:-}
      COJAM_SUPABASE_ANON_KEY: ${COJAM_SUPABASE_ANON_KEY:-}
      TZ: ${TIMEZONE:-UTC}
    ports:
      # Loopback-pinned for the same reason as cojam-server above.
      - "127.0.0.1:8096:3000"
    networks:
      - frontend
    depends_on:
      - cojam-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

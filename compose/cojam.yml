# CoJam: cross-platform group music-listening app.
# Go server (persistent room state in its own Postgres) behind Caddy.
# The Next.js web frontend is deployed separately (its NEXT_PUBLIC_WS_URL is
# baked at build time), so this stack is the API/WebSocket backend + database.
#
# Secret required in .env (host-only, then `make sops-encrypt`):
#   COJAM_DB_PASSWORD=<generate a strong password>
services:
  cojam-db:
    # Pinned to 17-alpine: avoids the 18-alpine PGDATA data-path pitfall that
    # bit the lucky stack (see docs/runbooks/lucky-db-recovery-runbook.md).
    image: postgres:17-alpine
    container_name: cojam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cojam
      POSTGRES_USER: cojam
      POSTGRES_PASSWORD: ${COJAM_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - ../appdata/cojam/db:/var/lib/postgresql/data
    networks:
      - database
      # Read-only Grafana datasource path; only cojam-db and grafana join it.
      - cojam-db-ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d cojam -U cojam"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        # Loki derives container_name from this tag (promtail-config.yaml).
        tag: "{{.Name}}"
        max-size: "10m"
        max-file: "3"

  cojam-server:
    image: ${IMG_COJAM_SERVER:-ghcr.io/lucassantana-dev/cojam-server:latest}
    labels:
      - wud.watch=true
    container_name: cojam-server
    restart: unless-stopped
    environment:
      # Runtime pool uses the local Postgres; migrations run on boot.
      DATABASE_URL: postgres://cojam:${COJAM_DB_PASSWORD}@cojam-db:5432/cojam
      # Turns on the server's fail-fast production config check (config.go):
      # boot fails unless DATABASE_URL and CORS_ORIGINS are set (no "*") and,
      # with room auth on, ROOM_AUTH_SECRET is at least 32 bytes. Verified
      # against the host .env on 2026-10-07 (secret 64 bytes, origins set).
      APP_ENV: production
      # Idle persisted rooms (no member, no change) are deleted after this many
      # minutes. Owner decision 2026-10-09: 30 days = 43200, as /privacidade states.
      ROOM_PERSIST_IDLE_TTL_MINUTES: ${COJAM_ROOM_PERSIST_IDLE_TTL_MINUTES:-43200}
      # Optional webhook for user reports (cojam#259). Empty = off. The payload
      # carries the room id, which is the room's access link: point it at a
      # private channel only.
      REPORT_WEBHOOK_URL: ${COJAM_REPORT_WEBHOOK_URL:-}
      # Origins allowed to connect (the separately-deployed web frontend). Set
      # COJAM_CORS_ORIGINS in .env to the web origin; empty falls back to
      # localhost dev origins in the server.
      CORS_ORIGINS: ${COJAM_CORS_ORIGINS:-}
      # Anonymous room identity tokens (proof-of-ownership reissue). Secret is
      # host-only in .env; required when the feature is on.
      FEATURE_ROOM_AUTH: "true"
      ROOM_AUTH_SECRET: ${COJAM_ROOM_AUTH_SECRET:?set COJAM_ROOM_AUTH_SECRET in .env}
      # Supabase account tokens (JWKS validation against the project). OFF:
      # the configured project (neuthlwwqucjohvruqde.supabase.co) was deleted
      # (NXDOMAIN) and this was leftover scaffolding, not an active feature —
      # CoJam's primary auth already runs off the local Postgres. Re-enable
      # only alongside a real, live Supabase project.
      FEATURE_SUPABASE_AUTH: "false"
      SUPABASE_URL: ${COJAM_SUPABASE_URL:-}
      # Dark-feature flags (2026-08-03 rollout, #173): default off, enabled per-flag in .env.
      FEATURE_PUBLIC_ROOMS: ${FEATURE_PUBLIC_ROOMS:-false}
      FEATURE_QUEUE_VOTING: ${FEATURE_QUEUE_VOTING:-false}
      FEATURE_ROOM_CHAT: ${FEATURE_ROOM_CHAT:-false}
      # Product events (cojam#444). The HMAC key pseudonymises room and actor
      # ids; without it hashes change on every restart. Keep it stable.
      EVENTS_HMAC_KEY: ${COJAM_EVENTS_HMAC_KEY:-}
      FEATURE_PRODUCT_EVENTS: ${FEATURE_PRODUCT_EVENTS:-true}
      # Prometheus metrics on a dedicated listener, never the public port
      # (ADR-0004). 0.0.0.0 is the CONTAINER's interface, not the host's: the
      # port is never published, so this is reachable only from the frontend
      # network, which is how Prometheus scrapes it by service DNS.
      METRICS_ADDR: 0.0.0.0:9100
      # Provider keys for cross-service track matching. The server reads all
      # four (internal/match, internal/spotifyauth); none were passed through
      # before, so production ran with matcher_disabled and
      # spotify_matcher_disabled no matter what .env held (cojam#199).
      # Unset is graceful by design: a provider with no key is skipped and
      # rooms still work on manual entry.
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SPOTIFY_CLIENT_ID: ${COJAM_SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${COJAM_SPOTIFY_CLIENT_SECRET:-}
      # Seals Spotify refresh tokens at rest (cojam#252). Without it the server
      # never mounts /api/spotify/token, so "Conectar Spotify" fails after the
      # redirect. 32 random bytes, base64.
      SPOTIFY_TOKEN_KEY: ${COJAM_SPOTIFY_TOKEN_KEY:-}
      # Feeds radio refill. Stays unset until the Last.fm commercial LOI
      # exists (see docs/runbooks/launch-readiness.md in the cojam repo).
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      TZ: ${TIMEZONE:-UTC}
    ports:
      # Pinned to loopback, deliberately NOT ${BIND_IP}. CoJam is a public app
      # whose only ingress is caddy-lan, which runs on the host network and
      # proxies 127.0.0.1:8094. Following BIND_IP moves the listener off
      # loopback and 502s the public site (#264).
      - "127.0.0.1:8094:8080"
    networks:
      - frontend
      - database
    depends_on:
      cojam-db:
        condition: service_healthy
    healthcheck:
      # /readyz is 200 only when the process is up AND the DB answers a ping.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/readyz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        # Loki derives container_name from this tag (promtail-config.yaml).
        tag: "{{.Name}}"
        max-size: "10m"
        max-file: "3"

  cojam-web:
    image: ${IMG_COJAM_WEB:-ghcr.io/lucassantana-dev/cojam-web:latest}
    labels:
      - wud.watch=true
    container_name: cojam-web
    restart: unless-stopped
    environment:
      # Runtime config (the image is environment-agnostic; served via /env.js).
      # Single-subdomain: the WS lives under /connection on the same host as the
      # web app; Caddy path-routes /connection/* to the Go server. COJAM_DOMAIN
      # lets cojam use its own domain (lucassantana.tech) without moving other
      # services off the shared ${DOMAIN}; it falls back to ${DOMAIN} if unset.
      COJAM_WS_URL: wss://cojam.${COJAM_DOMAIN:-${DOMAIN}}/connection/websocket
      # Canonical site origin for metadata, sitemap and JSON-LD (cojam#324).
      # Never derived from request headers in production.
      COJAM_SITE_URL: https://cojam.${COJAM_DOMAIN:-${DOMAIN}}
      COJAM_SPOTIFY_CLIENT_ID: ${COJAM_SPOTIFY_CLIENT_ID:-}
      COJAM_FEATURE_SPOTIFY: ${COJAM_FEATURE_SPOTIFY:-}
      # Room auth + Supabase accounts, served to the client via /env.js.
      COJAM_FEATURE_ROOM_AUTH: ${COJAM_FEATURE_ROOM_AUTH:-}
      COJAM_FEATURE_PUBLIC_ROOMS: ${COJAM_FEATURE_PUBLIC_ROOMS:-}
      COJAM_FEATURE_QUEUE_VOTING: ${COJAM_FEATURE_QUEUE_VOTING:-}
      COJAM_FEATURE_ROOM_CHAT: ${COJAM_FEATURE_ROOM_CHAT:-}
      # Client telemetry + sync drift samples (cojam#442), served via /env.js.
      COJAM_FEATURE_TELEMETRY: ${COJAM_FEATURE_TELEMETRY:-}
      # Supabase accounts OFF (see cojam-server FEATURE_SUPABASE_AUTH above) —
      # not required; the /env.js route already omits both fields unless BOTH
      # are set (apps/web/app/env.js/route.ts), so leaving these unset is safe.
      COJAM_SUPABASE_URL: ${COJAM_SUPABASE_URL:-}
      COJAM_SUPABASE_ANON_KEY: ${COJAM_SUPABASE_ANON_KEY:-}
      TZ: ${TIMEZONE:-UTC}
    ports:
      # Loopback-pinned for the same reason as cojam-server above.
      - "127.0.0.1:8096:3000"
    networks:
      - frontend
    depends_on:
      - cojam-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        # Loki derives container_name from this tag (promtail-config.yaml).
        tag: "{{.Name}}"
        max-size: "10m"
        max-file: "3"

networks:
  # Created by hand once (docs/runbooks/cojam-deploy.md, Observability
  # rollout); only cojam-db and grafana join it. Internal: no egress.
  cojam-db-ro:
    external: true

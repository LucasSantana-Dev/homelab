services:
  grafana:
    image: ${IMG_GRAFANA:-grafana/grafana-oss:11.4.6}
    container_name: grafana
    restart: unless-stopped
    volumes:
    - grafana_data:/var/lib/grafana
    # Provisioning: datasources + dashboards versioned alongside this
    # compose file. See config/grafana/provisioning/dashboards/dashboards.yml
    # for the provider config that loads files from this directory.
    - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    - GF_SECURITY_ADMIN_USER=admin
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_SERVER_DOMAIN=grafana.${DOMAIN}
    - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
    - GF_AUTH_GENERIC_OAUTH_ENABLED=${GRAFANA_OAUTH_ENABLED:-true}
    - GF_AUTH_GENERIC_OAUTH_NAME=Google
    - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
    - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GOOGLE_CLIENT_ID}
    - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
    - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
    - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://accounts.google.com/o/oauth2/v2/auth
    - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://oauth2.googleapis.com/token
    - GF_AUTH_GENERIC_OAUTH_API_URL=https://openidconnect.googleapis.com/v1/userinfo
    - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=email
    - GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH=email
    - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
    # Tinyauth edge already enforces TINYAUTH_ALLOWED_EMAILS; any Google account that
    # passes the edge is the operator → always Admin (ADR-0020).
    - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH='Admin'
    # Keep form enabled — fallback if Google is unreachable (ADR-0020)
    - GF_AUTH_DISABLE_LOGIN_FORM=${GRAFANA_DISABLE_LOGIN_FORM:-false}
    ports:
    - ${BIND_IP:-0.0.0.0}:${GRAFANA_PORT:-3002}:3000
    networks:
    - default
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  alertmanager:
    image: ${IMG_ALERTMANAGER:-prom/alertmanager:v0.28.1}
    container_name: alertmanager
    restart: unless-stopped
    environment:
    - ALERTMANAGER_DISCORD_WEBHOOK=${ALERTMANAGER_DISCORD_WEBHOOK}
    volumes:
    - ../config/alertmanager:/etc/alertmanager
    - ../appdata/alertmanager:/alertmanager
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    - --cluster.listen-address=
    ports:
    - ${BIND_IP:-0.0.0.0}:9093:9093
    networks:
    - default
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:9093/-/healthy
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  blackbox-exporter:
    image: ${IMG_BLACKBOX:-prom/blackbox-exporter:v0.28.0}
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
    - ../config/blackbox:/etc/blackbox_exporter
    command:
    - --config.file=/etc/blackbox_exporter/blackbox.yml
    ports:
    - 127.0.0.1:9115:9115
    networks:
    - default
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:9115/-/healthy
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  prometheus:
    image: ${IMG_PROMETHEUS:-prom/prometheus:v2.54.1}
    container_name: prometheus
    restart: unless-stopped
    volumes:
    - ../config/prometheus:/etc/prometheus
    - prometheus_data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --web.console.templates=/etc/prometheus/consoles
    - --storage.tsdb.retention.time=200h
    - --web.enable-lifecycle
    ports:
    - ${BIND_IP:-0.0.0.0}:${PROMETHEUS_PORT:-9091}:9090
    networks:
    - default
    # `lucky-monitoring` is an external network owned by the Lucky
    # docker-compose project. Joining it lets Prometheus resolve
    # `lucky-bot` and `lucky-backend` by service DNS for the scrape
    # targets defined in config/prometheus/prometheus.yml. See
    # docs/runbooks/lucky-observability.md.
    - lucky-monitoring
    depends_on:
    - alertmanager
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      # prom/prometheus is busybox-based: ships wget, NOT curl. The old curl
      # probe could never exec ("curl: not found") → perpetual "unhealthy".
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:9090/-/healthy
      interval: 30s
      timeout: 10s
      retries: 3
  node-exporter:
    image: ${IMG_NODE_EXPORTER:-prom/node-exporter:v1.9.1}
    container_name: node-exporter
    restart: unless-stopped
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/rootfs:ro
    - /var/lib/node_exporter/textfile:/var/lib/node_exporter/textfile:ro
    command:
    - --path.procfs=/host/proc
    - --path.rootfs=/rootfs
    - --path.sysfs=/host/sys
    - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    - --collector.textfile.directory=/var/lib/node_exporter/textfile
    ports:
    - 127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100
    networks:
    - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      # prom/node-exporter ships wget, not curl (busybox). curl probe never ran.
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:9100/metrics
      interval: 30s
      timeout: 10s
      retries: 3
  cadvisor:
    image: ${IMG_CADVISOR:-gcr.io/cadvisor/cadvisor:v0.49.1}
    container_name: cadvisor
    restart: unless-stopped
    # H3 hardening: replaced 'privileged: true' with explicit capabilities + devices.
    # cadvisor only needs DAC_READ_SEARCH (read cgroup/proc fs) + SYS_PTRACE (process stats).
    # devices: /dev/kmsg is required for some kernel-level event collection.
    cap_drop:
    - ALL
    cap_add:
    - DAC_READ_SEARCH
    - SYS_PTRACE
    devices:
    - /dev/kmsg:/dev/kmsg
    security_opt:
    - no-new-privileges:true
    command:
    - --docker_only
    - --housekeeping_interval=30s
    - --max_housekeeping_interval=1m
    - --event_storage_age_limit=default=1h
    - --event_storage_event_limit=default=1000
    - --store_container_labels=false
    volumes:
    - /:/rootfs:ro
    - /var/lib/node_exporter/textfile:/var/lib/node_exporter/textfile:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    - /dev/disk/:/dev/disk:ro
    ports:
    - 127.0.0.1:8082:8080
    networks:
    - default
    healthcheck:
      disable: true
    mem_limit: 768M
    memswap_limit: 1536M
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  loki:
    image: ${IMG_LOKI:-grafana/loki:2.9.13}
    container_name: loki
    restart: unless-stopped
    volumes:
    - ../appdata/loki:/loki
    - ../config/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    # M3 hardening: Loki is consumed only by Grafana over the internal docker
    # network. Removed the 0.0.0.0 binding to eliminate unauth-API exposure
    # when BIND_IP is unset. 127.0.0.1 retained for host-side debugging only.
    ports:
    - 127.0.0.1:3100:3100
    networks:
    - default
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.2'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  promtail:
    image: ${IMG_PROMTAIL:-grafana/promtail:2.9.13}
    container_name: promtail
    restart: unless-stopped
    volumes:
    - ../config/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
    - /var/log:/var/log:ro
    - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
    - default
    depends_on:
    - loki
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      # grafana/promtail ships no curl/wget/nc/python — no in-container probe is
      # possible (same constraint as gatus/loki below). The old curl probe could
      # never exec → perpetual "unhealthy". Disabled here; promtail liveness is
      # observable via Loki ingestion, and an external blackbox-exporter probe of
      # :9080/ready is the correct monitoring (TODO: add the blackbox target).
      disable: true
  gatus:
    image: ${IMG_GATUS:-twinproduction/gatus:v5.36.0}
    container_name: gatus
    restart: unless-stopped
    volumes:
    - ../config/gatus/config.yaml:/config/config.yaml:ro
    - gatus_data:/data
    environment:
    - TZ=${TIMEZONE}
    - GATUS_CONFIG_PATH=/config
    ports:
    - ${BIND_IP:-0.0.0.0}:${GATUS_PORT:-8095}:8080
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.05'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      # Gatus image is distroless — no curl/wget/sh. Use TCP-only probe via
      # Go's net.Dialer through nc-style; fallback to disabling healthcheck
      # if no probe is available. The image ships /gatus binary only.
      # Disable docker healthcheck; Gatus self-monitors via its own UI.
      disable: true

  healthchecks-db:
    image: ${IMG_POSTGRES_15_ALPINE:-postgres:15.17-alpine}
    container_name: healthchecks-db
    restart: unless-stopped
    volumes:
      - healthchecks_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=healthchecks
      - POSTGRES_USER=healthchecks
      - POSTGRES_PASSWORD=${HEALTHCHECKS_DB_PASSWORD:-changeme}
      - TZ=${TIMEZONE}
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d healthchecks -U healthchecks"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  healthchecks:
    image: ${IMG_HEALTHCHECKS:-healthchecks/healthchecks:v4.2}
    container_name: healthchecks
    restart: unless-stopped
    depends_on:
      healthchecks-db:
        condition: service_healthy
    environment:
      - SECRET_KEY=${HEALTHCHECKS_SECRET_KEY}
      # v4.0+ requires Postgres or MySQL (SQLite support removed). Use Postgres
      # for consistency with Paperless. Requires DB_ENGINE, DB_NAME, DB_HOST,
      # DB_USER, DB_PASSWORD to be set.
      - DB_ENGINE=postgres
      - DB_NAME=healthchecks
      - DB_HOST=healthchecks-db
      - DB_USER=healthchecks
      - DB_PASSWORD=${HEALTHCHECKS_DB_PASSWORD:-changeme}
      - DB_PORT=5432
      - DEFAULT_FROM_EMAIL=healthchecks@${DOMAIN:-home}
      # ALLOWED_HOSTS — Django host-header allowlist. Restrict to expected
      # access paths: LAN loopback, Tailscale magicDNS, and the public
      # subdomain. `*` would disable the protection entirely.
      - ALLOWED_HOSTS=healthchecks.${DOMAIN:-home},${TAILSCALE_IP:-100.64.0.0},localhost,127.0.0.1
      - SITE_ROOT=https://healthchecks.${DOMAIN:-home}
      - SITE_NAME=Homelab Healthchecks
      - SUPERUSER_EMAIL=${HEALTHCHECKS_SUPERUSER_EMAIL}
      - SUPERUSER_PASSWORD=${HEALTHCHECKS_SUPERUSER_PASSWORD}
      - DEBUG=False
      - TZ=${TIMEZONE}
    volumes:
      - healthchecks_data:/data
    ports:
      - ${BIND_IP:-0.0.0.0}:${HEALTHCHECKS_PORT:-8092}:8000
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.05'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      # healthchecks/healthchecks ships python3 only (no curl/wget). urllib
      # raises on any HTTP error, so this reports unhealthy on the DB-500 and
      # healthy once the app serves 200. 127.0.0.1 (not localhost) avoids ::1.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  grafana_data: null
  prometheus_data: null
  gatus_data: null
  healthchecks_data: null
  healthchecks_db: null

networks:
  # External network created by the Lucky docker-compose project so the
  # homelab Prometheus container can scrape Lucky's bot and backend
  # without exposing their /metrics ports on the host. The Lucky-side
  # change (network declaration + bot/backend membership) lands in a
  # paired PR in the Lucky repo.
  lucky-monitoring:
    external: true

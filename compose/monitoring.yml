# Monitoring Stack
# Prometheus, Grafana, Loki, Alertmanager, Netdata, Promtail, Node-exporter, cAdvisor, Blackbox-exporter

services:
  # Grafana - TAILSCALE ONLY (Sensitive Service)
  grafana:
    image: ${IMG_GRAFANA:-grafana/grafana-oss:11.4.6}
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=grafana.${DOMAIN}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GF_AUTH_GENERIC_OAUTH_ENABLED=${GRAFANA_OAUTH_ENABLED:-true}
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${AUTHENTIK_GRAFANA_CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${AUTHENTIK_GRAFANA_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.${DOMAIN}/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.${DOMAIN}/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.${DOMAIN}/application/o/userinfo/
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=email
      - GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH=email
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'
      - GF_AUTH_DISABLE_LOGIN_FORM=${GRAFANA_DISABLE_LOGIN_FORM:-true}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${BIND_IP:-0.0.0.0}:${GRAFANA_PORT:-3002}:3000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Alertmanager - Alert routing and notifications - TAILSCALE ONLY
  alertmanager:
    image: ${IMG_ALERTMANAGER:-prom/alertmanager:v0.28.1}
    container_name: alertmanager
    restart: unless-stopped
    environment:
      - ALERTMANAGER_DISCORD_WEBHOOK=${ALERTMANAGER_DISCORD_WEBHOOK}
    volumes:
      - ../config/alertmanager:/etc/alertmanager
      - ../appdata/alertmanager:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "127.0.0.1:9093:9093"
      - "${BIND_IP:-0.0.0.0}:9093:9093"
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Blackbox Exporter - HTTP/TCP endpoint monitoring - Localhost only
  blackbox-exporter:
    image: ${IMG_BLACKBOX:-prom/blackbox-exporter:v0.28.0}
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ../config/blackbox:/etc/blackbox_exporter
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    ports:
      - "127.0.0.1:9115:9115"
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus - TAILSCALE ONLY (Sensitive Service)
  prometheus:
    image: ${IMG_PROMETHEUS:-prom/prometheus:v2.54.1}
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - ../config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      # Localhost access
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
      # Tailscale access ONLY
      - "${BIND_IP:-0.0.0.0}:${PROMETHEUS_PORT:-9091}:9090"
    networks:
      - default
    depends_on:
      - alertmanager
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Node Exporter - LOCALHOST ONLY (System Metrics)
  node-exporter:
    image: ${IMG_NODE_EXPORTER:-prom/node-exporter:v1.9.1}
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      # Localhost access ONLY
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # cAdvisor - Container Metrics
  cadvisor:
    image: ${IMG_CADVISOR:-gcr.io/cadvisor/cadvisor:v0.49.1}
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - '--docker_only'
      - '--housekeeping_interval=30s'
      - '--max_housekeeping_interval=1m'
      - '--event_storage_age_limit=default=1h'
      - '--event_storage_event_limit=default=1000'
      - '--store_container_labels=false'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - default
    healthcheck:
      disable: true
    mem_limit: 768M
    memswap_limit: 1536M
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Netdata - Real-time System Monitoring
  netdata:
    image: ${IMG_NETDATA:-netdata/netdata:stable}
    container_name: netdata
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN:-}
    ports:
      - "${BIND_IP:-0.0.0.0}:19999:19999"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Loki Log Aggregation - Localhost + Tailscale
  loki:
    image: ${IMG_LOKI:-grafana/loki:2.9.13}
    container_name: loki
    restart: unless-stopped
    volumes:
      - ../appdata/loki:/loki
      - ../config/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
      - "${BIND_IP:-0.0.0.0}:3100:3100"
    networks:
      - default
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.2'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Promtail Log Collection
  promtail:
    image: ${IMG_PROMTAIL:-grafana/promtail:2.9.13}
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ../config/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - default
    depends_on:
      - loki
    # Promtail doesn't expose a health endpoint, monitoring via logs only
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Gatus - declarative uptime monitoring (replaces Uptime Kuma)
  gatus:
    image: ${IMG_GATUS:-twinproduction/gatus:v5.16.0}
    container_name: gatus
    restart: unless-stopped
    volumes:
      - ../config/gatus/config.yaml:/config/config.yaml:ro
      - gatus_data:/data
    environment:
      - TZ=${TIMEZONE}
      - GATUS_CONFIG_PATH=/config
    ports:
      - "${BIND_IP:-0.0.0.0}:${GATUS_PORT:-8095}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.05'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  grafana_data:
  prometheus_data:
  netdataconfig:
  netdatalib:
  netdatacache:
  gatus_data:

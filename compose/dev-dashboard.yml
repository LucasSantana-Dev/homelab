# Dev Dashboard Service
# Static development documentation site served via Python HTTP server

services:
  dev-dashboard:
    image: python:3-alpine
    container_name: dev-dashboard
    restart: unless-stopped
    command: python3 -m http.server 8899 --directory /srv
    volumes:
      - /home/luk-server/dev-dashboard-site:/srv:ro
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
        reservations:
          memory: 64M
          cpus: '0.05'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

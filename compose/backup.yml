services:
  # Kopia — encrypted, deduplicated, snapshot-based backups to a LOCAL
  # filesystem repository at /opt/kopia-repo. Interim: no offsite DR yet —
  # add an S3/B2 target later (see ADR-0016). Mount /var/lib/docker/volumes
  # read-only so Kopia can snapshot named volumes from sister stacks.
  kopia:
    image: ${IMG_KOPIA:-kopia/kopia:0.21.1}
    container_name: kopia
    restart: unless-stopped
    hostname: homelab-kopia
    user: root
    environment:
      - TZ=${TIMEZONE}
      # Repo encryption password — consumed by `repository create/connect` below.
      - KOPIA_PASSWORD=${KOPIA_REPO_PASSWORD}
    # Connect to the local repo (create it on first run), then serve. Bare
    # `kopia server start` (the old config) never initialised a repository, so
    # it could not work even with valid credentials. KOPIA_PASSWORD supplies the
    # repo password. The image ships /bin/sh + wget (its healthcheck uses
    # CMD-SHELL), so a shell entrypoint is safe.
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -e
        kopia repository connect filesystem --path=/repo 2>/dev/null \
          || kopia repository create filesystem --path=/repo
        # Retention + daily auto-snapshot schedule (idempotent). The server
        # honours --snapshot-interval to run scheduled snapshots itself.
        kopia policy set --global --compression=zstd --snapshot-interval=24h \
          --keep-latest=10 --keep-daily=7 --keep-weekly=4 --keep-monthly=3 || true
        # Initial snapshot now (immediate backup + registers the sources for
        # scheduling). Space-bounded: docker volumes (~5.4G) + homelab appdata
        # (~7.3G); the ~183G bulk of /home is intentionally left for a future
        # offsite target, not this same-disk interim repo.
        kopia snapshot create /source/docker-volumes /source/appdata /source/config || true
        # --insecure: HTTP-only, safe because the port binds to ${BIND_IP}
        # (default 127.0.0.1) and the host is reachable only via Tailscale.
        exec kopia server start --insecure --address=0.0.0.0:51515 \
          --server-username="${KOPIA_SERVER_USERNAME:-admin}" \
          --server-password="${KOPIA_SERVER_PASSWORD}"
    volumes:
      - kopia_config:/app/config
      - kopia_cache:/app/cache
      - kopia_logs:/app/logs
      # Local repository (the backup destination) on the host data disk —
      # deliberately OUTSIDE the read-only source mounts so it isn't backed
      # up into itself.
      - /opt/kopia-repo:/repo
      # Read-only backup sources. Scoped to the homelab's critical state so the
      # same-disk interim repo stays small; add /home (or a bulk subtree) once
      # an offsite target exists.
      - /var/lib/docker/volumes:/source/docker-volumes:ro
      - /home/luk-server/homelab/appdata:/source/appdata:ro
      # Service configs (Home Assistant, Grafana, Pi-hole, Caddy, etc.). Added
      # 2026-06-19 after an HA config loss revealed config/ was OUTSIDE Kopia's
      # backup scope (it's a bind mount, not a named volume or appdata).
      - /home/luk-server/homelab/config:/source/config:ro
    ports:
      - ${BIND_IP:-127.0.0.1}:${KOPIA_PORT:-51515}:51515
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      # `kopia repository status` exits non-zero if the repo is missing or
      # unreachable. The image ships no wget/curl (the old wget check could
      # never pass), and this also reports healthy during the initial snapshot
      # — the repo is connected before the server endpoint comes up.
      test: ["CMD", "kopia", "repository", "status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  kopia_config: null
  kopia_cache: null
  kopia_logs: null

# Security Services
# Pi-hole

services:
  # Pi-hole - LOCALHOST ONLY (Local Network Service)
  pihole:
    image: ${IMG_PIHOLE:-pihole/pihole:2026.04.0}
    container_name: pihole
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - pihole_data:/etc/pihole
      - ../config/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    environment:
      - TZ=${TIMEZONE}
      - WEBPASSWORD=${PIHOLE_WEB_PASSWORD}
      - PIHOLE_DNS_=8.8.8.8;1.1.1.1
      - FTLCONF_dns_listeningMode=all
      - FTLCONF_webserver_api_password=${PIHOLE_WEB_PASSWORD}
      - VIRTUAL_HOST=pihole.${DOMAIN}
      - VIRTUAL_PORT=80
    ports:
      # Bind only to Tailscale IP for secure access
      - "${BIND_IP:-0.0.0.0}:${PIHOLE_WEB_PORT:-8054}:80"
      - "${BIND_IP:-0.0.0.0}:${PIHOLE_DNS_PORT:-53}:53/tcp"
      - "${BIND_IP:-0.0.0.0}:${PIHOLE_DNS_PORT:-53}:53/udp"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pihole_data:

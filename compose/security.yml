services:
  pihole:
    image: ${IMG_PIHOLE:-pihole/pihole:2026.04.0}
    container_name: pihole
    restart: unless-stopped
    volumes:
    - pihole_data:/etc/pihole
    - ../config/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    network_mode: host
    environment:
    - TZ=${TIMEZONE}
    - WEBPASSWORD=${PIHOLE_WEB_PASSWORD}
    - PIHOLE_DNS_=8.8.8.8;1.1.1.1
    - FTLCONF_dns_listeningMode=local
    - FTLCONF_webserver_api_password=${PIHOLE_WEB_PASSWORD}
    - FTLCONF_webserver_port=${PIHOLE_WEB_PORT:-8054}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      # Pi-hole v6: all /api/* endpoints require auth and return 401. /admin/
      # returns 302 (redirect to login), which curl --fail treats as success.
      # Verified in-container post-deploy on 2026.04.0.
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:${PIHOLE_WEB_PORT:-8054}/admin/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  crowdsec:
    image: ${IMG_CROWDSEC:-crowdsecurity/crowdsec:v1.6.5}
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - GID=1000
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/caddy crowdsecurity/sshd crowdsecurity/http-cve crowdsecurity/base-http-scenarios
      - TZ=${TIMEZONE}
    volumes:
      - crowdsec_db:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - /var/log:/var/log:ro
      - /var/log/caddy:/var/log/caddy:ro
    ports:
      - ${BIND_IP:-127.0.0.1}:${CROWDSEC_API_PORT:-8090}:8080
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: ["CMD", "cscli", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pihole_data: null
  crowdsec_db: null
  crowdsec_config: null

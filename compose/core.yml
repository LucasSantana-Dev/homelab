# Core Infrastructure Services
# Nginx, Homepage, Portainer, Uptime-Kuma, What's Up Docker

services:
  # Nginx Reverse Proxy
  nginx:
    image: ${IMG_NGINX:-nginx:alpine}
    container_name: nginx-proxy
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - ../config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../config/nginx/ssl:/etc/nginx/ssl:ro
      - ../config/nginx/auth:/etc/nginx/auth:ro
    ports:
      # Bind only to Tailscale IP for secure access (domain accessible via Tailscale only)
      - "${BIND_IP:-0.0.0.0}:80:80"
      - "${BIND_IP:-0.0.0.0}:443:443"
      # Localhost for health checks
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    networks:
      - default
      - frontend
    depends_on:
      - homepage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Cloudflare Tunnel - Selected public hostnames only
  cloudflared:
    image: ${IMG_CLOUDFLARED:-cloudflare/cloudflared:2025.4.0}
    container_name: cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - --config
      - /etc/cloudflared/config.yml
      - run
      - --token
      - ${CF_TUNNEL_TOKEN}
    volumes:
      - ../config/cloudflared:/etc/cloudflared:ro
    ports:
      - "127.0.0.1:2000:2000"
    networks:
      - frontend
    extra_hosts:
      # Required so cloudflared can dial the host-networked caddy-lan
      # instance at `host.docker.internal:80` (see config.yml). Docker
      # maps `host-gateway` to the host bridge IP automatically.
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Homepage Dashboard - Tailscale Only
  homepage:
    image: ${IMG_HOMEPAGE:-ghcr.io/gethomepage/homepage:v1.0.3}
    container_name: homepage
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - ../config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - HOMEPAGE_ALLOWED_HOSTS=${DOMAIN},www.${DOMAIN},localhost,127.0.0.1
      - HOMEASSISTANT_KEY=${HOMEASSISTANT_KEY}
      - DOMAIN=${DOMAIN}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${BIND_IP:-0.0.0.0}:${HOMEPAGE_PORT:-3000}:3000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Portainer - TAILSCALE ONLY (Sensitive Service)
  portainer:
    image: ${IMG_PORTAINER:-portainer/portainer-ce:2.21.4}
    container_name: portainer
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      # Bind only to Tailscale IP for secure access
      - "${BIND_IP:-0.0.0.0}:${PORTAINER_PORT:-9000}:9000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # What's Up Docker - TAILSCALE ONLY (Sensitive Service)
  whats-up-docker:
    image: ${IMG_WUD:-fmartinou/whats-up-docker:6.6.1}
    container_name: whats-up-docker
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - whats_up_docker_data:/app/data
    environment:
      - WUD_UPDATER_DOCKER_HUB_TOKEN=${DOCKER_HUB_TOKEN:-}
      - WUD_UPDATER_GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WUD_DISCORD_WEBHOOK_URL=${WUD_DISCORD_WEBHOOK_URL}
      - WUD_SMTP_HOST=${WUD_SMTP_HOST}
      - WUD_SMTP_PORT=${WUD_SMTP_PORT}
      - WUD_SMTP_USER=${WUD_SMTP_USER}
      - WUD_SMTP_PASS=${WUD_SMTP_PASS}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${BIND_IP:-0.0.0.0}:${WUD_PORT:-3003}:3000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  portainer_data:
  whats_up_docker_data:

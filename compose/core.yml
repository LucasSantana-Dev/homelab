# Core Infrastructure Services
# Nginx, Homepage, Portainer, Uptime-Kuma, What's Up Docker

services:
  # Nginx Reverse Proxy
  nginx:
    image: ${IMG_NGINX:-nginx:alpine}
    container_name: nginx-proxy
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - ../config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../config/nginx/ssl:/etc/nginx/ssl:ro
      - ../config/nginx/auth:/etc/nginx/auth:ro
    ports:
      # Bind only to Tailscale IP for secure access (domain accessible via Tailscale only)
      - "${TAILSCALE_IP}:80:80"
      - "${TAILSCALE_IP}:443:443"
      # Localhost for health checks
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    networks:
      - default
      - frontend
    depends_on:
      - homepage
      - uptime-kuma
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Cloudflare Tunnel - Selected public hostnames only
  cloudflared:
    image: ${IMG_CLOUDFLARED:-cloudflare/cloudflared:latest}
    container_name: cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - --config
      - /etc/cloudflared/config.yml
      - run
      - --token
      - ${CF_TUNNEL_TOKEN}
    volumes:
      - ../config/cloudflared:/etc/cloudflared:ro
    ports:
      - "127.0.0.1:2000:2000"
    networks:
      - frontend
    depends_on:
      - nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Homepage Dashboard - Tailscale Only
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - ../config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - HOMEPAGE_ALLOWED_HOSTS=${DOMAIN},www.${DOMAIN},localhost,127.0.0.1
      - HOMEASSISTANT_KEY=${HOMEASSISTANT_KEY}
      - DOMAIN=${DOMAIN}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${HOMEPAGE_PORT:-3000}:3000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Uptime Kuma - Tailscale Only
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - uptime_kuma_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TIMEZONE}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${UPTIME_KUMA_PORT:-3001}:3001"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Portainer - TAILSCALE ONLY (Sensitive Service)
  portainer:
    image: ${IMG_PORTAINER:-portainer/portainer-ce:latest}
    container_name: portainer
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${PORTAINER_PORT:-9000}:9000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # What's Up Docker - TAILSCALE ONLY (Sensitive Service)
  whats-up-docker:
    image: fmartinou/whats-up-docker:latest
    container_name: whats-up-docker
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - whats_up_docker_data:/app/data
    environment:
      - WUD_UPDATER_DOCKER_HUB_TOKEN=${DOCKER_HUB_TOKEN:-}
      - WUD_UPDATER_GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WUD_DISCORD_WEBHOOK_URL=${WUD_DISCORD_WEBHOOK_URL}
      - WUD_SMTP_HOST=${WUD_SMTP_HOST}
      - WUD_SMTP_PORT=${WUD_SMTP_PORT}
      - WUD_SMTP_USER=${WUD_SMTP_USER}
      - WUD_SMTP_PASS=${WUD_SMTP_PASS}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${WUD_PORT:-3003}:3000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FileBrowser - NAS-like File Manager
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    volumes:
      - ../config/nginx/www/certbot:/var/www/certbot:ro
      - filebrowser_data:/database
      - /home/luk-server:/srv/home
      - /home/luk-server/media:/srv/media
      - /home/luk-server/homelab:/srv/homelab
    environment:
      - TZ=${TIMEZONE}
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/srv
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${FILEBROWSER_PORT:-8080}:80"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  portainer_data:
  uptime_kuma_data:
  whats_up_docker_data:
  filebrowser_data:

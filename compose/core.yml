services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.5.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      VERSION: 1
      PING: 1
      POST: 0
      GET: 0
      PUT: 0
      DELETE: 0
      PATCH: 0
      HEAD: 0
      OPTIONS: 0
      VOLUMES: 0
      EXEC: 0
      NETWORKS: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SWARM: 0
      NODES: 0
      DISTRIBUTION: 0
      GRPC: 0
      LIBPOD: 0
      STREAM: 0
      SESSION: 0
      BUILDING: 0
      BUILD: 0
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    networks:
    - socketproxy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
  cloudflared:
    image: ${IMG_CLOUDFLARED:-cloudflare/cloudflared:2025.4.0}
    labels:
    - wud.watch=true
    - wud.tag.include=^\d+\.\d+\.\d+$$
    - wud.watch.digest=false
    container_name: cloudflared
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
    command:
    - tunnel
    - --no-autoupdate
    - --metrics
    - 0.0.0.0:2000
    - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN}
    ports:
    - 127.0.0.1:2000:2000
    networks:
    - frontend
    extra_hosts:
    - host.docker.internal:host-gateway
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M
          cpus: '0.05'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      disable: true
  homepage:
    image: ${IMG_HOMEPAGE:-ghcr.io/gethomepage/homepage:v1.13.2}
    labels:
    - wud.watch=true
    - wud.tag.include=^v\d+\.\d+\.\d+$$
    container_name: homepage
    restart: unless-stopped
    volumes:
    - ../config/homepage:/app/config
    - ../config/homepage/icons:/app/public/icons:ro
    environment:
    - PUID=${PUID}
    - PGID=983
    - TZ=${TIMEZONE}
    - HOMEPAGE_ALLOWED_HOSTS=${DOMAIN},www.${DOMAIN},localhost,127.0.0.1
    - HOMEASSISTANT_KEY=${HOMEASSISTANT_KEY}
    - DOMAIN=${DOMAIN}
    - HOMEPAGE_GITHUB_TOKEN=${HOMEPAGE_GITHUB_TOKEN:-}
    - HOMEPAGE_VAR_PIHOLE_KEY=${HOMEPAGE_VAR_PIHOLE_KEY}
    - HOMEPAGE_VAR_HEALTHCHECKS_KEY=${HOMEPAGE_VAR_HEALTHCHECKS_KEY}
    - HOMEPAGE_VAR_PORTAINER_KEY=${HOMEPAGE_VAR_PORTAINER_KEY}
    - HOMEPAGE_VAR_GRAFANA_PASSWORD=${GRAFANA_PASSWORD}
    - HOMEPAGE_VAR_PAPERLESS_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
    ports:
    - ${BIND_IP:-127.0.0.1}:${HOMEPAGE_PORT:-3000}:3000
    networks:
    - default
    - socketproxy
    extra_hosts:
    - host.docker.internal:host-gateway
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:3000/
      interval: 30s
      timeout: 10s
      retries: 3
  portainer:
    image: ${IMG_PORTAINER:-portainer/portainer-ce:2.42.0}
    labels:
    - wud.watch=true
    - wud.tag.include=^\d+\.\d+\.\d+$$
    container_name: portainer
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer_data:/data
    ports:
    - ${BIND_IP:-127.0.0.1}:${PORTAINER_PORT:-9000}:9000
    networks:
    - default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      disable: true
  whats-up-docker:
    image: ${IMG_WUD:-fmartinou/whats-up-docker:6.6.1}
    labels:
    - wud.watch=true
    - wud.tag.include=^\d+\.\d+\.\d+$$
    container_name: whats-up-docker
    restart: unless-stopped
    volumes:
    - whats_up_docker_data:/app/data
    environment:
    - WUD_WATCHER_LOCAL_WATCHBYDEFAULT=false
    - WUD_UPDATER_DOCKER_HUB_TOKEN=${DOCKER_HUB_TOKEN:-}
    - WUD_UPDATER_GITHUB_TOKEN=${GITHUB_TOKEN:-}
    - WUD_TRIGGER_DISCORD_local_URL=${WUD_DISCORD_WEBHOOK_URL:-}
    - WUD_TRIGGER_HTTP_digest_URL=${WUD_N8N_WEBHOOK_URL:-}
    - WUD_SMTP_HOST=${WUD_SMTP_HOST}
    - WUD_SMTP_PORT=${WUD_SMTP_PORT}
    - WUD_SMTP_USER=${WUD_SMTP_USER}
    - WUD_SMTP_PASS=${WUD_SMTP_PASS}
    - WUD_WATCHER_LOCAL_HOST=docker-socket-proxy
    - WUD_WATCHER_LOCAL_PORT=2375
    ports:
    - 127.0.0.1:${WUD_PORT:-3003}:3000
    - ${TAILSCALE_IP}:${WUD_PORT:-3003}:3000
    networks:
    - default
    - socketproxy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:3000/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  homelab-manager:
    image: homelab-manager:local
    build:
      context: ..
      dockerfile: dockerfiles/homelab-manager/Dockerfile
    container_name: homelab-manager
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
    - 127.0.0.1:${HOMELAB_MANAGER_PORT:-8765}:8765
    networks:
    - default
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health',
        timeout=8).status==200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.05'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
volumes:
  portainer_data: null
  whats_up_docker_data: null

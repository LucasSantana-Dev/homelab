services:
  # nginx-proxy service removed: Caddy + Cloudflared own all ingress now.
  # PR #78 deleted config/nginx/ but accidentally left this service block,
  # which referenced 5 non-existent bind mounts and broke fresh deploys.
  # Closes audit-deep v2 C2.
  cloudflared:
    image: ${IMG_CLOUDFLARED:-cloudflare/cloudflared:2025.4.0}
    container_name: cloudflared
    restart: unless-stopped
    command:
    - tunnel
    - --no-autoupdate
    - --metrics
    - 0.0.0.0:2000
    - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN}
    ports:
    - 127.0.0.1:2000:2000
    networks:
    - frontend
    extra_hosts:
    - host.docker.internal:host-gateway
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      disable: true
  homepage:
    image: ${IMG_HOMEPAGE:-ghcr.io/gethomepage/homepage:v1.0.3}
    container_name: homepage
    restart: unless-stopped
    volumes:
    - ../config/homepage:/app/config
    - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TIMEZONE}
    - HOMEPAGE_ALLOWED_HOSTS=${DOMAIN},www.${DOMAIN},localhost,127.0.0.1
    - HOMEASSISTANT_KEY=${HOMEASSISTANT_KEY}
    - DOMAIN=${DOMAIN}
    - HOMEPAGE_GITHUB_TOKEN=${HOMEPAGE_GITHUB_TOKEN:-}
    - HOMEPAGE_VAR_PIHOLE_KEY=${PIHOLE_API_KEY:-}
    - HOMEPAGE_VAR_PORTAINER_KEY=${HOMEPAGE_VAR_PORTAINER_KEY:-}
    ports:
    - ${BIND_IP:-0.0.0.0}:${HOMEPAGE_PORT:-3000}:3000
    networks:
    - default
    extra_hosts:
    - host.docker.internal:host-gateway
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:3000/
      interval: 30s
      timeout: 10s
      retries: 3
  portainer:
    image: ${IMG_PORTAINER:-portainer/portainer-ce:2.21.4}
    container_name: portainer
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer_data:/data
    ports:
    - ${BIND_IP:-0.0.0.0}:${PORTAINER_PORT:-9000}:9000
    networks:
    - default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - https://localhost:9443/api/system/status
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  whats-up-docker:
    image: ${IMG_WUD:-fmartinou/whats-up-docker:6.6.1}
    container_name: whats-up-docker
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - whats_up_docker_data:/app/data
    environment:
    - WUD_UPDATER_DOCKER_HUB_TOKEN=${DOCKER_HUB_TOKEN:-}
    - WUD_UPDATER_GITHUB_TOKEN=${GITHUB_TOKEN:-}
    - WUD_DISCORD_WEBHOOK_URL=${WUD_DISCORD_WEBHOOK_URL}
    - WUD_SMTP_HOST=${WUD_SMTP_HOST}
    - WUD_SMTP_PORT=${WUD_SMTP_PORT}
    - WUD_SMTP_USER=${WUD_SMTP_USER}
    - WUD_SMTP_PASS=${WUD_SMTP_PASS}
    ports:
    - ${BIND_IP:-0.0.0.0}:${WUD_PORT:-3003}:3000
    networks:
    - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:3000/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  homelab-manager:
    image: ${IMG_HOMELAB_MANAGER:-python:3.11-slim}
    container_name: homelab-manager
    restart: unless-stopped
    working_dir: /tmp/build
    entrypoint:
    - sh
    - -c
    # The /app mount is read-only for security, but pip's egg_info step
    # writes `homelab_manager.egg-info/` into the source tree during build.
    # Copy /app to a writable tmpfs path first, then install + run from there.
    command:
    - "cp -r /app /tmp/build && cd /tmp/build && pip install --target /tmp/site-packages . --quiet && PYTHONPATH=/tmp/site-packages python -m homelab_manager serve --host 0.0.0.0 --port 8765"
    volumes:
    - ../:/app:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
    - 127.0.0.1:${HOMELAB_MANAGER_PORT:-8765}:8765
    networks:
    - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.05'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  portainer_data: null
  whats_up_docker_data: null

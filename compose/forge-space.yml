# Forge Space Tools (MCP Gateway)
# Kept behind an explicit profile to avoid baseline resource pressure.

services:
  forge-mcp-gateway:
    image: ghcr.io/ibm/mcp-context-forge:1.0.0-BETA-2
    container_name: forge-mcp-gateway
    restart: unless-stopped
    profiles: ["forge-space"]
    command: ["./run-gunicorn.sh"]
    environment:
      HOST: 0.0.0.0
      PORT: 4444
      DATABASE_URL: sqlite:////data/mcp.db
      MCPGATEWAY_UI_ENABLED: ${FORGE_MCP_UI_ENABLED:-true}
      MCPGATEWAY_ADMIN_API_ENABLED: ${FORGE_MCP_ADMIN_API_ENABLED:-true}
      JWT_SECRET_KEY: ${FORGE_MCP_JWT_SECRET_KEY:?FORGE_MCP_JWT_SECRET_KEY is required}
      AUTH_ENCRYPTION_SECRET: ${FORGE_MCP_JWT_SECRET_KEY:?FORGE_MCP_JWT_SECRET_KEY is required}
      BASIC_AUTH_USER: ${FORGE_MCP_BASIC_AUTH_USER:-admin}
      BASIC_AUTH_PASSWORD: ${FORGE_MCP_BASIC_AUTH_PASSWORD:?FORGE_MCP_BASIC_AUTH_PASSWORD is required}
      PLATFORM_ADMIN_EMAIL: ${FORGE_MCP_ADMIN_EMAIL:-admin@example.com}
      PLATFORM_ADMIN_PASSWORD: ${FORGE_MCP_ADMIN_PASSWORD:?FORGE_MCP_ADMIN_PASSWORD is required}
      PLATFORM_ADMIN_FULL_NAME: ${FORGE_MCP_ADMIN_FULL_NAME:-Forge Platform Admin}
      AUTH_REQUIRED: ${FORGE_MCP_AUTH_REQUIRED:-true}
      SECURE_COOKIES: ${FORGE_MCP_SECURE_COOKIES:-false}
    volumes:
      - forge_mcp_gateway_data:/data
    ports:
      # Localhost for MCP clients on host
      - "127.0.0.1:${FORGE_MCP_GATEWAY_PORT:-4444}:4444"
      # Optional Tailscale access for remote admin
      - "${TAILSCALE_IP}:${FORGE_MCP_GATEWAY_PORT:-4444}:4444"
    networks:
      - default
      - frontend
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.35"
        reservations:
          memory: 128M
          cpus: "0.10"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 4444), 2); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  forge_mcp_gateway_data:

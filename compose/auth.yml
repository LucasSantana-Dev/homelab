# Authentication Middleware — Tinyauth
# Single-user OAuth gate for all public-facing services.
# Supports Google and GitHub OAuth via presets (no manual URL config needed).
#
# Prerequisites (fill in host .env before starting):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET   → Google Cloud Console → OAuth 2.0 Client IDs
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET   → github.com/settings/developers → OAuth Apps
#   TINYAUTH_ALLOWED_EMAILS                  → comma-separated list of allowed emails
#   Callback URLs must be registered in each OAuth app:
#     Google:  https://auth.<DOMAIN>/api/oauth/callback/google
#     GitHub:  https://auth.<DOMAIN>/api/oauth/callback/github

services:
  tinyauth:
    image: ${IMG_TINYAUTH:-ghcr.io/steveiliop56/tinyauth:v5.0.7}
    labels:
      - wud.watch=true
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
    container_name: tinyauth
    restart: unless-stopped
    volumes:
      - ../appdata/tinyauth:/data
    environment:
      # Tinyauth's own public URL — used to build OAuth callback redirects
      - TINYAUTH_APPURL=https://auth.${DOMAIN}
      # Allowed email addresses (exact match, comma-separated)
      - TINYAUTH_OAUTH_WHITELIST=${TINYAUTH_ALLOWED_EMAILS}
      # Secure cookies — true because Cloudflare delivers HTTPS to browsers
      - TINYAUTH_AUTH_SECURECOOKIE=true
      # Disable analytics
      - TINYAUTH_ANALYTICS_ENABLED=false
      # Google OAuth (preset: URLs and scopes auto-configured)
      - TINYAUTH_OAUTH_PROVIDERS_google_CLIENTID=${GOOGLE_CLIENT_ID}
      - TINYAUTH_OAUTH_PROVIDERS_google_CLIENTSECRET=${GOOGLE_CLIENT_SECRET}
      - TINYAUTH_OAUTH_PROVIDERS_google_REDIRECTURL=https://auth.${DOMAIN}/api/oauth/callback/google
      # GitHub OAuth (preset: URLs, read:user + user:email scopes auto-configured)
      - TINYAUTH_OAUTH_PROVIDERS_github_CLIENTID=${GITHUB_CLIENT_ID}
      - TINYAUTH_OAUTH_PROVIDERS_github_CLIENTSECRET=${GITHUB_CLIENT_SECRET}
      - TINYAUTH_OAUTH_PROVIDERS_github_REDIRECTURL=https://auth.${DOMAIN}/api/oauth/callback/github
      - TZ=${TIMEZONE}
    ports:
      # Bind only to localhost — caddy-lan (host network) reaches it at 127.0.0.1:3030
      - "127.0.0.1:3030:3000"
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
          cpus: "0.05"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

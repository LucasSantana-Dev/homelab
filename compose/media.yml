services:
  stremio:
    image: ${IMG_STREMIO:-stremio/server:v4.20.17}
    container_name: stremio-server
    restart: unless-stopped
    environment:
    - NO_CORS=1
    - INTERNAL_IP=0.0.0.0
    - STREMIO_SERVER_PORT=11470
    - STREMIO_SERVER_HOST=0.0.0.0
    - STREMIO_SERVER_URL=${STREMIO_PUBLIC_URL:-https://server-do-luk.tailab88e9.ts.net}
    volumes:
    - ../config/stremio:/root/.stremio-server
    - stremio_cache:/root/.stremio-server/stremio-cache
    ports:
    - ${BIND_IP:-0.0.0.0}:11470:11470
    networks:
    - default
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:11470/manifest.json
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  stremio_cache: null

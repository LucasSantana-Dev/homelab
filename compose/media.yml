services:
  stremio:
    image: ${IMG_STREMIO:-stremio/server:v4.21.0}
    container_name: stremio-server
    restart: unless-stopped
    environment:
    - NO_CORS=1
    - INTERNAL_IP=0.0.0.0
    - STREMIO_SERVER_PORT=11470
    - STREMIO_SERVER_HOST=0.0.0.0
    - STREMIO_SERVER_URL=${STREMIO_PUBLIC_URL:-https://server-do-luk.tailab88e9.ts.net}
    volumes:
    - ../config/stremio:/root/.stremio-server
    - stremio_cache:/root/.stremio-server/stremio-cache
    ports:
    - 127.0.0.1:11470:11470
    - ${TAILSCALE_IP}:11470:11470
    networks:
    - default
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      # stremio/server ships curl. The previous path /manifest.json returns 404
      # (no manifest at root) → "unhealthy". "/" returns 307 (server is up),
      # which curl --fail accepts (only HTTP >= 400 fails it).
      test:
      - CMD
      - curl
      - --fail
      - http://127.0.0.1:11470/
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  stremio_cache: null

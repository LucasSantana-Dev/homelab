services:
  homeassistant:
    image: ${IMG_HOMEASSISTANT:-ghcr.io/home-assistant/home-assistant:stable}
    container_name: homeassistant
    restart: unless-stopped
    # Home Assistant requires root for USB device access (Zigbee/Z-Wave dongles via /dev/tty*)
    # and the supervisor's /config/deps install step. Bridge-networked, not host-networked.
    user: root
    volumes:
    - ../config/homeassistant/config:/config
    - /etc/localtime:/etc/localtime:ro
    environment:
    - TZ=${TIMEZONE}
    - PYTHONUSERBASE=/config/deps
    ports:
    - ${BIND_IP:-0.0.0.0}:${HOMEASSISTANT_PORT:-8123}:8123
    networks:
    - default
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:8123/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

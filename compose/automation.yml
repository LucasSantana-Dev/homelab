services:
  homeassistant:
    # H4 hardening: was ':stable' (floating). Pinned to a monthly minor; override via IMG_HOMEASSISTANT.
    image: ${IMG_HOMEASSISTANT:-ghcr.io/home-assistant/home-assistant:2025.5}
    container_name: homeassistant
    restart: unless-stopped
    # Home Assistant requires root for USB device access (Zigbee/Z-Wave dongles via /dev/tty*)
    # and the supervisor's /config/deps install step. Bridge-networked, not host-networked.
    user: root
    volumes:
    - ../config/homeassistant/config:/config
    - /etc/localtime:/etc/localtime:ro
    environment:
    - TZ=${TIMEZONE}
    - PYTHONUSERBASE=/config/deps
    ports:
    - ${BIND_IP:-0.0.0.0}:${HOMEASSISTANT_PORT:-8123}:8123
    networks:
    - default
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:8123/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
    - "wud.tag.exclude=(?i)(windows|beta|alpha|nightly|dev|debug|dependabot|insider|^main-|^feature|^rc-|-rc$|ltsc|armv7|32bit|^[0-9a-f]{7,40}$)"

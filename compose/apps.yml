# Application Services
# n8n, Paperless-ngx, Nextcloud

services:
  # n8n Workflow Automation - Tailscale Only
  n8n:
    image: ${IMG_N8N:-n8nio/n8n:2.27.1}
    labels:
      - wud.watch=true
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
    container_name: n8n
    restart: unless-stopped
    # H2 hardening: dropped explicit user:root. Image's default 'node' user is UID 1000.
    # Server prerequisite: `sudo chown -R 1000:1000 ../appdata/n8n` before next deploy.
    user: "1000:1000"
    volumes:
      - ../appdata/n8n:/home/node/.n8n
    environment:
      # n8n v1.0+ uses built-in user management; N8N_BASIC_AUTH_* removed (silently ignored).
      # External route protected by Caddy + Tinyauth forward-auth.
      - WEBHOOK_URL=https://n8n.${DOMAIN}
      - TZ=${TIMEZONE}
      - PUID=1000
      - PGID=1000
      # Discord target for the ops-digest workflow (ADR-0025 Phase 2). Empty =
      # workflow inactive; see docs/runbooks/ops-alert-digest.md. (#266-style: set in .env)
      - OPS_DIGEST_DISCORD_WEBHOOK=${OPS_DIGEST_DISCORD_WEBHOOK:-}
      # Allow $env.* expressions in Code/HTTP nodes so the Discord node can read
      # OPS_DIGEST_DISCORD_WEBHOOK at runtime.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Disable external task runner (Python 3 absent in image; without this n8n
      # spawns a second process that pushes the 512M container over limit on startup)
      - N8N_RUNNERS_ENABLED=false
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 384M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nextcloud Database - MariaDB
  nextcloud-db:
    image: ${IMG_MARIADB:-mariadb:11.4.10}
    labels:
      - wud.watch=true
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
    container_name: nextcloud-db
    restart: unless-stopped
    volumes:
      - ../appdata/nextcloud/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - TZ=${TIMEZONE}
    networks:
      - default
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nextcloud Redis Cache
  nextcloud-redis:
    image: ${IMG_REDIS_ALPINE:-redis:7.4-alpine}
    labels:
      - wud.watch=true
      - 'wud.tag.include=^\d+\.\d+-alpine$$'
    container_name: nextcloud-redis
    restart: unless-stopped
    volumes:
      - ../appdata/nextcloud/redis:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nextcloud Cloud Storage - Tailscale Only
  nextcloud:
    image: ${IMG_NEXTCLOUD:-nextcloud:29-apache}
    labels:
      - wud.watch=true
      - 'wud.tag.include=^\d+-apache$$'
    container_name: nextcloud
    restart: unless-stopped
    volumes:
      - ../appdata/nextcloud/html:/var/www/html
      - ../appdata/nextcloud/data:/var/www/html/data
      - ../appdata/nextcloud/config:/var/www/html/config
      - ../appdata/nextcloud/apps:/var/www/html/custom_apps
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_TRUSTED_DOMAINS=cloud.${DOMAIN} ${TAILSCALE_IP}
      - TRUSTED_PROXIES=${TAILSCALE_IP}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=cloud.${DOMAIN}
      - TZ=${TIMEZONE}
    ports:
      # Public access is via caddy on loopback; intended direct access is Tailscale
      # only. Was 0.0.0.0 (exposed on every interface incl. LAN). (#202)
      - "127.0.0.1:8300:80"
      - "${TAILSCALE_IP}:8300:80"
    networks:
      - default
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Paperless PostgreSQL Database
  paperless-db:
    image: ${IMG_POSTGRES_15_ALPINE:-postgres:15.17-alpine}
    labels:
      - wud.watch=true
      - 'wud.tag.include=^\d+\.\d+-alpine$$'
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - ../appdata/paperless/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=${PAPERLESS_DB_PASSWORD}
      - TZ=${TIMEZONE}
      # postgres:18+ images default to a major-version-specific data subdir under
      # /var/lib/postgresql; pin the flat path so the existing bind mount keeps working.
      - PGDATA=/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d paperless -U paperless"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Paperless Redis Broker
  paperless-redis:
    image: ${IMG_REDIS_ALPINE:-redis:7.4-alpine}
    labels:
      - wud.watch=true
      - 'wud.tag.include=^\d+\.\d+-alpine$$'
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - ../appdata/paperless/redis:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - database
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Paperless-ngx Document Management
  paperless-ngx:
    build:
      context: ../dockerfiles/paperless-ngx
      dockerfile: Dockerfile
      args:
        # H4 hardening: was ':latest' (floating). Pinned to known recent semver.
        PAPERLESS_BASE_IMAGE: ${IMG_PAPERLESS_BASE:-ghcr.io/paperless-ngx/paperless-ngx:2.13}
    image: paperless-ngx:custom
    container_name: paperless-ngx
    restart: unless-stopped
    volumes:
      - ../appdata/paperless/data:/usr/src/paperless/data
      - ../appdata/paperless/media:/usr/src/paperless/media
      - ../appdata/paperless/export:/usr/src/paperless/export
      - ../appdata/paperless/consume:/usr/src/paperless/consume
    environment:
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - PAPERLESS_DBHOST=paperless-db
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASSWORD}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_URL=https://docs.${DOMAIN}
      - PAPERLESS_ADMIN_USER=admin
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      - PAPERLESS_ADMIN_MAIL=admin@${DOMAIN}
      - PAPERLESS_OCR_LANGUAGE=eng+por
      - PAPERLESS_TIME_ZONE=${TIMEZONE}
      - PAPERLESS_ENABLE_HTTP_REMOTE_USER=false
      - PAPERLESS_TRUSTED_PROXIES=${TAILSCALE_IP}
      - PAPERLESS_CORS_ALLOWED_HOSTS=https://docs.${DOMAIN}
      - USERMAP_UID=${PUID}
      - USERMAP_GID=${PGID}
    ports:
      - "${BIND_IP:-0.0.0.0}:8400:8000"
    networks:
      - frontend
      - database
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

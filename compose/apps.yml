# Application Services
# n8n, Nextcloud

services:
  # n8n Workflow Automation - Tailscale Only
  n8n:
    image: ${IMG_N8N:-n8nio/n8n:2.27.1}
    labels:
      - wud.watch=true
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
    container_name: n8n
    restart: unless-stopped
    # H2 hardening: dropped explicit user:root. Image's default 'node' user is UID 1000.
    # Server prerequisite: `sudo chown -R 1000:1000 ../appdata/n8n` before next deploy.
    user: "1000:1000"
    volumes:
      - ../appdata/n8n:/home/node/.n8n
    environment:
      # n8n v1.0+ uses built-in user management; N8N_BASIC_AUTH_* removed (silently ignored).
      # External route protected by Caddy + Tinyauth forward-auth.
      - WEBHOOK_URL=https://n8n.${DOMAIN}
      - TZ=${TIMEZONE}
      - PUID=1000
      - PGID=1000
      # Discord target for the ops-digest workflow (ADR-0025 Phase 2). Empty =
      # workflow inactive; see docs/runbooks/ops-alert-digest.md. (#266-style: set in .env)
      - OPS_DIGEST_DISCORD_WEBHOOK=${OPS_DIGEST_DISCORD_WEBHOOK:-}
      # Shared secret the ops-digest HermesClassify node sends to agent-box
      # POST /wud-classify (X-Classify-Token). Same value as WUD_CLASSIFY_TOKEN in
      # secrets/agent-box.secrets.yaml.age; agent-box refuses the call without it.
      - WUD_CLASSIFY_TOKEN=${WUD_CLASSIFY_TOKEN:-}
      # Allow $env.* expressions in Code/HTTP nodes so the workflow can read
      # OPS_DIGEST_DISCORD_WEBHOOK and WUD_CLASSIFY_TOKEN at runtime.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Disable external task runner (Python 3 absent in image; without this n8n
      # spawns a second process that pushes the 512M container over limit on startup)
      - N8N_RUNNERS_ENABLED=false
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 384M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nextcloud Database - MariaDB
  nextcloud-db:
    image: ${IMG_MARIADB:-mariadb:11.4.10}
    labels:
      - wud.watch=true
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
    container_name: nextcloud-db
    restart: unless-stopped
    volumes:
      - ../appdata/nextcloud/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - TZ=${TIMEZONE}
    networks:
      - default
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nextcloud Redis Cache
  nextcloud-redis:
    image: ${IMG_REDIS_ALPINE:-redis:7.4-alpine}
    labels:
      - wud.watch=true
      - 'wud.tag.include=^\d+\.\d+-alpine$$'
    container_name: nextcloud-redis
    restart: unless-stopped
    volumes:
      - ../appdata/nextcloud/redis:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nextcloud Cloud Storage - Tailscale Only
  nextcloud:
    image: ${IMG_NEXTCLOUD:-nextcloud:29-apache}
    labels:
      - wud.watch=true
      - 'wud.tag.include=^\d+-apache$$'
    container_name: nextcloud
    restart: unless-stopped
    volumes:
      - ../appdata/nextcloud/html:/var/www/html
      - ../appdata/nextcloud/data:/var/www/html/data
      - ../appdata/nextcloud/config:/var/www/html/config
      - ../appdata/nextcloud/apps:/var/www/html/custom_apps
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_TRUSTED_DOMAINS=cloud.${DOMAIN} ${TAILSCALE_IP}
      - TRUSTED_PROXIES=${TAILSCALE_IP}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=cloud.${DOMAIN}
      - TZ=${TIMEZONE}
    ports:
      # Public access is via caddy on loopback; intended direct access is Tailscale
      # only. Was 0.0.0.0 (exposed on every interface incl. LAN). (#202)
      - "127.0.0.1:8300:80"
      - "${TAILSCALE_IP}:8300:80"
    networks:
      - default
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Cloudflare Tunnel Configuration for Homelab
tunnel: ${CF_TUNNEL_ID}
credentials-file: /etc/cloudflared/${CF_TUNNEL_ID}.json
origincert: /etc/cloudflared/cert.pem

ingress:
  # Main domain - Homepage Dashboard
  - hostname: ${DOMAIN}
    service: http://homepage:3000

  # www redirect
  - hostname: www.${DOMAIN}
    service: http://homepage:3000

  # Home Assistant
  - hostname: homeassistant.${DOMAIN}
    service: http://homeassistant:8123

  # Portainer
  - hostname: portainer.${DOMAIN}
    service: http://portainer:9000

  # Pi-hole
  - hostname: pihole.${DOMAIN}
    service: http://pihole:80

  # Stremio
  - hostname: stremio.${DOMAIN}
    service: http://stremio-server:11470

  # Monitoring Stack
  - hostname: grafana.${DOMAIN}
    service: http://grafana:3000

  - hostname: prometheus.${DOMAIN}
    service: http://prometheus:9090

  - hostname: uptime.${DOMAIN}
    service: http://localhost:3001

  - hostname: docker.${DOMAIN}
    service: http://whats-up-docker:3003

  # Catch-all rule
  - service: http_status:404

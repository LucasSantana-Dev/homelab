services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - ./config/nginx/auth:/etc/nginx/auth:ro
    ports:
      # Bind only to Tailscale IP for secure access (domain accessible via Tailscale only)
      - "${TAILSCALE_IP}:80:80"
      - "${TAILSCALE_IP}:443:443"
      # Localhost for health checks
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    networks:
      - default
    depends_on:
      - homepage
      - homeassistant
      - stremio
      - uptime-kuma
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Homepage Dashboard - Tailscale Only
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - HOMEPAGE_ALLOWED_HOSTS=homelab.example.com,www.homelab.example.com,localhost,127.0.0.1
      - HOMEASSISTANT_KEY=${HOMEASSISTANT_KEY}
      - DOMAIN=${DOMAIN}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${HOMEPAGE_PORT:-3000}:3000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Home Assistant - Tailscale Only
  homeassistant:
    image: "ghcr.io/home-assistant/home-assistant:stable"
    container_name: homeassistant
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - ./config/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TIMEZONE}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${HOMEASSISTANT_PORT:-8123}:8123"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Stremio - Public Access Required for app.strem.io
  stremio:
    image: stremio/server:latest
    container_name: stremio-server
    restart: unless-stopped
    environment:
      - NO_CORS=1
      - INTERNAL_IP=0.0.0.0
      - STREMIO_SERVER_PORT=11470
      - STREMIO_SERVER_HOST=0.0.0.0
      - STREMIO_SERVER_URL=https://stremio.homelab.example.com
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - ./config/stremio:/root/.stremio-server
      - stremio_cache:/root/.stremio-server/stremio-cache
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:11470:11470"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Uptime Kuma - Tailscale Only
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - uptime_kuma_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TIMEZONE}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${UPTIME_KUMA_PORT:-3001}:3001"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Portainer - TAILSCALE ONLY (Sensitive Service)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${PORTAINER_PORT:-9000}:9000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana - TAILSCALE ONLY (Sensitive Service)
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=grafana.${DOMAIN}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${GRAFANA_PORT:-3002}:3000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus - TAILSCALE ONLY (Sensitive Service)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      # Localhost access
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
      # Tailscale access ONLY
      - "${TAILSCALE_IP}:${PROMETHEUS_PORT:-9091}:9090"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # What's Up Docker - TAILSCALE ONLY (Sensitive Service)
  whats-up-docker:
    image: fmartinou/whats-up-docker:latest
    container_name: whats-up-docker
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - whats_up_docker_data:/app/data
    environment:
      - WUD_UPDATER_DOCKER_HUB_TOKEN=${DOCKER_HUB_TOKEN:-}
      - WUD_UPDATER_GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WUD_DISCORD_WEBHOOK_URL=${WUD_DISCORD_WEBHOOK_URL}
      - WUD_SMTP_HOST=${WUD_SMTP_HOST}
      - WUD_SMTP_PORT=${WUD_SMTP_PORT}
      - WUD_SMTP_USER=${WUD_SMTP_USER}
      - WUD_SMTP_PASS=${WUD_SMTP_PASS}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${WUD_PORT:-3003}:3000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Pi-hole - LOCALHOST ONLY (Local Network Service)
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - ./config/pihole/etc:/etc/pihole
      - ./config/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
      - pihole_data:/etc/pihole
    environment:
      - TZ=${TIMEZONE}
      - WEBPASSWORD=${PIHOLE_WEB_PASSWORD}
      - PIHOLE_DNS_=8.8.8.8;1.1.1.1
      - VIRTUAL_HOST=pihole.${DOMAIN}
      - VIRTUAL_PORT=80
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${PIHOLE_WEB_PORT:-8054}:80"
      - "127.0.0.1:${PIHOLE_DNS_PORT:-53}:53/tcp"
      - "127.0.0.1:${PIHOLE_DNS_PORT:-53}:53/udp"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FileBrowser - NAS-like File Manager
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - filebrowser_data:/database
      - /home/luk-server:/srv/home
      - /home/luk-server/media:/srv/media
      - /home/luk-server/homelab:/srv/homelab
    environment:
      - TZ=${TIMEZONE}
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/srv
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${FILEBROWSER_PORT:-8080}:80"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Node Exporter - LOCALHOST ONLY (System Metrics)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      # Localhost access ONLY
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # cAdvisor - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Netdata - Real-time System Monitoring
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN:-}
    ports:
      - "${TAILSCALE_IP}:19999:19999"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Proxy Manager - Real admin dashboard
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      # Admin interface on port 81, proxy on different ports
      - "0.0.0.0:81:81"
      - "0.0.0.0:8081:80"
      - "0.0.0.0:8444:443"
    volumes:
      - nginx_proxy_manager_data:/data
      - nginx_proxy_manager_letsencrypt:/etc/letsencrypt
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Certbot for SSL certificates (keep for backup)
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./config/nginx/ssl:/etc/letsencrypt
      - ./config/nginx/www/certbot:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email admin@homelab.example.com --agree-tos --no-eff-email -d homelab.example.com -d www.homelab.example.com -d homeassistant.homelab.example.com -d stremio.homelab.example.com -d uptime.homelab.example.com -d portainer.homelab.example.com -d grafana.homelab.example.com -d files.homelab.example.com -d pihole.homelab.example.com -d docker.homelab.example.com -d prometheus.homelab.example.com -d netdata.homelab.example.com -d cadvisor.homelab.example.com
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  portainer_data:
  grafana_data:
  prometheus_data:
  uptime_kuma_data:
  whats_up_docker_data:
  pihole_data:
  stremio_cache:
  filebrowser_data:
  nginx_proxy_manager_data:
  nginx_proxy_manager_letsencrypt:
  netdataconfig:
  netdatalib:
  netdatacache:

networks:
  default:
    driver: bridge
  tailscale:
    driver: bridge

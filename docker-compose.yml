services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - ./config/nginx/auth:/etc/nginx/auth:ro
    ports:
      # Bind only to Tailscale IP for secure access (domain accessible via Tailscale only)
      - "${TAILSCALE_IP}:80:80"
      - "${TAILSCALE_IP}:443:443"
      # Localhost for health checks
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    networks:
      - default
    depends_on:
      - homepage
      - homeassistant
      - stremio
      - uptime-kuma
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Homepage Dashboard - Tailscale Only
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - HOMEPAGE_ALLOWED_HOSTS=homelab.example.com,www.homelab.example.com,localhost,127.0.0.1
      - HOMEASSISTANT_KEY=${HOMEASSISTANT_KEY}
      - DOMAIN=${DOMAIN}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${HOMEPAGE_PORT:-3000}:3000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Home Assistant - Tailscale Only
  homeassistant:
    image: "ghcr.io/home-assistant/home-assistant:stable"
    container_name: homeassistant
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - ./config/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TIMEZONE}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${HOMEASSISTANT_PORT:-8123}:8123"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Stremio - Public Access Required for app.strem.io
  stremio:
    image: stremio/server:latest
    container_name: stremio-server
    restart: unless-stopped
    environment:
      - NO_CORS=1
      - INTERNAL_IP=0.0.0.0
      - STREMIO_SERVER_PORT=11470
      - STREMIO_SERVER_HOST=0.0.0.0
      - STREMIO_SERVER_URL=https://stremio.homelab.example.com
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - ./config/stremio:/root/.stremio-server
      - stremio_cache:/root/.stremio-server/stremio-cache
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:11470:11470"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Uptime Kuma - Tailscale Only
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - uptime_kuma_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TIMEZONE}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${UPTIME_KUMA_PORT:-3001}:3001"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Portainer - TAILSCALE ONLY (Sensitive Service)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${PORTAINER_PORT:-9000}:9000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana - TAILSCALE ONLY (Sensitive Service)
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=grafana.${DOMAIN}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${GRAFANA_PORT:-3002}:3000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Alertmanager - Alert routing and notifications - TAILSCALE ONLY
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./config/alertmanager:/etc/alertmanager
      - ./appdata/alertmanager:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "127.0.0.1:9093:9093"
      - "${TAILSCALE_IP}:9093:9093"
    networks:
      - default
    environment:
      - ALERTMANAGER_DISCORD_WEBHOOK=${ALERTMANAGER_DISCORD_WEBHOOK}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Blackbox Exporter - HTTP/TCP endpoint monitoring - Localhost only
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./config/blackbox:/etc/blackbox_exporter
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    ports:
      - "127.0.0.1:9115:9115"
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus - TAILSCALE ONLY (Sensitive Service)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      # Localhost access
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
      # Tailscale access ONLY
      - "${TAILSCALE_IP}:${PROMETHEUS_PORT:-9091}:9090"
    networks:
      - default
    depends_on:
      - alertmanager
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # What's Up Docker - TAILSCALE ONLY (Sensitive Service)
  whats-up-docker:
    image: fmartinou/whats-up-docker:latest
    container_name: whats-up-docker
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - whats_up_docker_data:/app/data
    environment:
      - WUD_UPDATER_DOCKER_HUB_TOKEN=${DOCKER_HUB_TOKEN:-}
      - WUD_UPDATER_GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WUD_DISCORD_WEBHOOK_URL=${WUD_DISCORD_WEBHOOK_URL}
      - WUD_SMTP_HOST=${WUD_SMTP_HOST}
      - WUD_SMTP_PORT=${WUD_SMTP_PORT}
      - WUD_SMTP_USER=${WUD_SMTP_USER}
      - WUD_SMTP_PASS=${WUD_SMTP_PASS}
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${WUD_PORT:-3003}:3000"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Pi-hole - LOCALHOST ONLY (Local Network Service)
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - ./config/pihole/etc:/etc/pihole
      - ./config/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
      - pihole_data:/etc/pihole
    environment:
      - TZ=${TIMEZONE}
      - WEBPASSWORD=${PIHOLE_WEB_PASSWORD}
      - PIHOLE_DNS_=8.8.8.8;1.1.1.1
      - VIRTUAL_HOST=pihole.${DOMAIN}
      - VIRTUAL_PORT=80
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${PIHOLE_WEB_PORT:-8054}:80"
      - "127.0.0.1:${PIHOLE_DNS_PORT:-53}:53/tcp"
      - "127.0.0.1:${PIHOLE_DNS_PORT:-53}:53/udp"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FileBrowser - NAS-like File Manager
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - filebrowser_data:/database
      - /home/luk-server:/srv/home
      - /home/luk-server/media:/srv/media
      - /home/luk-server/homelab:/srv/homelab
    environment:
      - TZ=${TIMEZONE}
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/srv
    ports:
      # Bind only to Tailscale IP for secure access
      - "${TAILSCALE_IP}:${FILEBROWSER_PORT:-8080}:80"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Node Exporter - LOCALHOST ONLY (System Metrics)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - ./config/nginx/www/certbot:/var/www/certbot:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      # Localhost access ONLY
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # cAdvisor - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Netdata - Real-time System Monitoring
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN:-}
    ports:
      - "${TAILSCALE_IP}:19999:19999"
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Vaultwarden Password Manager - Tailscale Only
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - ./appdata/vaultwarden:/data
    environment:
      - DOMAIN=https://vault.${DOMAIN}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=false
      - WEBSOCKET_ENABLED=true
      - TZ=${TIMEZONE}
    ports:
      - "${TAILSCALE_IP}:8200:80"
      - "${TAILSCALE_IP}:3012:3012"  # WebSocket port
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Jellyfin Media Server - Tailscale Only
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    volumes:
      - ./appdata/jellyfin/config:/config
      - ./appdata/jellyfin/cache:/cache
      - ./media:/media:ro  # Read-only media directory
    environment:
      - TZ=${TIMEZONE}
    ports:
      - "${TAILSCALE_IP}:8096:8096"
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # n8n Workflow Automation - Tailscale Only
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    user: "root"  # Run as root to avoid permission issues with volume
    volumes:
      - ./appdata/n8n:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - WEBHOOK_URL=https://n8n.${DOMAIN}
      - TZ=${TIMEZONE}
      - PUID=1000
      - PGID=1000
    ports:
      - "${TAILSCALE_IP}:5678:5678"
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Loki Log Aggregation - Localhost + Tailscale
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    volumes:
      - ./appdata/loki:/loki
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
      - "${TAILSCALE_IP}:3100:3100"
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.2'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Promtail Log Collection
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - default
    depends_on:
      - loki
    # Promtail doesn't expose a health endpoint, monitoring via logs only
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nextcloud Database - MariaDB
  nextcloud-db:
    image: mariadb:latest
    container_name: nextcloud-db
    restart: unless-stopped
    volumes:
      - ./appdata/nextcloud/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - TZ=${TIMEZONE}
    networks:
      - default
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nextcloud Redis Cache
  nextcloud-redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    volumes:
      - ./appdata/nextcloud/redis:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nextcloud Cloud Storage - Tailscale Only
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    volumes:
      - ./appdata/nextcloud/html:/var/www/html
      - ./appdata/nextcloud/data:/var/www/html/data
      - ./appdata/nextcloud/config:/var/www/html/config
      - ./appdata/nextcloud/apps:/var/www/html/custom_apps
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_TRUSTED_DOMAINS=cloud.${DOMAIN} ${TAILSCALE_IP}
      - TRUSTED_PROXIES=${TAILSCALE_IP}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=cloud.${DOMAIN}
      - TZ=${TIMEZONE}
    ports:
      - "${TAILSCALE_IP}:8300:80"
    networks:
      - default
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  portainer_data:
  grafana_data:
  prometheus_data:
  uptime_kuma_data:
  whats_up_docker_data:
  pihole_data:
  stremio_cache:
  filebrowser_data:
  netdataconfig:
  netdatalib:
  netdatacache:

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend:
    driver: bridge
    internal: true  # No internet access
    ipam:
      config:
        - subnet: 172.21.0.0/24
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  database:
    driver: bridge
    internal: true  # No internet access
    ipam:
      config:
        - subnet: 172.23.0.0/24

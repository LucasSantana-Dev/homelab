image:
  repository: jellyfin/jellyfin
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8096

ingress:
  enabled: true
  className: traefik
  host: jellyfin.k3s.local

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

persistence:
  config:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  cache:
    enabled: true
    storageClassName: local-path
    size: 10Gi

env:
  TZ: "America/Sao_Paulo"

# Media path on the host node
mediaHostPath: /home/luk-server/homelab/media

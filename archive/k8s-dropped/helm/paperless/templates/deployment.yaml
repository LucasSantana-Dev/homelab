apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paperless.postgresql.fullname" . }}
  namespace: apps
  labels:
    app.kubernetes.io/name: paperless-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.paperless.env.PAPERLESS_DBNAME | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.paperless.env.PAPERLESS_DBUSER | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_DBPASS
          resources:
{{ toYaml .Values.postgresql.resources | indent 12 }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.paperless.env.PAPERLESS_DBUSER | quote }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.paperless.env.PAPERLESS_DBUSER | quote }}
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: {{ include "paperless.postgresql.fullname" . }}-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paperless.redis.fullname" . }}
  namespace: apps
  labels:
    app.kubernetes.io/name: paperless-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
          resources:
{{ toYaml .Values.redis.resources | indent 12 }}
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paperless.fullname" . }}
  namespace: apps
  labels:
    app.kubernetes.io/name: paperless
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: wait-for-postgresql
          image: busybox
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "paperless.postgresql.fullname" . }} 5432; do
                echo "Waiting for PostgreSQL..."; sleep 2
              done
        - name: wait-for-redis
          image: busybox
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "paperless.redis.fullname" . }} 6379; do
                echo "Waiting for Redis..."; sleep 2
              done
      containers:
        - name: paperless
          image: "{{ .Values.paperless.image.repository }}:{{ .Values.paperless.image.tag }}"
          imagePullPolicy: {{ .Values.paperless.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PAPERLESS_DBHOST
              value: {{ include "paperless.postgresql.fullname" . | quote }}
            - name: PAPERLESS_REDIS
              value: "redis://{{ include "paperless.redis.fullname" . }}:6379"
            - name: PAPERLESS_DBNAME
              value: {{ .Values.paperless.env.PAPERLESS_DBNAME | quote }}
            - name: PAPERLESS_DBUSER
              value: {{ .Values.paperless.env.PAPERLESS_DBUSER | quote }}
            - name: PAPERLESS_TIME_ZONE
              value: {{ .Values.paperless.env.PAPERLESS_TIME_ZONE | quote }}
            - name: PAPERLESS_OCR_LANGUAGE
              value: {{ .Values.paperless.env.PAPERLESS_OCR_LANGUAGE | quote }}
            - name: PAPERLESS_URL
              value: {{ .Values.paperless.env.PAPERLESS_URL | quote }}
            - name: PAPERLESS_ADMIN_USER
              value: {{ .Values.paperless.env.PAPERLESS_ADMIN_USER | quote }}
            - name: PAPERLESS_ADMIN_MAIL
              value: {{ .Values.paperless.env.PAPERLESS_ADMIN_MAIL | quote }}
            - name: USERMAP_UID
              value: {{ .Values.paperless.env.USERMAP_UID | quote }}
            - name: USERMAP_GID
              value: {{ .Values.paperless.env.USERMAP_GID | quote }}
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_DBPASS
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_SECRET_KEY
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_ADMIN_PASSWORD
          resources:
{{ toYaml .Values.paperless.resources | indent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
            - name: export
              mountPath: /usr/src/paperless/export
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "paperless.fullname" . }}-data
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "paperless.fullname" . }}-media
        - name: consume
          persistentVolumeClaim:
            claimName: {{ include "paperless.fullname" . }}-consume
        - name: export
          persistentVolumeClaim:
            claimName: {{ include "paperless.fullname" . }}-export

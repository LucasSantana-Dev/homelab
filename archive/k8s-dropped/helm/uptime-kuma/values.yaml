image:
  repository: louislam/uptime-kuma
  tag: "1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: true
  className: traefik
  host: uptime.k3s.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi
  # Restore from existing volume or leave empty for fresh start
  existingClaim: ""

# Import existing data from Docker volume path
hostDataPath: ""

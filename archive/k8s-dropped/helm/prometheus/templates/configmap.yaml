apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.fullname" . }}-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - 'alertmanager-alertmanager:9093'

    rule_files:
      - "alerts.yml"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']
        scrape_interval: 15s
        metrics_path: /metrics

      - job_name: 'cadvisor'
        static_configs:
          - targets: ['cadvisor:8080']
        scrape_interval: 15s
        metrics_path: /metrics

      - job_name: 'loki'
        static_configs:
          - targets: ['loki-loki:3100']
        scrape_interval: 15s
        metrics_path: /metrics

      - job_name: 'alertmanager'
        static_configs:
          - targets: ['alertmanager-alertmanager:9093']
        scrape_interval: 15s
        metrics_path: /metrics

      - job_name: 'blackbox'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - https://grafana.luk-homeserver.com.br
              - https://vault.luk-homeserver.com.br
              - https://n8n.luk-homeserver.com.br
              - https://uptime.luk-homeserver.com.br
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter-blackbox-exporter:9115

  alerts.yml: |
    groups:
      - name: homelab_alerts
        interval: 30s
        rules:
          - alert: ServiceDown
            expr: probe_success == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Service {{ "{{" }} $labels.instance {{ "}}" }} is down"
              description: "Service {{ "{{" }} $labels.instance {{ "}}" }} is not responding to health checks."
          - alert: HighMemoryPressure
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory pressure on {{ "{{" }} $labels.instance {{ "}}" }}"
              description: "Memory usage on {{ "{{" }} $labels.instance {{ "}}" }} is above 90%."
          - alert: LowDiskSpace
            expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Low disk space on {{ "{{" }} $labels.instance {{ "}}" }}"
              description: "Disk space is below 20% on {{ "{{" }} $labels.instance {{ "}}" }} ({{ "{{" }} $labels.mountpoint {{ "}}" }})."
          - alert: HighSwapUsage
            expr: node_memory_SwapTotal_bytes > 0 and (1 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes)) > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High swap usage on {{ "{{" }} $labels.instance {{ "}}" }}"
              description: "Swap usage is above 80% on {{ "{{" }} $labels.instance {{ "}}" }}."
          - alert: PrometheusDown
            expr: up{job="prometheus"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Prometheus is down"
              description: "Prometheus monitoring system is not responding."

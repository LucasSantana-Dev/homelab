apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nextcloud.fullname" . }}-html
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.nextcloud.persistence.html.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.nextcloud.persistence.html.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nextcloud.fullname" . }}-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.nextcloud.persistence.data.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.nextcloud.persistence.data.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nextcloud.mariadb.fullname" . }}-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.mariadb.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.mariadb.persistence.size }}

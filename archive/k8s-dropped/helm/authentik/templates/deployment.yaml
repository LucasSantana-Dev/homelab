apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authentik.postgresql.fullname" . }}
  namespace: apps
  labels:
    app.kubernetes.io/name: authentik-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.authentik.env.AUTHENTIK_POSTGRESQL__NAME | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.authentik.env.AUTHENTIK_POSTGRESQL__USER | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: AUTHENTIK_POSTGRESQL__PASSWORD
          resources:
{{ toYaml .Values.postgresql.resources | indent 12 }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.authentik.env.AUTHENTIK_POSTGRESQL__USER | quote }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.authentik.env.AUTHENTIK_POSTGRESQL__USER | quote }}
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: {{ include "authentik.postgresql.fullname" . }}-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authentik.redis.fullname" . }}
  namespace: apps
  labels:
    app.kubernetes.io/name: authentik-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
          command:
            - redis-server
            - --save
            - "60"
            - "1"
            - --loglevel
            - warning
          resources:
{{ toYaml .Values.redis.resources | indent 12 }}
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authentik.fullname" . }}-server
  namespace: apps
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsUser: 1000
      initContainers:
        - name: wait-for-postgresql
          image: busybox
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "authentik.postgresql.fullname" . }} 5432; do
                echo "Waiting for PostgreSQL..."; sleep 2
              done
        - name: wait-for-redis
          image: busybox
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "authentik.redis.fullname" . }} 6379; do
                echo "Waiting for Redis..."; sleep 2
              done
      containers:
        - name: authentik-server
          image: "{{ .Values.authentik.image.repository }}:{{ .Values.authentik.image.tag }}"
          imagePullPolicy: {{ .Values.authentik.image.pullPolicy }}
          args:
            - server
          ports:
            - name: http
              containerPort: 9000
            - name: https
              containerPort: 9443
          env:
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: {{ include "authentik.postgresql.fullname" . | quote }}
            - name: AUTHENTIK_REDIS__HOST
              value: {{ include "authentik.redis.fullname" . | quote }}
            - name: AUTHENTIK_POSTGRESQL__USER
              value: {{ .Values.authentik.env.AUTHENTIK_POSTGRESQL__USER | quote }}
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: {{ .Values.authentik.env.AUTHENTIK_POSTGRESQL__NAME | quote }}
            - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
              value: {{ .Values.authentik.env.AUTHENTIK_DISABLE_STARTUP_ANALYTICS | quote }}
            - name: AUTHENTIK_ERROR_REPORTING__ENABLED
              value: {{ .Values.authentik.env.AUTHENTIK_ERROR_REPORTING__ENABLED | quote }}
            - name: AUTHENTIK_AVATARS
              value: {{ .Values.authentik.env.AUTHENTIK_AVATARS | quote }}
            - name: TZ
              value: {{ .Values.authentik.env.TZ | quote }}
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: AUTHENTIK_POSTGRESQL__PASSWORD
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: AUTHENTIK_SECRET_KEY
          resources:
{{ toYaml .Values.authentik.resources | indent 12 }}
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: media
              mountPath: /media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "authentik.fullname" . }}-media
---

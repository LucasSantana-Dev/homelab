image:
  repository: grafana/grafana-oss
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: traefik
  host: grafana.k3s.local

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi

env:
  GF_SECURITY_ADMIN_USER: admin
  GF_SERVER_ROOT_URL: "https://grafana.luk-homeserver.com.br"
  GF_SERVER_DOMAIN: "grafana.luk-homeserver.com.br"
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "hQIr0WpGPxExb0CMXnuQpCr9coakxF7l"
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.luk-homeserver.com.br/application/o/authorize/"
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.luk-homeserver.com.br/application/o/token/"
  GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.luk-homeserver.com.br/application/o/userinfo/"
  GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"

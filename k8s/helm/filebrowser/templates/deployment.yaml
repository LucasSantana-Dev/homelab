apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filebrowser.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "filebrowser.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "filebrowser.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "filebrowser.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: filebrowser
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--root={{ .Values.config.rootPath }}"
            - "--database={{ .Values.config.databasePath }}"
          ports:
            - name: http
              containerPort: 80
          resources:
{{ toYaml .Values.resources | indent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
{{- if .Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.envFromSecret }}
{{- end }}
          volumeMounts:
            - name: database
              mountPath: /database
            - name: srv-home
              mountPath: /srv/home
              readOnly: false
            - name: srv-media
              mountPath: /srv/media
              readOnly: false
      volumes:
        - name: database
{{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "filebrowser.fullname" . }}-db
{{- else }}
          emptyDir: {}
{{- end }}
        - name: srv-home
          hostPath:
            path: {{ .Values.hostPaths.home }}
            type: Directory
        - name: srv-media
          hostPath:
            path: {{ .Values.hostPaths.media }}
            type: Directory

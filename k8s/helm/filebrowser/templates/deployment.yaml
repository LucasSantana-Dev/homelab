apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filebrowser.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "filebrowser.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "filebrowser.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: filebrowser
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--root={{ .Values.config.rootPath }}"
            - "--database={{ .Values.config.databasePath }}"
          ports:
            - name: http
              containerPort: 80
          resources:
{{ toYaml .Values.resources | indent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
{{- if .Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.envFromSecret }}
{{- end }}
          volumeMounts:
            - name: data
              mountPath: /srv
            - name: database
              mountPath: /database
      volumes:
        - name: data
{{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "filebrowser.fullname" . }}
{{- else }}
          emptyDir: {}
{{- end }}
        - name: database
{{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "filebrowser.fullname" . }}
{{- else }}
          emptyDir: {}
{{- end }}

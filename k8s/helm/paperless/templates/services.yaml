apiVersion: v1
kind: Service
metadata:
  name: {{ include "paperless.fullname" . }}
  namespace: apps
  labels:
    app.kubernetes.io/name: paperless
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.paperless.service.type }}
  ports:
    - port: {{ .Values.paperless.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: paperless
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "paperless.postgresql.fullname" . }}
  namespace: apps
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: pg
      protocol: TCP
      name: pg
  selector:
    app.kubernetes.io/name: paperless-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "paperless.redis.fullname" . }}
  namespace: apps
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: paperless-redis
    app.kubernetes.io/instance: {{ .Release.Name }}

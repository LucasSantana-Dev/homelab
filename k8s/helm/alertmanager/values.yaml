image:
  repository: prom/alertmanager
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9093

ingress:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

persistence:
  enabled: true
  storageClassName: local-path
  size: 1Gi

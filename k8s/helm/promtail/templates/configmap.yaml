apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "promtail.fullname" . }}-config
  namespace: observability
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki-loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: docker
        static_configs:
          - targets:
              - localhost
            labels:
              job: docker_logs
              __path__: /var/lib/docker/containers/*/*.log
        pipeline_stages:
          - json:
              expressions:
                output: log
                stream: stream
                attrs:
                time: time
          - json:
              expressions:
                tag:
              source: attrs
          - regex:
              expression: (?P<container_name>(?:[^|]*[^|]))
              source: tag
          - regex:
              expression: '.*(?P<level>ERROR|WARN|INFO|DEBUG|FATAL|CRITICAL).*'
              source: output
          - timestamp:
              format: RFC3339Nano
              source: time
          - labels:
              container_name:
              stream:
              level:
          - output:
              source: output
          - drop:
              expression: '.*healthcheck.*'
              drop_counter_reason: healthcheck_logs

      - job_name: system
        static_configs:
          - targets:
              - localhost
            labels:
              job: syslog
              __path__: /var/log/syslog
        pipeline_stages:
          - regex:
              expression: '^(?P<timestamp>\S+\s+\d+\s+\S+)\s+(?P<host>\S+)\s+(?P<app>\S+)(?::|\[(?P<pid>\d+)\])?:\s+(?P<message>.*)$'
          - timestamp:
              source: timestamp
              format: "Jan _2 15:04:05"
          - labels:
              host:
              app:
          - output:
              source: message

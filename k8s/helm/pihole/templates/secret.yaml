apiVersion: v1
kind: Secret
metadata:
  name: pihole-auth
  namespace: apps
  labels:
    app.kubernetes.io/name: {{ include "pihole.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  WEBPASSWORD: {{ required "auth.webPassword is required" .Values.auth.webPassword | quote }}

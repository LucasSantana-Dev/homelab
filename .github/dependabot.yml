version: 2
# Continuous dependency audits. /dep-sweep composite batches the safe bumps
# onto the release branch; risky ones (always_hold list in
# .claude/dep-sweep-config.json once that's tracked, or ~/.claude/ defaults
# until then) surface for review.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "release"
    open-pull-requests-limit: 5
    reviewers:
      - "LucasSantana-Dev"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  # H3 hardening: was 'docker' at '/' which only scans Dockerfiles at repo
  # root (none here). Switched to 'docker-compose' ecosystem pointed at the
  # compose/ directory so floating tags like home-assistant:stable, netdata
  # :stable, paperless-ngx:latest now get auto-PR'd. Requires Dependabot
  # 2024-09+ which has docker-compose ecosystem GA.
  - package-ecosystem: "docker-compose"
    directory: "/compose"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "release"
    open-pull-requests-limit: 5
    reviewers:
      - "LucasSantana-Dev"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Dockerfile in homelab_manager/ (paperless-ngx build context)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "release"
    open-pull-requests-limit: 5
    reviewers:
      - "LucasSantana-Dev"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "release"
    open-pull-requests-limit: 5
    reviewers:
      - "LucasSantana-Dev"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(ci)"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

name: Main CI Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate script syntax
        run: |
          bash -n scripts/lib/github-api.sh
          bash -n scripts/maintenance/main-ci-watchdog.sh

      - name: Run main CI watchdog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/maintenance/main-ci-watchdog.sh
          scripts/maintenance/main-ci-watchdog.sh --fail-on-failure true

name: Main CI Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate script syntax
        run: |
          bash -n scripts/lib/github-api.sh
          bash -n scripts/maintenance/main-ci-watchdog.sh

      - name: Run main CI watchdog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/maintenance/main-ci-watchdog.sh
          scripts/maintenance/main-ci-watchdog.sh --fail-on-failure true

name: Main CI Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate script syntax
        run: |
          bash -n scripts/lib/github-api.sh
          bash -n scripts/maintenance/main-ci-watchdog.sh

      - name: Run main CI watchdog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/maintenance/main-ci-watchdog.sh
          scripts/maintenance/main-ci-watchdog.sh --fail-on-failure true

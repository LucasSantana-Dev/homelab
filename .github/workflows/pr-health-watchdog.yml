name: PR Health Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  pr-health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate script syntax
        run: |
          bash -n scripts/lib/github-api.sh
          bash -n scripts/maintenance/pr-health-watchdog.sh

      - name: Run PR health watchdog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOS_CSV: "LucasSantana-Dev/homelab,LucasSantana-Dev/Lucky"
        run: |
          chmod +x scripts/maintenance/pr-health-watchdog.sh
          scripts/maintenance/pr-health-watchdog.sh

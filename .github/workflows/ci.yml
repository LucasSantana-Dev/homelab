name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements-dev.txt
        pip install pre-commit

    # Run all quality checks via pre-commit for consistency with local development
    # This ensures the same checks run locally and in CI using a single source of truth
    - name: Run pre-commit checks
      run: |
        pre-commit run --all-files

    - name: Test with pytest
      continue-on-error: true
      run: |
        pytest tests/ --cov=homelab_manager --cov-report=xml --cov-report=html --tb=short -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up environment variables
      run: |
        cat > .env << EOF
        PUID=1000
        PGID=1000
        TIMEZONE=America/Sao_Paulo
        TAILSCALE_IP=127.0.0.1
        HOMEASSISTANT_PORT=8123
        PORTAINER_PORT=9000
        GRAFANA_PORT=3000
        PROMETHEUS_PORT=9090
        PIHOLE_PORT=8054
        UPTIME_KUMA_PORT=3001
        WHATS_UP_DOCKER_PORT=3003
        FILEBROWSER_PORT=80
        STREMIO_PORT=8080
        HOMEPAGE_PORT=3000
        DUCKDNS_TOKEN=dummy
        DUCKDNS_DOMAIN=example
        NETDATA_CLAIM_TOKEN=
        PIHOLE_WEB_PASSWORD=K4%*rG$$dB!&8$$3V9
        HOMEASSISTANT_KEY=VSx)5rVYP+wW?A#
        GRAFANA_PASSWORD=5Vn7W2x3AHNQ4yA
        EOF

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Compose
      run: |
        docker compose config

    - name: Test Docker Compose syntax
      run: |
        docker compose config --quiet

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements-dev.txt

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  container-security:
    runs-on: ubuntu-latest
    needs: docker

    steps:
    - uses: actions/checkout@v4

    - name: Set up environment variables
      run: |
        cat > .env << EOF
        PUID=1000
        PGID=1000
        TIMEZONE=America/Sao_Paulo
        TAILSCALE_IP=127.0.0.1
        HOMEASSISTANT_PORT=8123
        PORTAINER_PORT=9000
        GRAFANA_PORT=3000
        PROMETHEUS_PORT=9090
        PIHOLE_PORT=8054
        UPTIME_KUMA_PORT=3001
        WHATS_UP_DOCKER_PORT=3003
        FILEBROWSER_PORT=80
        STREMIO_PORT=8080
        HOMEPAGE_PORT=3000
        DUCKDNS_TOKEN=dummy
        DUCKDNS_DOMAIN=example
        NETDATA_CLAIM_TOKEN=
        PIHOLE_WEB_PASSWORD=K4%*rG$$dB!&8$$3V9
        HOMEASSISTANT_KEY=VSx)5rVYP+wW?A#
        GRAFANA_PASSWORD=5Vn7W2x3AHNQ4yA
        EOF

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run Trivy on Docker Compose config
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: 'docker-compose.yml'
        format: 'sarif'
        output: 'trivy-docker-config.sarif'

    - name: Scan container images
      run: |
        # Install Trivy using modern gpg method
        sudo apt-get update
        sudo apt-get install wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/trivy-archive-keyring.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy

        # Pull and scan images
        docker compose config --images | while read -r image; do
          if [ -n "$image" ] && [ "$image" != "<none>" ]; then
            echo "Scanning image: $image"
            trivy image --severity HIGH,CRITICAL --format sarif --output "trivy-image-$(echo $image | tr '/' '_' | tr ':' '_').sarif" "$image" || true
          fi
        done

    - name: Upload container security scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-docker-config.sarif'

  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements-dev.txt

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.0

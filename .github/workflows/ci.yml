name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, release ]
  pull_request:
    branches: [ main, develop, release ]

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Install gitleaks
      run: |
        GITLEAKS_VERSION=8.18.2
        TMP_DIR="$(mktemp -d)"
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C "${TMP_DIR}" gitleaks
        sudo install "${TMP_DIR}/gitleaks" /usr/local/bin/gitleaks
        rm -rf "${TMP_DIR}"
        gitleaks version

    - name: Run secret gate
      run: |
        ./scripts/security/secret-gate.sh

    - name: Run public safety gate
      run: |
        ./scripts/security/public-safety-gate.sh

  test:
    runs-on: ubuntu-latest
    needs: repo-hygiene
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install gitleaks
      run: |
        GITLEAKS_VERSION=8.18.2
        TMP_DIR="$(mktemp -d)"
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C "${TMP_DIR}" gitleaks
        sudo install "${TMP_DIR}/gitleaks" /usr/local/bin/gitleaks
        rm -rf "${TMP_DIR}"
        gitleaks version

    # Run all quality checks via pre-commit for consistency with local development
    # This ensures the same checks run locally and in CI using a single source of truth
    - name: Run pre-commit checks
      run: |
        pre-commit run --all-files

    - name: Test with pytest
      # H6 hardening: continue-on-error removed. Suite passes 183/183 locally
      # after the typer-based CLI rewrite landed in PR #75. The brittle
      # test_cpu_below_warning_threshold integration test skips on CI runners
      # (M7 hardening). If pytest fails here, the CI run must fail.
      run: |
        pytest tests/ --cov=homelab_manager --cov-report=xml --cov-report=html --cov-fail-under=70 --tb=short -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up environment variables
      run: |
        cat > .env << EOF
        PUID=1000
        PGID=1000
        TIMEZONE=America/Sao_Paulo
        TAILSCALE_IP=127.0.0.1
        DOMAIN=example.com
        HOMEASSISTANT_PORT=8123
        HOMEASSISTANT_KEY=dummy_key
        PORTAINER_PORT=9000
        GRAFANA_PORT=3002
        GRAFANA_PASSWORD=test_password_123
        PROMETHEUS_PORT=9091
        PIHOLE_WEB_PORT=8054
        PIHOLE_DNS_PORT=53
        PIHOLE_WEB_PASSWORD=test_password_123
        UPTIME_KUMA_PORT=3001
        WUD_PORT=3003
        FILEBROWSER_PORT=8081
        HOMEPAGE_PORT=3000
        NODE_EXPORTER_PORT=9100
        NETDATA_CLAIM_TOKEN=
        ALERTMANAGER_DISCORD_WEBHOOK=
        DOCKER_HUB_TOKEN=
        GITHUB_TOKEN=
        WUD_DISCORD_WEBHOOK_URL=
        WUD_SMTP_HOST=
        WUD_SMTP_PORT=
        WUD_SMTP_USER=
        WUD_SMTP_PASS=
        N8N_USER=admin
        N8N_PASSWORD=test_password_123
        NEXTCLOUD_DB_ROOT_PASSWORD=test_password_123
        NEXTCLOUD_DB_PASSWORD=test_password_123
        PAPERLESS_DB_PASSWORD=test_password_123
        PAPERLESS_SECRET_KEY=test_secret_key_123
        PAPERLESS_ADMIN_PASSWORD=test_password_123
        AUTHENTIK_SECRET_KEY=test_secret_key_123
        AUTHENTIK_DB_PASSWORD=test_password_123
        VAULTWARDEN_ADMIN_TOKEN=test_token_123
        FORGE_MCP_JWT_SECRET_KEY=test_forge_jwt_secret_key_123
        FORGE_MCP_BASIC_AUTH_PASSWORD=test_forge_basic_auth_password_123
        FORGE_MCP_ADMIN_PASSWORD=test_forge_admin_password_123
        CF_TUNNEL_TOKEN=test_cf_tunnel_token_123
        AUTHENTIK_GRAFANA_CLIENT_ID=test_authentik_client_id_123
        AUTHENTIK_GRAFANA_CLIENT_SECRET=test_authentik_client_secret_123
        EOF

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Validate Docker Compose configuration
      run: |
        docker compose config --quiet

  security:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'

  container-security:
    runs-on: ubuntu-latest
    needs: repo-hygiene
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up environment variables
      run: |
        cat > .env << EOF
        PUID=1000
        PGID=1000
        TIMEZONE=America/Sao_Paulo
        TAILSCALE_IP=127.0.0.1
        DOMAIN=example.com
        HOMEASSISTANT_PORT=8123
        HOMEASSISTANT_KEY=dummy_key
        PORTAINER_PORT=9000
        GRAFANA_PORT=3002
        GRAFANA_PASSWORD=test_password_123
        PROMETHEUS_PORT=9091
        PIHOLE_WEB_PORT=8054
        PIHOLE_DNS_PORT=53
        PIHOLE_WEB_PASSWORD=test_password_123
        UPTIME_KUMA_PORT=3001
        WUD_PORT=3003
        FILEBROWSER_PORT=8081
        HOMEPAGE_PORT=3000
        NODE_EXPORTER_PORT=9100
        NETDATA_CLAIM_TOKEN=
        ALERTMANAGER_DISCORD_WEBHOOK=
        DOCKER_HUB_TOKEN=
        GITHUB_TOKEN=
        WUD_DISCORD_WEBHOOK_URL=
        WUD_SMTP_HOST=
        WUD_SMTP_PORT=
        WUD_SMTP_USER=
        WUD_SMTP_PASS=
        N8N_USER=admin
        N8N_PASSWORD=test_password_123
        NEXTCLOUD_DB_ROOT_PASSWORD=test_password_123
        NEXTCLOUD_DB_PASSWORD=test_password_123
        PAPERLESS_DB_PASSWORD=test_password_123
        PAPERLESS_SECRET_KEY=test_secret_key_123
        PAPERLESS_ADMIN_PASSWORD=test_password_123
        AUTHENTIK_SECRET_KEY=test_secret_key_123
        AUTHENTIK_DB_PASSWORD=test_password_123
        VAULTWARDEN_ADMIN_TOKEN=test_token_123
        FORGE_MCP_JWT_SECRET_KEY=test_forge_jwt_secret_key_123
        FORGE_MCP_BASIC_AUTH_PASSWORD=test_forge_basic_auth_password_123
        FORGE_MCP_ADMIN_PASSWORD=test_forge_admin_password_123
        CF_TUNNEL_TOKEN=test_cf_tunnel_token_123
        AUTHENTIK_GRAFANA_CLIENT_ID=test_authentik_client_id_123
        AUTHENTIK_GRAFANA_CLIENT_SECRET=test_authentik_client_secret_123
        EOF

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Run Trivy on Docker Compose config
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: 'config'
        scan-ref: 'docker-compose.yml'
        format: 'sarif'
        output: 'trivy-docker-config.sarif'

    - name: Scan container images
      run: |
        # Install Trivy using modern gpg method
        sudo apt-get update
        sudo apt-get install wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/trivy-archive-keyring.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy

        # Pull and scan images
        docker compose config --images | while read -r image; do
          if [ -n "$image" ] && [ "$image" != "<none>" ]; then
            echo "Scanning image: $image"
            trivy image --severity HIGH,CRITICAL --format sarif --output "trivy-image-$(echo $image | tr '/' '_' | tr ':' '_').sarif" "$image" || true
          fi
        done

    - name: Upload container security scan results
      uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-docker-config.sarif'

  terraform-check:
    runs-on: ubuntu-latest
    needs: repo-hygiene
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

    - name: Terraform fmt check
      working-directory: infra/terraform
      run: |
        terraform fmt -check -recursive

    - name: Terraform init
      working-directory: infra/terraform
      run: |
        terraform init -backend=false

    - name: Terraform validate
      working-directory: infra/terraform
      run: |
        terraform validate

  pre-commit:
    runs-on: ubuntu-latest
    needs: repo-hygiene
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install gitleaks
      run: |
        GITLEAKS_VERSION=8.18.2
        TMP_DIR="$(mktemp -d)"
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C "${TMP_DIR}" gitleaks
        sudo install "${TMP_DIR}/gitleaks" /usr/local/bin/gitleaks
        rm -rf "${TMP_DIR}"
        gitleaks version

    - name: Run pre-commit
      uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

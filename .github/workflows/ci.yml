name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, release ]
  pull_request:
    branches: [ main, develop, release ]

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install gitleaks
      run: |
        GITLEAKS_VERSION=8.18.2
        TMP_DIR="$(mktemp -d)"
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C "${TMP_DIR}" gitleaks
        sudo install "${TMP_DIR}/gitleaks" /usr/local/bin/gitleaks
        rm -rf "${TMP_DIR}"
        gitleaks version

    - name: Run secret gate
      run: |
        ./scripts/security/secret-gate.sh

    - name: Run public safety gate
      run: |
        ./scripts/security/public-safety-gate.sh

  test:
    runs-on: ubuntu-latest
    needs: repo-hygiene
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install gitleaks
      run: |
        GITLEAKS_VERSION=8.18.2
        TMP_DIR="$(mktemp -d)"
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C "${TMP_DIR}" gitleaks
        sudo install "${TMP_DIR}/gitleaks" /usr/local/bin/gitleaks
        rm -rf "${TMP_DIR}"
        gitleaks version

    # Run all quality checks via pre-commit for consistency with local development
    # This ensures the same checks run locally and in CI using a single source of truth
    - name: Run pre-commit checks
      run: |
        pre-commit run --all-files

    - name: Test with pytest
      # H6 hardening: continue-on-error removed. Suite passes 183/183 locally
      # after the typer-based CLI rewrite landed in PR #75. The brittle
      # test_cpu_below_warning_threshold integration test skips on CI runners
      # (M7 hardening). If pytest fails here, the CI run must fail.
      # Coverage threshold 70: sync with pyproject.toml [tool.coverage.report] fail_under.
      run: |
        pytest tests/ --cov=homelab_manager --cov-report=xml --cov-report=html --cov-fail-under=70 --tb=short -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up environment variables
      run: |
        cat > .env << EOF
        PUID=1000
        PGID=1000
        TIMEZONE=America/Sao_Paulo
        TAILSCALE_IP=127.0.0.1
        DOMAIN=example.com
        HOMEASSISTANT_PORT=8123
        HOMEASSISTANT_KEY=dummy_key
        PORTAINER_PORT=9000
        GRAFANA_PORT=3002
        GRAFANA_PASSWORD=test_password_123
        PROMETHEUS_PORT=9091
        PIHOLE_WEB_PORT=8054
        PIHOLE_DNS_PORT=53
        PIHOLE_WEB_PASSWORD=test_password_123
        UPTIME_KUMA_PORT=3001
        WUD_PORT=3003
        FILEBROWSER_PORT=8081
        HOMEPAGE_PORT=3000
        NODE_EXPORTER_PORT=9100
        NETDATA_CLAIM_TOKEN=
        ALERTMANAGER_DISCORD_WEBHOOK=
        DOCKER_HUB_TOKEN=
        GITHUB_TOKEN=
        WUD_DISCORD_WEBHOOK_URL=
        WUD_SMTP_HOST=
        WUD_SMTP_PORT=
        WUD_SMTP_USER=
        WUD_SMTP_PASS=
        N8N_USER=admin
        N8N_PASSWORD=test_password_123
        NEXTCLOUD_DB_ROOT_PASSWORD=test_password_123
        NEXTCLOUD_DB_PASSWORD=test_password_123
        PAPERLESS_DB_PASSWORD=test_password_123
        PAPERLESS_SECRET_KEY=test_secret_key_123
        PAPERLESS_ADMIN_PASSWORD=test_password_123
        HEALTHCHECKS_DB_PASSWORD=test_password_123
        HEALTHCHECKS_SECRET_KEY=test_secret_key_123
        HEALTHCHECKS_SUPERUSER_EMAIL=admin@example.com
        HEALTHCHECKS_SUPERUSER_PASSWORD=test_password_123
        KOPIA_REPO_PASSWORD=test_password_123
        KOPIA_SERVER_PASSWORD=test_password_123
        TINYAUTH_ALLOWED_EMAILS=admin@example.com
        GITHUB_CLIENT_ID=test_client_id_123
        GITHUB_CLIENT_SECRET=test_client_secret_123
        GOOGLE_CLIENT_ID=test_client_id_123
        GOOGLE_CLIENT_SECRET=test_client_secret_123
        BIND_IP=127.0.0.1
        CLOUDFLARED_TUNNEL_TOKEN=test_cf_tunnel_token_123
        FORGE_MCP_JWT_SECRET_KEY=test_forge_jwt_secret_key_123
        FORGE_MCP_BASIC_AUTH_PASSWORD=test_forge_basic_auth_password_123
        FORGE_MCP_ADMIN_PASSWORD=test_forge_admin_password_123
        EOF

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Validate Docker Compose configuration
      run: |
        docker compose config --quiet

  security:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        # Mirrors the exclusions formerly in .snyk (removed per ADR-0014):
        # archive/** is reverted k3s history (ADR-0004), paperless-ngx is an
        # upstream image whose base CVEs are upstream-owned. Neither is deployed
        # from source here, so findings there are not actionable.
        skip-dirs: 'archive,dockerfiles/paperless-ngx'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'

  container-security:
    runs-on: ubuntu-latest
    needs: repo-hygiene
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up environment variables
      run: |
        cat > .env << EOF
        PUID=1000
        PGID=1000
        TIMEZONE=America/Sao_Paulo
        TAILSCALE_IP=127.0.0.1
        DOMAIN=example.com
        HOMEASSISTANT_PORT=8123
        HOMEASSISTANT_KEY=dummy_key
        PORTAINER_PORT=9000
        GRAFANA_PORT=3002
        GRAFANA_PASSWORD=test_password_123
        PROMETHEUS_PORT=9091
        PIHOLE_WEB_PORT=8054
        PIHOLE_DNS_PORT=53
        PIHOLE_WEB_PASSWORD=test_password_123
        UPTIME_KUMA_PORT=3001
        WUD_PORT=3003
        FILEBROWSER_PORT=8081
        HOMEPAGE_PORT=3000
        NODE_EXPORTER_PORT=9100
        NETDATA_CLAIM_TOKEN=
        ALERTMANAGER_DISCORD_WEBHOOK=
        DOCKER_HUB_TOKEN=
        GITHUB_TOKEN=
        WUD_DISCORD_WEBHOOK_URL=
        WUD_SMTP_HOST=
        WUD_SMTP_PORT=
        WUD_SMTP_USER=
        WUD_SMTP_PASS=
        N8N_USER=admin
        N8N_PASSWORD=test_password_123
        NEXTCLOUD_DB_ROOT_PASSWORD=test_password_123
        NEXTCLOUD_DB_PASSWORD=test_password_123
        PAPERLESS_DB_PASSWORD=test_password_123
        PAPERLESS_SECRET_KEY=test_secret_key_123
        PAPERLESS_ADMIN_PASSWORD=test_password_123
        HEALTHCHECKS_DB_PASSWORD=test_password_123
        HEALTHCHECKS_SECRET_KEY=test_secret_key_123
        HEALTHCHECKS_SUPERUSER_EMAIL=admin@example.com
        HEALTHCHECKS_SUPERUSER_PASSWORD=test_password_123
        KOPIA_REPO_PASSWORD=test_password_123
        KOPIA_SERVER_PASSWORD=test_password_123
        TINYAUTH_ALLOWED_EMAILS=admin@example.com
        GITHUB_CLIENT_ID=test_client_id_123
        GITHUB_CLIENT_SECRET=test_client_secret_123
        GOOGLE_CLIENT_ID=test_client_id_123
        GOOGLE_CLIENT_SECRET=test_client_secret_123
        BIND_IP=127.0.0.1
        CLOUDFLARED_TUNNEL_TOKEN=test_cf_tunnel_token_123
        FORGE_MCP_JWT_SECRET_KEY=test_forge_jwt_secret_key_123
        FORGE_MCP_BASIC_AUTH_PASSWORD=test_forge_basic_auth_password_123
        FORGE_MCP_ADMIN_PASSWORD=test_forge_admin_password_123
        EOF

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Run Trivy on Docker Compose config
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'config'
        scan-ref: 'docker-compose.yml'
        format: 'sarif'
        output: 'trivy-docker-config.sarif'

    - name: Verify image tags exist (ADR-0013 compensating control)
      run: |
        # A non-existent image tag passes `docker compose config` (valid syntax) but
        # fails at deploy-time pull — which would break prod (ADR-0013 supersede; PR
        # #230 shipped homepage v1.1.0 / wud 6.7.0 / caddy 2.10.4, none of which exist).
        # Fail the build here, pre-merge. Locally-built images (a `build:` section, e.g.
        # homelab-manager:local) are skipped — they aren't on a registry.
        set -uo pipefail
        built=$(docker compose config --format json 2>/dev/null \
          | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(s.get('image','') for s in d.get('services',{}).values() if s.get('build')))" 2>/dev/null || true)
        fail=0
        # process substitution keeps the loop in the parent shell so `fail` propagates
        while read -r image; do
          [ -z "$image" ] && continue
          case " $built " in *" $image "*) echo "  - skip (built locally): $image"; continue ;; esac
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "  ✓ exists: $image"
          else
            echo "::error::image tag does not exist on its registry: $image"
            fail=1
          fi
        done < <(docker compose config --images | sort -u)
        if [ "$fail" -ne 0 ]; then
          echo "❌ one or more image tags do not exist — fix the tag (compose default or .env) before merge."
          exit 1
        fi
        echo "✅ all referenced image tags exist on their registries"

    - name: Scan container images
      run: |
        # Install Trivy using modern gpg method
        sudo apt-get update
        sudo apt-get install wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/trivy-archive-keyring.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy

        # Pull and scan images
        docker compose config --images | while read -r image; do
          if [ -n "$image" ] && [ "$image" != "<none>" ]; then
            echo "Scanning image: $image"
            trivy image --severity HIGH,CRITICAL --format sarif --output "trivy-image-$(echo $image | tr '/' '_' | tr ':' '_').sarif" "$image" || true
          fi
        done

    - name: Upload container security scan results
      uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-docker-config.sarif'

  terraform-check:
    runs-on: ubuntu-latest
    needs: repo-hygiene
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

    - name: Terraform fmt check
      working-directory: infra/terraform
      run: |
        terraform fmt -check -recursive

    - name: Terraform init
      working-directory: infra/terraform
      run: |
        terraform init -backend=false

    - name: Terraform validate
      working-directory: infra/terraform
      run: |
        terraform validate

  pre-commit:
    runs-on: ubuntu-latest
    needs: repo-hygiene
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install gitleaks
      run: |
        GITLEAKS_VERSION=8.18.2
        TMP_DIR="$(mktemp -d)"
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C "${TMP_DIR}" gitleaks
        sudo install "${TMP_DIR}/gitleaks" /usr/local/bin/gitleaks
        rm -rf "${TMP_DIR}"
        gitleaks version

    - name: Run pre-commit
      uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

name: PR Body Secret Guard

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-metadata-guard:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate guard script syntax
        run: bash -n scripts/maintenance/guard-pr-body.sh

      - name: Scan pull request title/body
        if: github.event_name == 'pull_request_target'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          chmod +x scripts/maintenance/guard-pr-body.sh
          scripts/maintenance/guard-pr-body.sh --title "$PR_TITLE" --body "$PR_BODY"

      - name: Scan issue/PR comment body
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          chmod +x scripts/maintenance/guard-pr-body.sh
          scripts/maintenance/guard-pr-body.sh --body "$COMMENT_BODY"

name: Access Coverage Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday

permissions:
  contents: read

jobs:
  access-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run access coverage check
        run: python3 scripts/security/access-coverage-check.py

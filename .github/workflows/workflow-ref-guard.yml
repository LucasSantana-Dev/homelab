name: Workflow Ref Guard

on:
  workflow_dispatch:
    inputs:
      enforce_pinned:
        description: "Require full SHA-pinned action refs"
        required: false
        default: "false"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/maintenance/workflow-ref-guard.sh"

permissions:
  contents: read
  pull-requests: write

jobs:
  workflow-ref-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate script syntax
        run: bash -n scripts/maintenance/workflow-ref-guard.sh

      - name: Collect changed workflow files
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          mapfile -t changed_workflows < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- ".github/workflows/*.yml" ".github/workflows/*.yaml")
          if [[ ${#changed_workflows[@]} -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          {
            echo "changed_files<<EOF"
            printf "%s\n" "${changed_workflows[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run workflow reference guard
        id: guard
        if: github.event_name == 'workflow_dispatch' || steps.changed.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          chmod +x scripts/maintenance/workflow-ref-guard.sh
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.enforce_pinned || 'false' }}" == "true" ]]; then
            args+=(--enforce-pinned)
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            mapfile -t changed_workflows <<< "${{ steps.changed.outputs.changed_files }}"
            set +e
            output="$(scripts/maintenance/workflow-ref-guard.sh "${args[@]}" "${changed_workflows[@]}" 2>&1)"
            status=$?
            set -e
            printf "%s\n" "$output"
            {
              if [[ $status -eq 0 ]]; then
                echo "failed=false"
              else
                echo "failed=true"
              fi
              echo "log<<EOF"
              printf "%s\n" "$output"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            set +e
            output="$(scripts/maintenance/workflow-ref-guard.sh "${args[@]}" 2>&1)"
            status=$?
            set -e
            printf "%s\n" "$output"
            {
              if [[ $status -eq 0 ]]; then
                echo "failed=false"
              else
                echo "failed=true"
              fi
              echo "log<<EOF"
              printf "%s\n" "$output"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when no workflow files changed
        if: github.event_name == 'pull_request' && steps.changed.outputs.has_changes != 'true'
        run: echo "No workflow files changed; skipping reference checks."

      - name: Comment fix suggestions on PR
        if: github.event_name == 'pull_request' && steps.guard.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GUARD_LOG: ${{ steps.guard.outputs.log }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import textwrap
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          marker = "<!-- workflow-ref-guard -->"
          guard_log = os.environ.get("GUARD_LOG", "").strip()

          comment_body = textwrap.dedent(
              f"""\
              {marker}
              ## Workflow Ref Guard failed

              I detected mutable workflow references in changed files.

              ### How to fix
              - Replace major tags like @v4 with a full 40-char commit SHA.
              - Replace symbolic refs (@main, @master, @latest) with immutable SHA pins.
              - Replace docker://...:latest with an immutable image tag or digest.

              <details>
              <summary>Guard output</summary>

              ```
              {guard_log}
              ```

              </details>
              """
          )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "workflow-ref-guard",
          }

          def request(method: str, path: str, payload=None):
              url = f"https://api.github.com{path}"
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method)
              for key, value in headers.items():
                  req.add_header(key, value)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  if exc.code in {403, 404}:
                      print(f"Skipping comment update due to API permission/state: HTTP {exc.code}")
                      raise SystemExit(0)
                  raise

          comments = request("GET", f"/repos/{repo}/issues/{pr_number}/comments?per_page=100")
          existing = None
          for comment in comments:
              if marker in comment.get("body", ""):
                  existing = comment
                  break

          if existing:
              request("PATCH", f"/repos/{repo}/issues/comments/{existing['id']}", {"body": comment_body})
              print("Updated existing workflow-ref-guard comment.")
          else:
              request("POST", f"/repos/{repo}/issues/{pr_number}/comments", {"body": comment_body})
              print("Created workflow-ref-guard comment.")
          PY

      - name: Fail when violations are found
        if: steps.guard.outputs.failed == 'true'
        run: exit 3

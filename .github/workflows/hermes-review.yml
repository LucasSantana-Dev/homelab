name: Hermes PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main, develop, release]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  hermes-review:
    # Runs on the homelab self-hosted runner (luk-server).
    # Label set during runner registration: ./config.sh --labels homelab
    runs-on: [self-hosted, homelab]
    # SECURITY: this job runs on a self-hosted runner on a PUBLIC repo and checks
    # out the PR merge ref, so a fork PR could otherwise run attacker-modified
    # code on the homelab host. Only run for same-repo (internal) PRs and manual
    # dispatch; never for forks.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    # Only one review per PR at a time
    concurrency:
      # Fall back to the workflow_dispatch input so manual runs don't all share
      # the empty group "hermes-review-" and cancel each other (#310).
      group: hermes-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run hermes review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          REPO: ${{ github.repository }}
        run: |
          bash scripts/agent-tasks/hermes-pr-review.sh "$PR_NUMBER" "$BASE_REF" "$REPO"

# SOPS config for age-encrypted secrets.
#
# The PUBLIC age recipient below encrypts `.env.enc` (and the config rules).
# The matching PRIVATE key lives only at `~/.config/sops/age/keys.txt` on the
# deploy host — it is NEVER committed and MUST be backed up off-host (password
# manager); it is the sole key that can decrypt `.env.enc`. See docs/secrets.md.
#
# The agent-box recipient is a second, narrower key. It is mounted into the
# agent-box container and can decrypt ONLY secrets/agent-box.secrets.yaml.age.
# Its private half lives at `~/.config/sops/age/agent-box.key` on the deploy
# host. That file is also encrypted to the master key, so the host
# (scripts/agent-tasks/common.sh) and the owner can still read and edit it.
keys:
  - &age_key_local 'age19pjf4fw094vcsmrwr8usm3gvqmlvz8elt23zk52ltaavv03y7s8qgg906q'
  - &age_key_agent_box 'REPLACE_WITH_AGENT_BOX_AGE_PUBLIC_KEY'

creation_rules:
  - path_regex: ^secrets/agent-box\.secrets\.yaml\.age$
    key_groups:
      - age:
          - *age_key_local
          - *age_key_agent_box
  - path_regex: ^\.env\.enc$
    key_groups:
      - age:
          - *age_key_local
  - path_regex: ^config/.*/.*\.enc\.yaml$
    key_groups:
      - age:
          - *age_key_local
  - path_regex: ^docker-compose\..*\.enc\.yml$
    key_groups:
      - age:
          - *age_key_local

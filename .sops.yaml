# SOPS config for age-encrypted secrets.
#
# IMPORTANT: the `age1…` value below is a placeholder. It is NOT a valid
# age recipient and `sops -e` against it will fail. Before using SOPS in
# this repo, follow `docs/secrets.md` §Setup to generate a real key and
# replace the placeholder with the PUBLIC half (the line `# public key:
# age1…` printed by `age-keygen`). The matching private key must stay
# local at `~/.config/sops/age/keys.txt` and never be committed.
keys:
  - &age_key_local 'age1PLACEHOLDER_NOT_A_REAL_KEY_see_docs_secrets_md_for_setup'

creation_rules:
  - path_regex: ^\.env\.enc$
    key_groups:
      - age:
          - *age_key_local
  - path_regex: ^config/.*/.*\.enc\.yaml$
    key_groups:
      - age:
          - *age_key_local
  - path_regex: ^docker-compose\..*\.enc\.yml$
    key_groups:
      - age:
          - *age_key_local

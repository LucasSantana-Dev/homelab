# SOPS config for age-encrypted secrets.
#
# The PUBLIC age recipient below encrypts `.env.enc` (and the config rules).
# The matching PRIVATE key lives only at `~/.config/sops/age/keys.txt` on the
# deploy host — it is NEVER committed and MUST be backed up off-host (password
# manager); it is the sole key that can decrypt `.env.enc`. See docs/secrets.md.
keys:
  - &age_key_local 'age19pjf4fw094vcsmrwr8usm3gvqmlvz8elt23zk52ltaavv03y7s8qgg906q'

creation_rules:
  - path_regex: ^\.env\.enc$
    key_groups:
      - age:
          - *age_key_local
  - path_regex: ^config/.*/.*\.enc\.yaml$
    key_groups:
      - age:
          - *age_key_local
  - path_regex: ^docker-compose\..*\.enc\.yml$
    key_groups:
      - age:
          - *age_key_local

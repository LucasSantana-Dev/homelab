# Home Assistant Dashboard Configuration
# Using Mushroom Cards, button-card, mini-graph-card, and UI Lovelace Minimalist

title: Home Dashboard
views:
  - title: Home
    path: home
    icon: mdi:home
    cards:
      # Header with weather and time
      - type: custom:mushroom-template-card
        primary: "{{ now().strftime('%A, %B %d, %Y') }}"
        secondary: "{{ states('weather.home') }}"
        icon: mdi:weather-partly-cloudy
        icon_color: blue
        layout: horizontal

      # Quick Actions Row
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: light.living_room
            name: Living Room
            icon: mdi:lightbulb
            show_state: true
            state_display: |
              [[[
                if (entity.state === 'on') return 'ON';
                return 'OFF';
              ]]]
            styles:
              card:
                - height: 80px
                - background: |
                    [[[
                      if (entity.state === 'on') return 'linear-gradient(135deg, #FFD700, #FFA500)';
                      return 'linear-gradient(135deg, #2C3E50, #34495E)';
                    ]]]
                - color: white
                - border-radius: 12px
                - box-shadow: |
                    [[[
                      if (entity.state === 'on') return '0 4px 20px rgba(255, 215, 0, 0.3)';
                      return '0 4px 20px rgba(0, 0, 0, 0.1)';
                    ]]]

          - type: custom:button-card
            entity: switch.coffee_maker
            name: Coffee
            icon: mdi:coffee
            show_state: true
            state_display: |
              [[[
                if (entity.state === 'on') return 'BREWING';
                return 'READY';
              ]]]
            styles:
              card:
                - height: 80px
                - background: |
                    [[[
                      if (entity.state === 'on') return 'linear-gradient(135deg, #8B4513, #A0522D)';
                      return 'linear-gradient(135deg, #2C3E50, #34495E)';
                    ]]]
                - color: white
                - border-radius: 12px

          - type: custom:button-card
            entity: fan.bedroom_fan
            name: Fan
            icon: mdi:fan
            show_state: true
            state_display: |
              [[[
                if (entity.state === 'on') return 'ON';
                return 'OFF';
              ]]]
            styles:
              card:
                - height: 80px
                - background: |
                    [[[
                      if (entity.state === 'on') return 'linear-gradient(135deg, #3498DB, #2980B9)';
                      return 'linear-gradient(135deg, #2C3E50, #34495E)';
                    ]]]
                - color: white
                - border-radius: 12px

      # Climate Control Section
      - type: custom:mushroom-climate-card
        entity: climate.living_room
        name: Living Room Climate
        icon: mdi:thermostat
        hvac_modes:
          - heat
          - cool
          - auto
          - off
        show_temperature_control: true
        collapsible_controls: true

      # Energy Monitoring with Mini Graph
      - type: custom:mini-graph-card
        entities:
          - sensor.power_consumption
          - sensor.solar_production
        name: Energy Usage
        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        smoothing: true
        show:
          - name
          - icon
          - state
          - graph
        color_thresholds:
          - value: 0
            color: green
          - value: 1000
            color: orange
          - value: 2000
            color: red
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
              color: white;
              border-radius: 12px;
            }

      # Security Section
      - type: custom:mushroom-alarm-card
        entity: alarm_control_panel.home
        name: Home Security
        icon: mdi:shield-home
        states:
          - arm_home
          - arm_away
          - arm_night
          - arm_vacation
        collapsible_controls: true

      # Room Status Grid
      - type: grid
        columns: 2
        square: false
        cards:
          # Living Room
          - type: custom:mushroom-entity-card
            entity: light.living_room
            name: Living Room
            icon: mdi:sofa
            secondary_info: last-updated
            layout: horizontal
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
                  color: white;
                  border-radius: 12px;
                }

          # Kitchen
          - type: custom:mushroom-entity-card
            entity: sensor.kitchen_temperature
            name: Kitchen
            icon: mdi:chef-hat
            secondary_info: state
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
                  color: white;
                  border-radius: 12px;
                }

          # Bedroom
          - type: custom:mushroom-entity-card
            entity: light.bedroom
            name: Bedroom
            icon: mdi:bed
            secondary_info: last-updated
            layout: horizontal
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
                  color: #333;
                  border-radius: 12px;
                }

          # Office
          - type: custom:mushroom-entity-card
            entity: sensor.office_humidity
            name: Office
            icon: mdi:desktop-classic
            secondary_info: state
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
                  color: #333;
                  border-radius: 12px;
                }

      # Media Control
      - type: custom:mushroom-media-player-card
        entity: media_player.living_room_tv
        name: Living Room TV
        icon: mdi:television
        use_media_info: true
        show_volume_level: true
        collapsible_controls: true

      # Weather Information
      - type: custom:mushroom-template-card
        primary: "{{ states('weather.home') }}"
        secondary: |
          {{ states('sensor.temperature') }}°C
          {{ states('sensor.humidity') }}% humidity
        icon: mdi:weather-partly-cloudy
        icon_color: |
          [[[
            if (states['weather.home'].state.includes('sunny')) return 'orange';
            if (states['weather.home'].state.includes('cloudy')) return 'grey';
            if (states['weather.home'].state.includes('rainy')) return 'blue';
            return 'white';
          ]]]
        layout: horizontal
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
              color: white;
              border-radius: 12px;
            }

      # System Status
      - type: custom:mushroom-template-card
        primary: "System Status"
        secondary: |
          Home Assistant: {{ states('sensor.home_assistant_version') }}
          Last Update: {{ states('sensor.last_boot') }}
        icon: mdi:home-assistant
        icon_color: green
        layout: horizontal
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
              color: white;
              border-radius: 12px;
            }

      # Quick Scene Controls
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            name: Movie Night
            icon: mdi:movie
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.movie_night
            styles:
              card:
                - height: 60px
                - background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                - color: white
                - border-radius: 8px

          - type: custom:button-card
            name: Sleep Mode
            icon: mdi:sleep
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.sleep_mode
            styles:
              card:
                - height: 60px
                - background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
                - color: white
                - border-radius: 8px

          - type: custom:button-card
            name: All Off
            icon: mdi:power
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.all_off
            styles:
              card:
                - height: 60px
                - background: linear-gradient(135deg, #2C3E50 0%, #34495E 100%);
                - color: white
                - border-radius: 8px

  # Second View - Detailed Monitoring
  - title: Monitoring
    path: monitoring
    icon: mdi:chart-line
    cards:
      # Temperature Graph
      - type: custom:mini-graph-card
        entities:
          - sensor.living_room_temperature
          - sensor.bedroom_temperature
          - sensor.kitchen_temperature
        name: Temperature Monitoring
        hours_to_show: 48
        points_per_hour: 1
        line_width: 3
        smoothing: true
        show:
          - name
          - icon
          - state
          - graph
        color_thresholds:
          - value: 15
            color: blue
          - value: 20
            color: green
          - value: 25
            color: orange
          - value: 30
            color: red

      # Power Consumption Graph
      - type: custom:mini-graph-card
        entities:
          - sensor.power_consumption
        name: Power Consumption
        hours_to_show: 168  # 1 week
        points_per_hour: 0.5
        line_width: 2
        smoothing: true
        show:
          - name
          - icon
          - state
          - graph
        color_thresholds:
          - value: 0
            color: green
          - value: 1000
            color: yellow
          - value: 2000
            color: red

      # System Resources
      - type: grid
        columns: 2
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.cpu_usage
            name: CPU Usage
            icon: mdi:cpu-64-bit
            secondary_info: state

          - type: custom:mushroom-entity-card
            entity: sensor.memory_usage
            name: Memory Usage
            icon: mdi:memory
            secondary_info: state

          - type: custom:mushroom-entity-card
            entity: sensor.disk_usage
            name: Disk Usage
            icon: mdi:harddisk
            secondary_info: state

          - type: custom:mushroom-entity-card
            entity: sensor.network_speed
            name: Network Speed
            icon: mdi:network
            secondary_info: state

  # Third View - Settings
  - title: Settings
    path: settings
    icon: mdi:cog
    cards:
      # System Information
      - type: custom:mushroom-template-card
        primary: "Home Assistant Information"
        secondary: |
          Version: {{ states('sensor.home_assistant_version') }}
          Last Update: {{ states('sensor.last_boot') }}
          Uptime: {{ states('sensor.uptime') }}
        icon: mdi:information
        icon_color: blue

      # Backup Controls
      - type: custom:button-card
        name: Create Backup
        icon: mdi:backup-restore
        tap_action:
          action: call-service
          service: hassio.backup_full
        styles:
          card:
            - height: 60px
            - background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
            - color: white
            - border-radius: 8px

      # Restart Services
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            name: Restart HA
            icon: mdi:restart
            tap_action:
              action: call-service
              service: homeassistant.restart
            styles:
              card:
                - height: 60px
                - background: linear-gradient(135deg, #e17055 0%, #d63031 100%);
                - color: white
                - border-radius: 8px

          - type: custom:button-card
            name: Reload Config
            icon: mdi:reload
            tap_action:
              action: call-service
              service: homeassistant.reload_config
            styles:
              card:
                - height: 60px
                - background: linear-gradient(135deg, #fdcb6e 0%, #e17055 100%);
                - color: white
                - border-radius: 8px

# Global Dashboard Configuration
lovelace:
  mode: yaml
  resources:
    - url: /hacsfiles/mushroom/mushroom.js
      type: module
    - url: /hacsfiles/button-card/button-card.js
      type: module
    - url: /hacsfiles/mini-graph-card/mini-graph-card-bundle.js
      type: module
    - url: /hacsfiles/ui-lovelace-minimalist/ui-lovelace-minimalist.js
      type: module

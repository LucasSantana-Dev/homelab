# Pre-commit hooks for Homelab Manager
# See https://pre-commit.com for more information

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(config/homeassistant/|archive/k8s-dropped/)
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: debug-statements
      - id: check-docstring-first

  # Python formatting
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--config=.flake8]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML]
        args: [--ignore-missing-imports, --config-file=pyproject.toml]
        exclude: ^tests/  # Exclude tests directory

  # Security
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        exclude: tests/
        additional_dependencies: ['bandit[toml]', 'pbr']

  # Docker
  #
  # Local hook rather than the upstream repo: hadolint's own `hadolint-docker`
  # hook hardcodes `ghcr.io/hadolint/hadolint:latest` in its entry, and
  # pre-commit does not allow overriding `entry` for a remote hook. So `rev:
  # v2.12.0` pinned the hook *definition* while the actual linter floated -
  # :latest rolled to 2.15.0, which added two rules that fail Dockerfiles nobody
  # had touched, and every PR went red at once.
  #
  # Pinned by digest (= 2.15.0, the build CI was already running) so the linter
  # only changes when we change it. Note this is not simply "the old version":
  # 2.12.0 is clean on the two files below but flags DL3006 and SC2015 on two
  # others, so rolling back trades one red for another.
  #
  # To bump: docker pull ghcr.io/hadolint/hadolint:<tag> && docker inspect
  # ghcr.io/hadolint/hadolint:<tag> --format '{{index .RepoDigests 0}}'
  - repo: local
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles
        language: docker_image
        types: ["dockerfile"]
        entry: ghcr.io/hadolint/hadolint@sha256:78cefa24d67e95cac4cdc388652068d0be545bd2926fcbec6f95c1a751d5da32 hadolint
        args: [--ignore, DL3008, --ignore, DL3009]

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-e, SC1091, -e, SC2034, -e, SC2155, -e, SC2164, -e, SC2001, -e, SC2126, -e, SC2016, -e, SC2094]

  # YAML
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, relaxed]
        exclude: ^archive/k8s-dropped/

  # Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [--disable, MD013]

  # Commit message
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Local security gates (require gitleaks installed on host)
  - repo: local
    hooks:
      - id: gitleaks-secret-gate
        name: gitleaks secret gate (tracked snapshot)
        entry: ./scripts/security/secret-gate.sh
        language: system
        pass_filenames: false
      - id: public-safety-gate
        name: public identifier safety gate
        entry: ./scripts/security/public-safety-gate.sh
        language: system
        pass_filenames: false

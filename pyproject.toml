[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-manager"
version = "2.4.0"
description = "Modern homelab management CLI"
authors = [{name = "Luk Homelab", email = "luk@homelab.com"}]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # CLI and UI
    "typer[all]>=0.12.0",
    "rich>=13.8.0",
    # Docker integration
    "docker>=7.1.0",
    # HTTP requests
    "requests>=2.32.0",
    # YAML parsing
    "pyyaml>=6.0.0",
    # System monitoring
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",
    # Linting and Code Quality
    "black>=24.8.0",
    "isort>=5.13.0",
    "flake8>=7.1.0",
    "mypy>=1.11.0",
    "pylint>=3.2.0",
    # Pre-commit hooks
    "pre-commit>=3.8.0",
    # Security
    "bandit>=1.7.0",
    "safety>=3.2.0",
    # Type stubs for mypy
    "types-requests>=2.32.0",
    "types-docker>=7.1.0",
    "types-PyYAML>=6.0.0",
]
docs = [
    "sphinx>=7.4.0",
    "sphinx-rtd-theme>=2.0.0",
]
profile = [
    "memory-profiler>=0.61.0",
    "line-profiler>=4.1.0",
]

[project.scripts]
homelab = "homelab_manager.cli:main"

[tool.setuptools.packages.find]
include = ["homelab_manager*"]
exclude = ["tests*", "docs*", "config*", "appdata*", "backups*", "logs*", "compose*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
extend-exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.venv
    | venv
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
skip = [".git", ".mypy_cache", ".pytest_cache", ".venv", "venv", "build", "dist"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
explicit_package_bases = true
exclude = [
    "tests/",
    "venv/",
    ".venv/",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601", "B404", "B603", "B607", "B102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["homelab_manager"]
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
# Wave 5: enforce a floor so coverage regressions surface in CI.
# CI also passes --cov-fail-under=70 — keep the two in sync.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
